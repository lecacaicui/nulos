<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Champ de bataille</title>
  <link rel="stylesheet" href="../style/style.css">
  
  <!-- Script d'initialisation du thème pour éviter le flash blanc -->
  <script>
  (function(){
    var t = localStorage.getItem('theme_couleurs');
    if (!t) return;
    try {
      var c = JSON.parse(t);
      var r = document.documentElement.style;
      r.setProperty('--couleur-fond', c.couleur_fond);
      r.setProperty('--couleur-conteneur', c.couleur_conteneur);
      r.setProperty('--couleur-bordure', c.couleur_bordure);
      r.setProperty('--couleur-bouton', c.couleur_bouton);
      var h = c.couleur_fond.replace('#','');
      var lum = (0.299*parseInt(h.substring(0,2),16) + 0.587*parseInt(h.substring(2,4),16) + 0.114*parseInt(h.substring(4,6),16)) / 255;
      r.setProperty('--couleur-texte', lum < 0.5 ? '#f1f1f1' : '#1a1a1a');
      r.setProperty('--couleur-texte-faible', lum < 0.5 ? '#9ca3af' : '#6b7280');
    } catch(e) {}
  })();
  </script>

  <style>body { visibility: hidden; }</style>
  
  <!-- Styles spécifiques à la page "Champ" -->
  <style>
    .champ-wrap { 
      width: 100%; 
      padding: 2rem 2.5rem 6rem; 
    }
    .champ-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 2rem;
      align-items: start;
    }
    .zone-principale {
      background: var(--couleur-conteneur);
      border: 1px solid var(--var-couleur-bordure, var(--couleur-bordure));
      border-radius: 12px;
      padding: 2rem;
    }
    .zone-statut {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .panneau-info {
      background: var(--couleur-conteneur);
      border: 1px solid var(--couleur-bordure);
      border-radius: 12px;
      padding: 1.2rem;
    }
    .champ-titre {
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--couleur-texte);
    }
    .champ-description {
      font-size: 0.9rem;
      color: var(--couleur-texte-faible);
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    @media (max-width: 900px) {
      .champ-layout { grid-template-columns: 1fr; }
      .champ-wrap { padding: 1rem 1rem 6rem; }
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <div class="champ-wrap">
      <div class="champ-layout">
        
        <!-- Zone principale de contenu -->
        <div class="zone-principale">
          <h1 class="champ-titre">⚔️ Le Champ</h1>
          <p class="champ-description">
            Bienvenue sur le champ. Cette zone dynamique est prête à accueillir les fonctionnalités spécifiques de votre nouveau module ou mini-jeu.
          </p>
          
          <!-- Contenu à personnaliser ou à dynamiser -->
          <div class="btn-group" style="max-width: 200px;">
            <button class="btn btn-primary" id="btn-action">Action Principale</button>
          </div>
        </div>

        <!-- Colonne latérale / Panneau d'informations -->
        <div class="zone-statut">
          <div class="panneau-info">
            <h2 style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: .05em; color: var(--couleur-texte-faible); margin-bottom: 0.75rem;">
              ℹ️ Informations de session
            </h2>
            <div style="font-size: 0.9rem; display: flex; flex-direction: column; gap: 0.5rem;">
              <div>Joueur : <span id="joueur-nom" style="font-weight: 600;">...</span></div>
              <div style="font-size: 0.8rem; color: var(--couleur-texte-faible);">Statut : En ligne</div>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
    import { chargerHeader, chargerFooter, appliquerTheme } from '../script/header.js'

    const db = createClient('https://uqjciekcfrxscfwztttt.supabase.co', 'sb_publishable_Ly-L4hecBE_r-k4qd5zTkQ_VmaKUASz')

    ;(async () => {
      // Redirection si le visiteur n'est pas authentifié
      if (!localStorage.getItem('username')) {
        window.location.href = 'connexion.html'
        return
      }

      // Rendre le body visible une fois le thème initialisé
      document.body.style.setProperty('visibility', 'visible', 'important')
      appliquerTheme()
      
      // Chargement dynamique des layouts globaux (avec le chemin relatif parent '../')
      await chargerHeader('../')
      await chargerFooter('../')

      // Récupération et affichage du pseudonyme local
      const username = localStorage.getItem('username')
      document.getElementById('joueur-nom').textContent = username

      // Logique initiale de votre page
      initChamp()
    })()

    function initChamp() {
      const btn = document.getElementById('btn-action')
      btn.addEventListener('click', () => {
        alert('Action enregistrée sur le Champ !')
      })
    }
  </script>
</body>
</html>
