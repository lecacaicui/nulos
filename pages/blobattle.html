<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blobattle</title>
  <link rel="stylesheet" href="../style/style.css">

  <!--
    BLOBATTLE — PAGE DU JEU

    Principe général :
    - Blobattle reprend le principe de JellyGo : chaque joueur possède des bases.
    - Une base contient un nombre de blobs et produit progressivement de nouvelles unités.
    - Cliquer sur une base puis sur une autre envoie des blobs vers cette destination.
    - Une base neutre ou ennemie est conquise lorsque les unités envoyées dépassent sa défense.
    - Plus le joueur possède de bases, plus sa production est importante.
    - Le but de la partie est de conquérir toutes les bases adverses.

    Organisation du code :
    - Cette page ne contient que la structure HTML et le style propre à Blobattle.
    - Toute la logique de jeu se trouve dans blobattle.js.
    - Le jeu est rendu dans un <canvas>, ce qui permet d'animer facilement les blobs.
    - Le thème général du site reste celui de style.css via les variables CSS existantes.
  -->

  <script>
    /* Même mécanisme que les autres pages du site :
       appliquer immédiatement le thème mémorisé avant que la page soit affichée. */
    (function () {
      const t = localStorage.getItem('theme_couleurs')
      if (!t) return
      try {
        const c = JSON.parse(t)
        const r = document.documentElement.style
        r.setProperty('--couleur-fond', c.couleur_fond)
        r.setProperty('--couleur-conteneur', c.couleur_conteneur)
        r.setProperty('--couleur-bordure', c.couleur_bordure)
        r.setProperty('--couleur-bouton', c.couleur_bouton)

        const h = c.couleur_fond.replace('#', '')
        const lum =
          (0.299 * parseInt(h.substring(0, 2), 16) +
           0.587 * parseInt(h.substring(2, 4), 16) +
           0.114 * parseInt(h.substring(4, 6), 16)) / 255

        r.setProperty('--couleur-texte', lum < 0.5 ? '#f1f1f1' : '#1a1a1a')
        r.setProperty('--couleur-texte-faible', lum < 0.5 ? '#9ca3af' : '#6b7280')
      } catch (e) {}
    })()
  </script>

  <!-- Comme sur les autres pages du site : le body reste invisible tant que
       le header n'est pas chargé, pour éviter un flash sans header. -->
  <style>body { visibility: hidden; }</style>

  <style>
    html, body { height: 100%; }

    body {
      overflow: hidden;
    }

    main {
      height: calc(100vh - 64px);
      min-height: 0;
      display: flex;
    }

    .blobattle-wrap {
      width: 90%;
      max-width: 1400px;
      height: 100%;
      margin: 0 auto;
      padding: .75rem 1rem;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      gap: .6rem;
      min-height: 0;
    }

    .blobattle-topbar {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .blobattle-topbar h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    .blobattle-stats {
      display: flex;
      align-items: center;
      gap: .5rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .blobattle-stat {
      background: var(--couleur-conteneur);
      border: 1px solid var(--couleur-bordure);
      border-radius: 999px;
      padding: .3rem .7rem;
      font-size: .78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .blobattle-arena {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border: 2px solid var(--couleur-bordure);
      border-radius: 12px;
      background: var(--couleur-fond);
    }

    #blobattle-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }

    .blobattle-overlay {
      position: absolute;
      inset: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: rgba(0,0,0,.55);
    }

    .blobattle-overlay.cachee { display: none; }

    .blobattle-overlay-card {
      width: min(360px, 100%);
      box-sizing: border-box;
      padding: 1.5rem;
      text-align: center;
      background: var(--couleur-conteneur);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
    }

    .blobattle-overlay-card h2 {
      margin: 0 0 .5rem;
      font-size: 1.3rem;
    }

    .blobattle-overlay-card p {
      margin: 0 0 1.25rem;
      color: var(--couleur-texte-faible);
      font-size: .85rem;
      line-height: 1.5;
    }

    .blobattle-actions {
      display: flex;
      flex-direction: column;
      gap: .55rem;
    }

    /* Secours pour la preview si les classes .btn du site ne sont pas chargées. */
    .blobattle-actions .btn {
      border: 1px solid var(--couleur-bordure, #d1d5db);
      border-radius: 8px;
      padding: .65rem .9rem;
      cursor: pointer;
      font: inherit;
    }

    .blobattle-actions .btn-primary {
      background: var(--couleur-bouton, #2563eb);
      color: #fff;
    }

    .blobattle-actions .btn-secondary {
      background: var(--couleur-conteneur, #fff);
      color: var(--couleur-texte, #111827);
    }

    .blobattle-help {
      flex: 0 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      min-height: 42px;
      padding: .4rem .75rem;
      background: var(--couleur-conteneur);
      border: 1px solid var(--couleur-bordure);
      border-radius: 12px;
      color: var(--couleur-texte-faible);
      font-size: .75rem;
      text-align: center;
    }

    .blobattle-message {
      position: fixed;
      left: 50%;
      bottom: 5rem;
      transform: translateX(-50%);
      z-index: 100;
      padding: .5rem 1rem;
      border-radius: 999px;
      background: #111827dd;
      color: white;
      font-size: .8rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      white-space: nowrap;
    }

    .blobattle-message.visible { opacity: 1; }

    @media (max-width: 700px) {
      main { height: calc(100vh - 56px); }

      .blobattle-wrap {
        width: 100%;
        padding: .5rem;
      }

      .blobattle-topbar h1 { font-size: 1.15rem; }

      .blobattle-help {
        gap: .5rem;
        font-size: .68rem;
      }

      .blobattle-stat {
        padding: .25rem .5rem;
        font-size: .68rem;
      }
    }
  </style>
</head>

<body>
  <div id="header-placeholder"></div>

  <main>
    <div class="blobattle-wrap">

      <div class="blobattle-topbar">
        <h1>🫧 Blobattle</h1>

        <!-- Ces valeurs sont mises à jour par blobattle.js. -->
        <div class="blobattle-stats">
          <span class="blobattle-stat">🟦 <span id="stat-player">0</span></span>
          <span class="blobattle-stat">🟥 <span id="stat-enemy">0</span></span>
          <span class="blobattle-stat">🏠 <span id="stat-bases">0</span></span>
          <span class="blobattle-stat">⏱ <span id="stat-time">00:00</span></span>
        </div>
      </div>

      <div class="blobattle-arena">
        <canvas id="blobattle-canvas"></canvas>

        <!--
          Overlay de départ / fin.
          Le canvas continue d'exister derrière : l'overlay sert seulement
          à présenter les différents états de la partie au joueur.
        -->
        <div class="blobattle-overlay" id="blobattle-overlay">
          <div class="blobattle-overlay-card">
            <h2 id="overlay-title">Blobattle</h2>
            <p id="overlay-text">
              Conquiers les bases adverses avec tes blobs.
              Une base produit automatiquement des unités.
              Sélectionne une base puis une destination pour attaquer.
            </p>

            <div class="blobattle-actions">
              <button class="btn btn-primary" id="btn-start">Lancer la partie</button>
              <button class="btn btn-secondary" id="btn-reset">Réinitialiser</button>
            </div>
          </div>
        </div>
      </div>

      <div class="blobattle-help">
        <span>🖱️ Clique une base puis une autre pour envoyer des blobs</span>
        <span>🟦 Toi</span>
        <span>⚪ Neutre</span>
        <span>🟥 Ennemi</span>
      </div>
    </div>
  </main>

  <div class="blobattle-message" id="blobattle-message"></div>

  <!--
    Le placeholder ci-dessus (#header-placeholder) n'est jamais rempli tout
    seul : comme sur le reste du site, il faut appeler chargerHeader() pour
    y injecter header.html et brancher les liens (connexion/déconnexion,
    lien admin, thème). Pas de footer ici : Blobattle occupe tout l'écran
    (canvas plein cadre, overflow hidden), un footer fixe en bas viendrait
    chevaucher l'arène.
  -->
  <script type="module">
    import { chargerHeader, appliquerTheme } from '../script/header.js'

    ;(async () => {
      appliquerTheme()
      await chargerHeader('../')
      document.body.style.setProperty('visibility', 'visible', 'important')
    })()
  </script>

  <script type="module" src="../script/blobattle.js"></script>
</body>
</html>
