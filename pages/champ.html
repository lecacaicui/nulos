<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Champ de bataille</title>
  <link rel="stylesheet" href="../style/style.css">
  
  <script>
  (function(){
    var t = localStorage.getItem('theme_couleurs');
    if (!t) return;
    try {
      var c = JSON.parse(t);
      var r = document.documentElement.style;
      r.setProperty('--couleur-fond', c.couleur_fond);
      r.setProperty('--couleur-conteneur', c.couleur_conteneur);
      r.setProperty('--couleur-bordure', c.couleur_bordure);
      r.setProperty('--couleur-bouton', c.couleur_bouton);
      var h = c.couleur_fond.replace('#','');
      var lum = (0.299*parseInt(h.substring(0,2),16) + 0.587*parseInt(h.substring(2,4),16) + 0.114*parseInt(h.substring(4,6),16)) / 255;
      r.setProperty('--couleur-texte', lum < 0.5 ? '#f1f1f1' : '#1a1a1a');
      r.setProperty('--couleur-texte-faible', lum < 0.5 ? '#9ca3af' : '#6b7280');
    } catch(e) {}
  })();
  </script>

  <style>body { visibility: hidden; }</style>
  
  <style>
    .jeu-champ-container {
      display: grid;
      grid-template-columns: 280px 1fr 250px;
      gap: 1.5rem;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1rem 6rem;
    }

    .panneau-jeu {
      background: var(--couleur-conteneur);
      border: 1px solid var(--couleur-bordure);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panneau-jeu h2 {
      font-size: 1.1rem;
      font-weight: 700;
      border-bottom: 1px solid var(--couleur-bordure);
      padding-bottom: 0.5rem;
      margin-bottom: 0.5rem;
      color: var(--couleur-texte);
    }

    /* Grille du champ */
    .grille-champ {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      max-width: 440px;
      width: 100%;
      margin: 1.5rem auto;
      aspect-ratio: 1 / 1;
    }

    .case-terre {
      background: #8B5A2B;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      user-select: none;
    }

    /* Effet quand on survole la case avec un élément traîné (dragover) */
    .case-terre.drag-over {
      background: #A0522D;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
      transform: scale(1.04);
    }

    /* Zone inventaire des graines achetées */
    .zone-inventaire {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .item-graine {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--couleur-fond);
      border: 1px solid var(--couleur-bordure);
      border-radius: 8px;
      padding: 0.75rem;
      cursor: grab;
      user-select: none;
      transition: background 0.1s;
    }

    .item-graine:active {
      cursor: grabbing;
    }

    .item-graine.epuise {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Modale magasin */
    .modale-graines {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modale-graines.active {
      display: flex;
    }

    .modale-graines-contenu {
      background: var(--couleur-conteneur);
      border: 1px solid var(--couleur-bordure);
      border-radius: 12px;
      padding: 2rem;
      max-width: 550px;
      width: 90%;
      position: relative;
    }

    .grille-graines {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.5rem;
      max-height: 350px;
      overflow-y: auto;
    }

    .ligne-magasin-graine {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--couleur-fond);
      border: 1px solid var(--couleur-bordure);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      gap: 1rem;
    }

    .selecteur-quantite {
      width: 60px;
      padding: 0.3rem;
      border: 1px solid var(--couleur-bordure);
      border-radius: 6px;
      background: var(--couleur-conteneur);
      color: var(--couleur-texte);
      font-weight: 600;
      text-align: center;
    }

    .btn-fermer {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--couleur-texte-faible);
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .jeu-champ-container { grid-template-columns: 1fr; }
      #score { grid-row: 1; }
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <div class="jeu-champ-container">
      
      <section class="panneau-jeu" id="achat">
        <h2>🛒 Achats & Sac</h2>
        <button class="btn btn-primary" id="btn-ouvrir-magasin">🌱 Ouvrir le Magasin</button>
        
        <h3 style="font-size: 0.9rem; margin-top: 1rem; color: var(--couleur-texte-faible);">🎒 Glisser un paquet sur le champ :</h3>
        <div class="zone-inventaire" id="inventaire-graines">
          </div>
      </section>

      <section class="panneau-jeu" id="champ" style="text-align: center;">
        <h2>🌾 Mon Champ (4x4)</h2>
        <div class="grille-champ" id="grille-terre"></div>
      </section>

      <section class="panneau-jeu" id="score">
        <h2>💰 Économie</h2>
        <div style="font-size: 1.1rem; font-weight: 600;">
          Argent : <span id="argent-joueur" style="color: var(--couleur-bouton);">500</span> $
        </div>
        <div style="font-size: 0.85rem; color: var(--couleur-texte-faible); margin-top: 0.5rem;">
          Joueur : <span id="nom-joueur">...</span>
        </div>
      </section>

    </div>
  </main>

  <div class="modale-graines" id="modale-graines">
    <div class="modale-graines-contenu">
      <button class="btn-fermer" id="btn-fermer-graines">✕</button>
      <h3>🛒 Acheter des graines</h3>
      
      <div class="grille-graines" id="liste-magasin">
        </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
    import { chargerHeader, chargerFooter, appliquerTheme } from '../script/header.js'

    const db = createClient('https://uqjciekcfrxscfwztttt.supabase.co', 'sb_publishable_Ly-L4hecBE_r-k4qd5zTkQ_VmaKUASz')

    // Données fictives initiales du jeu
    let argent = 500
    const catalogueGraines = [
      { id: 'graine1', nom: 'Graine Blé', emoji: '🌾', prix: 10 },
      { id: 'graine2', nom: 'Graine Carotte', emoji: '🥕', prix: 15 },
      { id: 'graine3', nom: 'Graine Maïs', emoji: '🌽', prix: 25 },
      { id: 'graine4', nom: 'Graine Tomate', emoji: '🍅', prix: 40 }
    ]

    // État du joueur (Stock de graines possédées)
    const inventaire = {
      graine1: 2, // Offertes au début
      graine2: 0,
      graine3: 0,
      graine4: 0
    }

    // Sauvegarde de l'id de la graine qu'on est en train de glisser (drag)
    let graineSelectionneeId = null

    ;(async () => {
      if (!localStorage.getItem('username')) {
        window.location.href = 'connexion.html'
        return
      }

      document.body.style.setProperty('visibility', 'visible', 'important')
      appliquerTheme()
      
      await chargerHeader('../')
      await chargerFooter('../')

      document.getElementById('nom-joueur').textContent = localStorage.getItem('username')
      majAffichageArgent()

      genererGrille()
      renderInventaire()
      genererMagasin()
      initEvenements()
    })()

    function majAffichageArgent() {
      document.getElementById('argent-joueur').textContent = argent
    }

    // 1. Génère le champ 4x4 et y ajoute les écouteurs de Drop
    function genererGrille() {
      const grille = document.getElementById('grille-terre')
      grille.innerHTML = ''
      
      for (let i = 0; i < 16; i++) {
        const caseTerre = document.createElement('div')
        caseTerre.classList.add('case-terre')
        caseTerre.dataset.index = i
        caseTerre.textContent = '🟫' // Terre vide
        
        // --- Événements de Drag & Drop sur le champ ---
        caseTerre.addEventListener('dragover', (e) => {
          e.preventDefault() // Autorise le drop sur cet élément
          if (graineSelectionneeId && inventaire[graineSelectionneeId] > 0) {
            caseTerre.classList.add('drag-over')
          }
        })

        caseTerre.addEventListener('dragleave', () => {
          caseTerre.classList.remove('drag-over')
        })

        caseTerre.addEventListener('drop', (e) => {
          e.preventDefault()
          caseTerre.classList.remove('drag-over')

          if (!graineSelectionneeId || inventaire[graineSelectionneeId] <= 0) return

          // Planter la graine !
          const templateGraine = catalogueGraines.find(g => g.id === graineSelectionneeId)
          if (templateGraine) {
            inventaire[graineSelectionneeId]-- // Réduit le stock
            caseTerre.textContent = templateGraine.emoji // Change l'aspect visuel de la case
            
            renderInventaire() // Rafraîchit les compteurs du sac
            console.log(`Planté ${templateGraine.nom} sur la case ${i}`)
          }
        })

        grille.appendChild(caseTerre)
      }
    }

    // 2. Affiche le sac de graines (inventaire à gauche)
    function renderInventaire() {
      const conteneur = document.getElementById('inventaire-graines')
      conteneur.innerHTML = ''

      catalogueGraines.forEach(graine => {
        const qte = inventaire[graine.id] || 0
        const div = document.createElement('div')
        div.classList.add('item-graine')
        if (qte === 0) div.classList.add('epuise')
        
        div.innerHTML = `
          <span>${graine.emoji} <b>${graine.nom}</b></span>
          <span>x${qte}</span>
        `
        
        // Rendre l'élément déplaçable si on en possède
        if (qte > 0) {
          div.setAttribute('draggable', 'true')
          
          div.addEventListener('dragstart', () => {
            graineSelectionneeId = graine.id
            div.style.opacity = '0.4'
          })

          div.addEventListener('dragend', () => {
            graineSelectionneeId = null
            div.style.opacity = '1'
          })
        }

        conteneur.appendChild(div)
      })
    }

    // 3. Génère la liste d'achats avec choix de quantité dans le magasin
    function genererMagasin() {
      const liste = document.getElementById('liste-magasin')
      liste.innerHTML = ''

      catalogueGraines.forEach(graine => {
        const ligne = document.createElement('div')
        ligne.classList.add('ligne-magasin-graine')
        
        ligne.innerHTML = `
          <div style="display:flex; flex-direction:column;">
            <span>${graine.emoji} <b>${graine.nom}</b></span>
            <span style="font-size:0.8rem; color:var(--couleur-texte-faible)">Prix unitaire : ${graine.prix} $</span>
          </div>
          <div style="display:flex; align-items:center; gap:0.5rem;">
            <input type="number" min="1" max="99" value="1" class="selecteur-quantite" id="qte-${graine.id}">
            <button class="btn btn-secondary" style="padding:0.4rem 0.8rem; font-size:0.85rem;" id="btn-acheter-${graine.id}">Acheter</button>
          </div>
        `
        liste.appendChild(ligne)

        // Gestionnaire d'achat quantitatif
        ligne.querySelector(`#btn-acheter-${graine.id}`).addEventListener('click', () => {
          const inputQte = ligne.querySelector(`#qte-${graine.id}`)
          const quantite = parseInt(inputQte.value) || 1
          const coutTotal = graine.prix * quantite

          if (argent >= coutTotal) {
            argent -= coutTotal
            inventaire[graine.id] += quantite
            majAffichageArgent()
            renderInventaire()
            inputQte.value = 1 // Reset l'input
            alert(`Succès ! Vous avez acheté ${quantite} ${graine.nom}(s).`)
          } else {
            alert("Pas assez d'argent pour cette quantité !")
          }
        })
      })
    }

    // 4. Modale ouverture / fermeture
    function initEvenements() {
      const modale = document.getElementById('modale-graines')
      const btnOuvrir = document.getElementById('btn-ouvrir-magasin')
      const btnFermer = document.getElementById('btn-fermer-graines')

      btnOuvrir.addEventListener('click', () => modale.classList.add('active'))
      btnFermer.addEventListener('click', () => modale.classList.remove('active'))
      modale.addEventListener('click', (e) => { if (e.target === modale) modale.classList.remove('active') })
    }
  </script>
</body>
</html>
