<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Champ de bataille</title>
  <link rel="stylesheet" href="../style/style.css">
  
  <!-- Script d'initialisation du thème pour éviter le flash blanc -->
  <script>
  (function(){
    var t = localStorage.getItem('theme_couleurs');
    if (!t) return;
    try {
      var c = JSON.parse(t);
      var r = document.documentElement.style;
      r.setProperty('--couleur-fond', c.couleur_fond);
      r.setProperty('--couleur-conteneur', c.couleur_conteneur);
      r.setProperty('--couleur-bordure', c.couleur_bordure);
      r.setProperty('--couleur-bouton', c.couleur_bouton);
      var h = c.couleur_fond.replace('#','');
      var lum = (0.299*parseInt(h.substring(0,2),16) + 0.587*parseInt(h.substring(2,4),16) + 0.114*parseInt(h.substring(4,6),16)) / 255;
      r.setProperty('--couleur-texte', lum < 0.5 ? '#f1f1f1' : '#1a1a1a');
      r.setProperty('--couleur-texte-faible', lum < 0.5 ? '#9ca3af' : '#6b7280');
    } catch(e) {}
  })();
  </script>

  <style>body { visibility: hidden; }</style>
  
  <style>
    .jeu-champ-container.outil-actif {
      cursor: none;
    }
    .jeu-champ-container.outil-actif .case-terre,
    .jeu-champ-container.outil-actif .item-graine,
    .jeu-champ-container.outil-actif .item-outil,
    .jeu-champ-container.outil-actif .btn {
      cursor: none !important;
    }

    #custom-cursor {
      position: fixed;
      top: 0; left: 0;
      width: 20px; height: 20px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.4);
      border: 2px solid #fff;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9999;
      display: none;
      transition: width 0.15s ease, height 0.15s ease, background 0.15s ease;
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    #custom-cursor.mode-planter {
      display: block;
      background: rgba(37, 99, 235, 0.3);
      border-color: #2563eb;
    }

    #custom-cursor.mode-recolter {
      display: block;
      background: rgba(239, 68, 68, 0.3);
      border-color: #ef4444;
    }

    #custom-cursor.zone-zoom {
      width: 45px;
      height: 45px;
    }

    .jeu-champ-container {
      display: grid;
      grid-template-columns: 280px 1fr 280px;
      gap: 1.5rem;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1rem 6rem;
    }

    .panneau-jeu {
      background: var(--couleur-conteneur);
      border: 1px solid var(--couleur-bordure);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panneau-jeu h2 {
      font-size: 1.1rem;
      font-weight: 700;
      border-bottom: 1px solid var(--couleur-bordure);
      padding-bottom: 0.5rem;
      margin-bottom: 0.5rem;
      color: var(--couleur-texte);
    }

    .grille-champ {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      max-width: 500px;
      width: 100%;
      margin: 1.5rem auto;
    }

    .case-container {
      position: relative;
      aspect-ratio: 1 / 1;
    }

    .case-terre {
      width: 100%;
      height: 100%;
      background: #8B5A2B;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.1s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .case-emoji {
      font-size: 1.8rem;
      line-height: 1;
    }

    .case-mutation-label {
      font-size: 0.65rem;
      font-weight: 800;
      margin-top: 2px;
      text-transform: uppercase;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.6);
    }

    .case-terre:hover {
      filter: brightness(1.1);
    }

    .case-terre.mutation-dore {
      background: #D4AF37 !important;
      color: #000 !important;
      border-color: #AA7C11;
    }
    .case-terre.mutation-diamant {
      background: #4A90E2 !important;
      color: #fff !important;
      border-color: #21508A;
    }
    .case-terre.mutation-arcenciel {
      background: linear-gradient(45deg, #ff2a2a, #ff7a2a, #ffa22a, #2aff2a, #2a2aff, #a22aff, #ff2aff) !important;
      color: #fff !important;
      border-color: #fff;
    }

    .case-timer {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 2px 5px;
      border-radius: 4px;
      pointer-events: none;
      font-family: monospace;
    }

    /* --- SYSTÈME DE PARTICULES POUR L'EXPLOSION --- */
    .particule-recolte {
      position: fixed;
      pointer-events: none;
      z-index: 10000;
      font-size: 1.5rem;
      user-select: none;
      will-change: transform, opacity;
    }

    /* --- RAYONS DE LUMIÈRE (GOD RAYS) --- */
    .rayon-lumiere {
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      width: 2px;
      height: 120px;
      transform-origin: bottom center;
      background: linear-gradient(to top, rgba(255,255,255,0.8), transparent);
      opacity: 1;
      will-change: transform, opacity;
    }

    @keyframes flashRecolte {
      0% { filter: brightness(2); transform: scale(0.92); }
      100% { filter: brightness(1); transform: scale(1); }
    }
    .case-flash {
      animation: flashRecolte 0.25s ease-out;
    }

    .zone-inventaire {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .item-graine, .item-outil, .item-upgrade {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--couleur-fond);
      border: 1px solid var(--couleur-bordure);
      border-radius: 8px;
      padding: 0.75rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    .item-upgrade {
      cursor: default;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
    }

    .item-graine.actif, .item-outil.actif {
      border-color: var(--couleur-bouton);
      background: rgba(37, 99, 235, 0.15);
      transform: scale(1.02);
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.3);
    }

    .item-graine.epuise { opacity: 0.4; cursor: not-allowed; }

    .modale-graines {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modale-graines.active { display: flex; }

    .modale-graines-contenu {
      background: var(--couleur-conteneur);
      border: 1px solid var(--couleur-bordure);
      border-radius: 12px;
      padding: 2rem;
      max-width: 550px;
      width: 90%;
      position: relative;
    }

    .grille-graines {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.5rem;
      max-height: 350px;
      overflow-y: auto;
    }

    .ligne-magasin-graine {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--couleur-fond);
      border: 1px solid var(--couleur-bordure);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      gap: 1rem;
    }

    .selecteur-quantite {
      width: 60px;
      padding: 0.3rem;
      border: 1px solid var(--couleur-bordure);
      border-radius: 6px;
      background: var(--couleur-conteneur);
      color: var(--couleur-texte);
      font-weight: 600;
      text-align: center;
    }

    .btn-fermer {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--couleur-texte-faible);
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .jeu-champ-container { grid-template-columns: 1fr; }
      #score { grid-row: 1; }
    }
  </style>
</head>
<body>
  <div id="custom-cursor"></div>
  <div id="header-placeholder"></div>

  <main>
    <div class="jeu-champ-container" id="zone-jeu">
      
      <!-- À GAUCHE : Zone d'Achat & Sac -->
      <section class="panneau-jeu" id="achat">
        <h2>🛒 Achats & Sac</h2>
        <button class="btn btn-primary" id="btn-ouvrir-magasin">🌱 Ouvrir le Magasin</button>
        
        <h3 style="font-size: 0.9rem; margin-top: 1rem; color: var(--couleur-texte-faible);">🛠️ Outil de récolte :</h3>
        <div class="item-outil" id="outil-serpe">
          <span>⚔️ <b>Serpe de récolte</b></span>
          <span style="font-size: 0.8rem; color: var(--couleur-texte-faible);">Activer</span>
        </div>

        <h3 style="font-size: 0.9rem; margin-top: 0.5rem; color: var(--couleur-texte-faible);">🎒 Graines à semer :</h3>
        <div class="zone-inventaire" id="inventaire-graines"></div>
      </section>

      <!-- AU CENTRE : Le Champ -->
      <section class="panneau-jeu" id="champ" style="text-align: center;">
        <h2>🌾 Mon Champ (<span id="txt-taille-grille">4x4</span>)</h2>
        <div class="grille-champ" id="grille-terre"></div>
      </section>

      <!-- À DROITE : Le Score & Économie & Améliorations -->
      <section class="panneau-jeu" id="score">
        <h2>💰 Économie</h2>
        <div style="font-size: 1.1rem; font-weight: 600; margin-bottom: 0.5rem;">
          Argent : <span id="argent-joueur" style="color: var(--couleur-bouton);">500</span> $
        </div>
        <div style="font-size: 0.85rem; color: var(--couleur-texte-faible); margin-bottom: 1rem;">
          Joueur : <span id="nom-joueur">...</span>
        </div>

        <h2>📈 Améliorations</h2>
        
        <!-- Upgrade 1 -->
        <div class="item-upgrade">
          <div style="display:flex; justify-content:space-between; width:100%; font-size:0.85rem;">
            <span>🟫 <b>Nouvelle Parcelle</b></span>
            <span id="txt-cases-actuelles" style="font-weight:700;">16 cases</span>
          </div>
          <button class="btn btn-secondary" style="width:100%; padding:0.4rem; font-size:0.8rem;" id="btn-upgrade-taille">
            Acheter (+1 case) : <span id="prix-upgrade-taille">150</span> $
          </button>
        </div>

        <!-- Upgrade 2 -->
        <div class="item-upgrade">
          <div style="display:flex; justify-content:space-between; width:100%; font-size:0.85rem;">
            <span>⚡ <b>Serre Technologique</b></span>
            <span id="txt-vitesse-actuelle" style="font-weight:700;">Vitesse x1.0</span>
          </div>
          <button class="btn btn-secondary" style="width:100%; padding:0.4rem; font-size:0.8rem;" id="btn-upgrade-vitesse">
            Boost Pousse (+15%) : <span id="prix-upgrade-vitesse">200</span> $
          </button>
        </div>

      </section>

    </div>
  </main>

  <!-- Magasin -->
  <div class="modale-graines" id="modale-graines">
    <div class="modale-graines-contenu">
      <button class="btn-fermer" id="btn-fermer-graines">✕</button>
      <h3>🛒 Acheter des graines</h3>
      <div class="grille-graines" id="liste-magasin"></div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
    import { chargerHeader, chargerFooter, appliquerTheme } from '../script/header.js'

    const db = createClient('https://uqjciekcfrxscfwztttt.supabase.co', 'sb_publishable_Ly-L4hecBE_r-k4qd5zTkQ_VmaKUASz')

    let argent = 500
    
    const catalogueGraines = [
      { id: 'graine1', nom: 'Blé', emoji: '🌾', prix: 10, tempsPousse: 5, gain: 20 },
      { id: 'graine2', nom: 'Carotte', emoji: '🥕', prix: 15, tempsPousse: 10, gain: 30 },
      { id: 'graine3', nom: 'Maïs', emoji: '🌽', prix: 25, tempsPousse: 20, gain: 50 },
      { id: 'graine4', nom: 'Tomate', emoji: '🍅', prix: 40, tempsPousse: 35, gain: 80 }
    ]

    const inventaire = { graine1: 5, graine2: 2, graine3: 0, graine4: 0 }

    let graineActiveId = null
    let serpeActive = false

    let nbCasesChamp = 16
    let reductionTempsPousse = 0.0
    let prixUpgradeTaille = 150
    let prixUpgradeVitesse = 200

    let etatChamp = Array.from({ length: nbCasesChamp }, () => ({
      statut: 'vide',
      graineId: null,
      mutation: 'normal',
      tempsRestant: 0,
      intervalId: null
    }))

    ;(async () => {
      if (!localStorage.getItem('username')) {
        window.location.href = 'connexion.html'
        return
      }
      document.body.style.setProperty('visibility', 'visible', 'important')
      appliquerTheme()
      await chargerHeader('../')
      await chargerFooter('../')

      document.getElementById('nom-joueur').textContent = localStorage.getItem('username')
      majAffichageArgent()
      majTextesUpgrades()
      genererGrille()
      renderInventaire()
      genererMagasin()
      initEvenements()
      initCurseurDynamique()
    })()

    function majAffichageArgent() {
      document.getElementById('argent-joueur').textContent = argent
    }

    function majTextesUpgrades() {
      const colonnes = Math.ceil(Math.sqrt(nbCasesChamp))
      const lignes = Math.ceil(nbCasesChamp / colonnes)
      document.getElementById('txt-taille-grille').textContent = `${colonnes}x${lignes}`
      document.getElementById('txt-cases-actuelles').textContent = `${nbCasesChamp} cases`
      document.getElementById('prix-upgrade-taille').textContent = prixUpgradeTaille

      document.getElementById('txt-vitesse-actuelle').textContent = `Boost: -${Math.round(reductionTempsPousse * 100)}%`
      document.getElementById('prix-upgrade-vitesse').textContent = prixUpgradeVitesse
    }

    function determinerMutation() {
      const tirage = Math.random()
      if (tirage <= 1 / 100) return 'arcenciel'
      if (tirage <= 1 / 25)  return 'diamant'
      if (tirage <= 1 / 5)   return 'dore'
      return 'normal'
    }

    function initCurseurDynamique() {
      const cursor = document.getElementById('custom-cursor')
      window.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px'
        cursor.style.top = e.clientY + 'px'
      })
    }

    function majEtatCurseur() {
      const cursor = document.getElementById('custom-cursor')
      const zoneJeu = document.getElementById('zone-jeu')
      cursor.className = ''
      zoneJeu.classList.remove('outil-actif')

      if (serpeActive) {
        cursor.classList.add('mode-recolter')
        zoneJeu.classList.add('outil-actif')
      } else if (graineActiveId) {
        cursor.classList.add('mode-planter')
        zoneJeu.classList.add('outil-actif')
      }
    }

    // --- LOGIQUE ULTRA-DYNAMIQUE D'EXPLOSION DE PARTICULES & RAYONS ---
    function exploserRecolte(caseElement, emojiLegume, mutation) {
      // Effet flash sur la case
      caseElement.classList.remove('case-flash')
      void caseElement.offsetWidth
      caseElement.classList.add('case-flash')

      const rect = caseElement.getBoundingClientRect()
      const centreX = rect.left + rect.width / 2
      const centreY = rect.top + rect.height / 2

      // 1. AJOUT DES RAYONS DE LUMIÈRE DIVINS (GOD RAYS) SI RARE
      if (mutation !== 'normal') {
        const nbRayons = mutation === 'arcenciel' ? 24 : 16
        let degradreCouleur = 'linear-gradient(to top, rgba(255, 223, 0, 0.9), transparent)' // Doré par défaut

        if (mutation === 'diamant') {
          degradreCouleur = 'linear-gradient(to top, rgba(0, 191, 255, 0.9), transparent)'
        } else if (mutation === 'arcenciel') {
          degradreCouleur = 'linear-gradient(to top, rgba(255, 105, 180, 0.9), rgba(0, 255, 127, 0.5), transparent)'
        }

        const angleDepart = Math.random() * 360

        for (let i = 0; i < nbRayons; i++) {
          const ray = document.createElement('div')
          ray.classList.add('rayon-lumiere')
          ray.style.background = degradreCouleur
          ray.style.left = `${centreX}px`
          ray.style.top = `${centreY - 120}px` // Pivot centré sur le bas du rayon

          const angle = angleDepart + (i * (360 / nbRayons))
          ray.style.transform = `rotate(${angle}deg)`
          document.body.appendChild(ray)

          let opaciteRayon = 1.0
          let longueurRayon = 120
          const vitesseRotation = (Math.random() > 0.5 ? 0.4 : -0.4)

          function animerRayon() {
            opaciteRayon -= 0.02
            longueurRayon += 2
            const angleActuel = parseFloat(ray.style.transform.replace('rotate(', '').replace('deg)', '')) || 0
            
            ray.style.transform = `rotate(${angleActuel + vitesseRotation}deg)`
            ray.style.height = `${longueurRayon}px`
            ray.style.top = `${centreY - longueurRayon}px`
            ray.style.opacity = opaciteRayon
            ray.style.width = `${Math.max(1, 4 * opaciteRayon)}px`

            if (opaciteRayon > 0) {
              requestAnimationFrame(animerRayon)
            } else {
              ray.remove()
            }
          }
          requestAnimationFrame(animerRayon)
        }
      }

      // 2. Éléments physiques de l'explosion
      const poolParticules = []

      // Le Légume principal (Gros projeté vers le haut)
      poolParticules.push({ emoji: emojiLegume, vx: (Math.random() - 0.5) * 2, vy: -6 - Math.random() * 4, taille: 2.2 })

      // Pièces d'or
      const nbPieces = mutation !== 'normal' ? 12 : 5
      for (let i = 0; i < nbPieces; i++) {
        poolParticules.push({
          emoji: '🪙',
          vx: (Math.random() - 0.5) * 8,
          vy: -4 - Math.random() * 6,
          taille: 1 + Math.random() * 0.5
        })
      }

      // Bonus selon la Rareté
      if (mutation === 'dore') {
        for (let i = 0; i < 6; i++) poolParticules.push({ emoji: '⭐', vx: (Math.random() - 0.5) * 10, vy: -3 - Math.random() * 7, taille: 1.2 })
      } else if (mutation === 'diamant') {
        for (let i = 0; i < 8; i++) poolParticules.push({ emoji: '🔹', vx: (Math.random() - 0.5) * 11, vy: -3 - Math.random() * 8, taille: 1.3 })
      } else if (mutation === 'arcenciel') {
        const eclats = ['✨', '🎨', '🏳️‍🌈', '⭐']
        for (let i = 0; i < 15; i++) {
          const rdmEmoji = eclats[Math.floor(Math.random() * eclats.length)]
          poolParticules.push({ emoji: rdmEmoji, vx: (Math.random() - 0.5) * 14, vy: -2 - Math.random() * 10, taille: 1.4 })
        }
      }

      // Injection et animation JS des émojis
      poolParticules.forEach(p => {
        const el = document.createElement('div')
        el.classList.add('particule-recolte')
        el.textContent = p.emoji
        el.style.fontSize = `${p.taille}rem`
        document.body.appendChild(el)

        let posX = centreX
        let posY = centreY
        let opacite = 1
        const gravite = 0.4

        function update() {
          p.vy += gravite
          posX += p.vx
          posY += p.vy
          opacite -= 0.025

          el.style.transform = `translate(-50%, -50%) translate(${posX - centreX}px, ${posY - centreY}px)`
          el.style.opacity = opacite
          el.style.left = `${centreX}px`
          el.style.top = `${centreY}px`

          if (opacite > 0) {
            requestAnimationFrame(update)
          } else {
            el.remove()
          }
        }
        requestAnimationFrame(update)
      })
    }

    // Génération de la Grille
    function genererGrille() {
      const grille = document.getElementById('grille-terre')
      const cursor = document.getElementById('custom-cursor')
      grille.innerHTML = ''
      
      const colonnes = Math.ceil(Math.sqrt(nbCasesChamp))
      grille.style.gridTemplateColumns = `repeat(${colonnes}, 1fr)`

      for (let i = 0; i < nbCasesChamp; i++) {
        if (!etatChamp[i]) {
          etatChamp[i] = { statut: 'vide', graineId: null, mutation: 'normal', tempsRestant: 0, intervalId: null }
        }

        const info = etatChamp[i]
        const container = document.createElement('div')
        container.classList.add('case-container')

        const caseTerre = document.createElement('div')
        caseTerre.classList.add('case-terre')
        
        let labelMutation = ''
        if (info.statut === 'pret') {
          if (info.mutation === 'dore') { caseTerre.classList.add('mutation-dore'); labelMutation = '✨ Doré'; }
          if (info.mutation === 'diamant') { caseTerre.classList.add('mutation-diamant'); labelMutation = '💎 Diamant'; }
          if (info.mutation === 'arcenciel') { caseTerre.classList.add('mutation-arcenciel'); labelMutation = '🌈 Prismatique'; }
        }

        const templateActuel = info.graineId ? catalogueGraines.find(g => g.id === info.graineId) : null
        const emojiVisuel = info.statut === 'vide' ? '🟫' : (info.statut === 'pousse' ? '🌱' : templateActuel.emoji)

        caseTerre.innerHTML = `
          <span class="case-emoji">${emojiVisuel}</span>
          <span class="case-mutation-label">${labelMutation}</span>
        `
        
        const timerBadge = document.createElement('div')
        timerBadge.classList.add('case-timer')
        timerBadge.style.display = (info.statut === 'pousse') ? 'block' : 'none'
        timerBadge.textContent = `${info.tempsRestant}s`

        container.appendChild(caseTerre)
        container.appendChild(timerBadge)

        const emojiEl = caseTerre.querySelector('.case-emoji')
        const labelEl = caseTerre.querySelector('.case-mutation-label')

        // INTERACTION AUTOMATIQUE AU SURVOL
        caseTerre.addEventListener('mouseenter', () => {
          if (serpeActive || graineActiveId) {
            cursor.classList.add('zone-zoom')
          }

          // PLANTER
          if (graineActiveId && !serpeActive && info.statut === 'vide' && inventaire[graineActiveId] > 0) {
            const template = catalogueGraines.find(g => g.id === graineActiveId)
            if (!template) return

            inventaire[graineActiveId]--
            info.statut = 'pousse'
            info.graineId = graineActiveId
            info.mutation = 'normal'
            
            let tempsCalcule = Math.ceil(template.tempsPousse * (1 - reductionTempsPousse))
            info.tempsRestant = Math.max(1, tempsCalcule)

            emojiEl.textContent = '🌱'
            labelEl.textContent = ''
            timerBadge.textContent = `${info.tempsRestant}s`
            timerBadge.style.display = 'block'
            
            renderInventaire()

            info.intervalId = setInterval(() => {
              info.tempsRestant--
              timerBadge.textContent = `${info.tempsRestant}s`

              if (info.tempsRestant <= 0) {
                clearInterval(info.intervalId)
                info.statut = 'pret'
                timerBadge.style.display = 'none'

                info.mutation = determinerMutation()
                emojiEl.textContent = template.emoji

                if (info.mutation === 'dore') {
                  caseTerre.classList.add('mutation-dore')
                  labelEl.textContent = '✨ Doré'
                } else if (info.mutation === 'diamant') {
                  caseTerre.classList.add('mutation-diamant')
                  labelEl.textContent = '💎 Diamant'
                } else if (info.mutation === 'arcenciel') {
                  caseTerre.classList.add('mutation-arcenciel')
                  labelEl.textContent = '🌈 Prismatique'
                }
              }
            }, 1000)

            if (inventaire[graineActiveId] === 0) {
              graineActiveId = null
              cursor.classList.remove('zone-zoom')
              renderInventaire()
            }
          }

          // RÉCOLTER
          else if (serpeActive && info.statut === 'pret') {
            const template = catalogueGraines.find(g => g.id === info.graineId)
            if (template) {
              let multiplicateur = 1
              if (info.mutation === 'dore') multiplicateur = 3
              if (info.mutation === 'diamant') multiplicateur = 10
              if (info.mutation === 'arcenciel') multiplicateur = 50

              const gainFinal = template.gain * multiplicateur
              argent += gainFinal
              majAffichageArgent()
              
              exploserRecolte(caseTerre, template.emoji, info.mutation)

              info.statut = 'vide'
              info.graineId = null
              
              emojiEl.textContent = '🟫'
              labelEl.textContent = ''
              caseTerre.className = 'case-terre'
              timerBadge.style.display = 'none'
            }
          }
        })

        caseTerre.addEventListener('mouseleave', () => {
          cursor.classList.remove('zone-zoom')
        })

        grille.appendChild(container)
      }
    }

    // Inventaire
    function renderInventaire() {
      const conteneur = document.getElementById('inventaire-graines')
      conteneur.innerHTML = ''

      const outilSerpe = document.getElementById('outil-serpe')
      if (serpeActive) outilSerpe.classList.add('actif')
      else outilSerpe.classList.remove('actif')

      majEtatCurseur()

      catalogueGraines.forEach(graine => {
        const qte = inventaire[graine.id] || 0
        const div = document.createElement('div')
        div.classList.add('item-graine')
        
        if (qte === 0) div.classList.add('epuise')
        if (graine.id === graineActiveId && !serpeActive) div.classList.add('actif')
        
        div.innerHTML = `
          <span>${graine.emoji} <b>${graine.nom}</b></span>
          <span>x${qte}</span>
        `
        
        div.addEventListener('click', () => {
          if (qte === 0) return
          serpeActive = false
          graineActiveId = (graineActiveId === graine.id) ? null : graine.id
          renderInventaire()
        })

        conteneur.appendChild(div)
      })
    }

    // Boutique
    function genererMagasin() {
      const liste = document.getElementById('liste-magasin')
      liste.innerHTML = ''

      catalogueGraines.forEach(graine => {
        const ligne = document.createElement('div')
        ligne.classList.add('ligne-magasin-graine')
        
        ligne.innerHTML = `
          <div style="display:flex; flex-direction:column;">
            <span>${graine.emoji} <b>Graine de ${graine.nom}</b></span>
            <span style="font-size:0.8rem; color:var(--couleur-texte-faible)">Prix : ${graine.prix} $ | Base : ${graine.gain} $</span>
          </div>
          <div style="display:flex; align-items:center; gap:0.5rem;">
            <input type="number" min="1" max="99" value="1" class="selecteur-quantite" id="qte-${graine.id}">
            <button class="btn btn-secondary" style="padding:0.4rem 0.8rem; font-size:0.85rem;" id="btn-acheter-${graine.id}">Acheter</button>
          </div>
        `
        liste.appendChild(ligne)

        ligne.querySelector(`#btn-acheter-${graine.id}`).addEventListener('click', () => {
          const inputQte = ligne.querySelector(`#qte-${graine.id}`)
          const quantite = parseInt(inputQte.value) || 1
          const coutTotal = graine.prix * quantite

          if (argent >= coutTotal) {
            argent -= coutTotal
            inventaire[graine.id] += quantite
            majAffichageArgent()
            renderInventaire()
            inputQte.value = 1
          } else {
            alert("Fonds insuffisants !")
          }
        })
      })
    }

    function initEvenements() {
      const modale = document.getElementById('modale-graines')
      const btnOuvrir = document.getElementById('btn-ouvrir-magasin')
      const btnFermer = document.getElementById('btn-fermer-graines')
      const outilSerpe = document.getElementById('outil-serpe')

      const btnUpgradeTaille = document.getElementById('btn-upgrade-taille')
      const btnUpgradeVitesse = document.getElementById('btn-upgrade-vitesse')

      btnUpgradeTaille.addEventListener('click', () => {
        if (argent >= prixUpgradeTaille) {
          argent -= prixUpgradeTaille
          nbCasesChamp++
          prixUpgradeTaille = Math.round(prixUpgradeTaille * 1.4)
          
          majAffichageArgent()
          majTextesUpgrades()
          genererGrille()
        } else {
          alert("Fonds insuffisants pour agrandir le champ !")
        }
      })

      btnUpgradeVitesse.addEventListener('click', () => {
        if (reductionTempsPousse >= 0.75) {
          alert("Vitesse maximale de la serre atteinte ! (75% max)");
          return
        }
        if (argent >= prixUpgradeVitesse) {
          argent -= prixUpgradeVitesse
          reductionTempsPousse += 0.15
          prixUpgradeVitesse = Math.round(prixUpgradeVitesse * 1.6)

          majAffichageArgent()
          majTextesUpgrades()
        } else {
          alert("Fonds insuffisants pour améliorer la serre !");
        }
      })

      outilSerpe.addEventListener('click', () => {
        serpeActive = !serpeActive
        graineActiveId = null
        renderInventaire()
      })

      btnOuvrir.addEventListener('click', () => modale.classList.add('active'))
      btnFermer.addEventListener('click', () => modale.classList.remove('active'))
      modale.addEventListener('click', (e) => { if (e.target === modale) modale.classList.remove('active') })
    }
  </script>
</body>
