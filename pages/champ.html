<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Champ de bataille</title>
  <link rel="stylesheet" href="../style/style.css">
  
  <script>
  (function(){
    var t = localStorage.getItem('theme_couleurs');
    if (!t) return;
    try {
      var c = JSON.parse(t);
      var r = document.documentElement.style;
      r.setProperty('--couleur-fond', c.couleur_fond);
      r.setProperty('--couleur-conteneur', c.couleur_conteneur);
      r.setProperty('--couleur-bordure', c.couleur_bordure);
      r.setProperty('--couleur-bouton', c.couleur_bouton);
      var h = c.couleur_fond.replace('#','');
      var lum = (0.299*parseInt(h.substring(0,2),16) + 0.587*parseInt(h.substring(2,4),16) + 0.114*parseInt(h.substring(4,6),16)) / 255;
      r.setProperty('--couleur-texte', lum < 0.5 ? '#f1f1f1' : '#1a1a1a');
      r.setProperty('--couleur-texte-faible', lum < 0.5 ? '#9ca3af' : '#6b7280');
    } catch(e) {}
  })();
  </script>

  <style>body { visibility: hidden; }</style>
  
  <style>
    .jeu-champ-container {
      display: grid;
      grid-template-columns: 280px 1fr 250px;
      gap: 1.5rem;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1rem 6rem;
    }

    .panneau-jeu {
      background: var(--couleur-conteneur);
      border: 1px solid var(--couleur-bordure);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panneau-jeu h2 {
      font-size: 1.1rem;
      font-weight: 700;
      border-bottom: 1px solid var(--couleur-bordure);
      padding-bottom: 0.5rem;
      margin-bottom: 0.5rem;
      color: var(--couleur-texte);
    }

    /* Grille du champ */
    .grille-champ {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.6rem;
      max-width: 440px;
      width: 100%;
      margin: 1.5rem auto;
      aspect-ratio: 1 / 1;
    }

    .case-terre {
      background: #8B5A2B;
      border: 2px solid rgba(0,0,0,0.2);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.1s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      user-select: none;
    }

    .case-terre:hover {
      filter: brightness(1.1);
    }

    /* Zone inventaire des graines achetées */
    .zone-inventaire {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.5rem;
    }

    .item-graine {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--couleur-fond);
      border: 1px solid var(--couleur-bordure);
      border-radius: 8px;
      padding: 0.75rem;
      cursor: pointer;
      user-select: none;
      transition: all 0.2s ease;
    }

    /* Style quand un sac de graine est sélectionné pour planter */
    .item-graine.actif {
      border-color: var(--couleur-bouton);
      background: rgba(37, 99, 235, 0.15); /* Légère lueur */
      transform: scale(1.02);
      box-shadow: 0 0 8px rgba(37, 99, 235, 0.3);
    }

    .item-graine.epuise {
      opacity: 0.4;
      cursor: not-allowed;
    }

    /* Modale magasin */
    .modale-graines {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modale-graines.active {
      display: flex;
    }

    .modale-graines-contenu {
      background: var(--couleur-conteneur);
      border: 1px solid var(--couleur-bordure);
      border-radius: 12px;
      padding: 2rem;
      max-width: 550px;
      width: 90%;
      position: relative;
    }

    .grille-graines {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 1.5rem;
      max-height: 350px;
      overflow-y: auto;
    }

    .ligne-magasin-graine {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--couleur-fond);
      border: 1px solid var(--couleur-bordure);
      border-radius: 8px;
      padding: 0.75rem 1rem;
      gap: 1rem;
    }

    .selecteur-quantite {
      width: 60px;
      padding: 0.3rem;
      border: 1px solid var(--couleur-bordure);
      border-radius: 6px;
      background: var(--couleur-conteneur);
      color: var(--couleur-texte);
      font-weight: 600;
      text-align: center;
    }

    .btn-fermer {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--couleur-texte-faible);
      cursor: pointer;
    }

    @media (max-width: 900px) {
      .jeu-champ-container { grid-template-columns: 1fr; }
      #score { grid-row: 1; }
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <div class="jeu-champ-container">
      
      <section class="panneau-jeu" id="achat">
        <h2>🛒 Achats & Sac</h2>
        <button class="btn btn-primary" id="btn-ouvrir-magasin">🌱 Ouvrir le Magasin</button>
        
        <h3 style="font-size: 0.9rem; margin-top: 1rem; color: var(--couleur-texte-faible);">🎒 Sélectionnez un sac pour semer :</h3>
        <div class="zone-inventaire" id="inventaire-graines">
          </div>
      </section>

      <section class="panneau-jeu" id="champ" style="text-align: center;">
        <h2>🌾 Mon Champ (4x4)</h2>
        <div class="grille-champ" id="grille-terre"></div>
      </section>

      <section class="panneau-jeu" id="score">
        <h2>💰 Économie</h2>
        <div style="font-size: 1.1rem; font-weight: 600;">
          Argent : <span id="argent-joueur" style="color: var(--couleur-bouton);">500</span> $
        </div>
        <div style="font-size: 0.85rem; color: var(--couleur-texte-faible); margin-top: 0.5rem;">
          Joueur : <span id="nom-joueur">...</span>
        </div>
      </section>

    </div>
  </main>

  <div class="modale-graines" id="modale-graines">
    <div class="modale-graines-contenu">
      <button class="btn-fermer" id="btn-fermer-graines">✕</button>
      <h3>🛒 Acheter des graines</h3>
      
      <div class="grille-graines" id="liste-magasin">
        </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
    import { chargerHeader, chargerFooter, appliquerTheme } from '../script/header.js'

    const db = createClient('https://uqjciekcfrxscfwztttt.supabase.co', 'sb_publishable_Ly-L4hecBE_r-k4qd5zTkQ_VmaKUASz')

    // Configuration des données initiales
    let argent = 500
    const catalogueGraines = [
      { id: 'graine1', nom: 'Graine Blé', emoji: '🌾', prix: 10 },
      { id: 'graine2', nom: 'Graine Carotte', emoji: '🥕', prix: 15 },
      { id: 'graine3', nom: 'Graine Maïs', emoji: '🌽', prix: 25 },
      { id: 'graine4', nom: 'Graine Tomate', emoji: '🍅', prix: 40 }
    ]

    // État de l'inventaire du joueur
    const inventaire = {
      graine1: 5, // Offertes au début pour tester
      graine2: 0,
      graine3: 0,
      graine4: 0
    }

    // Retient l'ID du sac actuellement sélectionné par le joueur (null si aucun)
    let graineActiveId = null

    // Tableau pour suivre l'état des 16 cases du champ (false = vide, true = occupé)
    const casesOccupees = new Array(16).fill(false)

    ;(async () => {
      if (!localStorage.getItem('username')) {
        window.location.href = 'connexion.html'
        return
      }

      document.body.style.setProperty('visibility', 'visible', 'important')
      appliquerTheme()
      
      await chargerHeader('../')
      await chargerFooter('../')

      document.getElementById('nom-joueur').textContent = localStorage.getItem('username')
      majAffichageArgent()

      genererGrille()
      renderInventaire()
      genererMagasin()
      initEvenements()
    })()

    function majAffichageArgent() {
      document.getElementById('argent-joueur').textContent = argent
    }

    // 1. Génère le champ et gère l'action au survol (mouseenter)
    function genererGrille() {
      const grille = document.getElementById('grille-terre')
      grille.innerHTML = ''
      
      for (let i = 0; i < 16; i++) {
        const caseTerre = document.createElement('div')
        caseTerre.classList.add('case-terre')
        caseTerre.dataset.index = i
        caseTerre.textContent = '🟫' // Aspect initial : Terre vide
        
        // Fonction partagée pour tenter de planter
        const tenterDePlanter = () => {
          // Condition 1 : Un sac doit être sélectionné
          // Condition 2 : Il doit rester au moins une graine dans ce sac
          // Condition 3 : La case doit être totalement vide (pas de doublon !)
          if (graineActiveId && inventaire[graineActiveId] > 0 && !casesOccupees[i]) {
            const templateGraine = catalogueGraines.find(g => g.id === graineActiveId)
            if (templateGraine) {
              inventaire[graineActiveId]--   // Consomme la graine
              casesOccupees[i] = true       // Marque la case comme occupée
              caseTerre.textContent = templateGraine.emoji // Affiche le fruit/légume
              
              renderInventaire()            // Met à jour les compteurs à gauche
              
              // Si le sac vient de s'épuiser suite à cette action, on désactive la sélection automatique
              if (inventaire[graineActiveId] === 0) {
                graineActiveId = null
                renderInventaire()
              }
            }
          }
        }

        // Déclencheur 1 : Dès que la souris entre/survole la case
        caseTerre.addEventListener('mouseenter', tenterDePlanter)

        // Déclencheur 2 : Permet aussi de cliquer directement si la souris était déjà posée dessus
        caseTerre.addEventListener('click', tenterDePlanter)

        grille.appendChild(caseTerre)
      }
    }

    // 2. Génère et rafraîchit le sac d'inventaire à gauche
    function renderInventaire() {
      const conteneur = document.getElementById('inventaire-graines')
      conteneur.innerHTML = ''

      catalogueGraines.forEach(graine => {
        const qte = inventaire[graine.id] || 0
        const div = document.createElement('div')
        div.classList.add('item-graine')
        
        if (qte === 0) {
          div.classList.add('epuise')
        }
        // Si ce sac est celui sélectionné pour peindre/planter, on lui applique la classe .actif
        if (graine.id === graineActiveId) {
          div.classList.add('actif')
        }
        
        div.innerHTML = `
          <span>${graine.emoji} <b>${graine.nom}</b></span>
          <span>x${qte}</span>
        `
        
        // Clic sur le sac pour l'activer / le désactiver
        div.addEventListener('click', () => {
          if (qte === 0) return // Impossible de sélectionner un sac vide

          if (graineActiveId === graine.id) {
            graineActiveId = null // Désélectionne si on re-clique dessus
          } else {
            graineActiveId = graine.id // Active ce sac
          }
          renderInventaire() // Relance le visuel pour mettre à jour les bordures bleues
        })

        conteneur.appendChild(div)
      })
    }

    // 3. Génère la boutique de graines
    function genererMagasin() {
      const liste = document.getElementById('liste-magasin')
      liste.innerHTML = ''

      catalogueGraines.forEach(graine => {
        const ligne = document.createElement('div')
        ligne.classList.add('ligne-magasin-graine')
        
        ligne.innerHTML = `
          <div style="display:flex; flex-direction:column;">
            <span>${graine.emoji} <b>${graine.nom}</b></span>
            <span style="font-size:0.8rem; color:var(--couleur-texte-faible)">Prix : ${graine.prix} $</span>
          </div>
          <div style="display:flex; align-items:center; gap:0.5rem;">
            <input type="number" min="1" max="99" value="1" class="selecteur-quantite" id="qte-${graine.id}">
            <button class="btn btn-secondary" style="padding:0.4rem 0.8rem; font-size:0.85rem;" id="btn-acheter-${graine.id}">Acheter</button>
          </div>
        `
        liste.appendChild(ligne)

        ligne.querySelector(`#btn-acheter-${graine.id}`).addEventListener('click', () => {
          const inputQte = ligne.querySelector(`#qte-${graine.id}`)
          const quantite = parseInt(inputQte.value) || 1
          const coutTotal = graine.prix * quantite

          if (argent >= coutTotal) {
            argent -= coutTotal
            inventaire[graine.id] += quantite
            majAffichageArgent()
            renderInventaire()
            inputQte.value = 1
          } else {
            alert("Fonds insuffisants pour cette quantité !")
          }
        })
      })
    }

    // 4. Gestion d'ouverture/fermeture de la modale magasin
    function initEvenements() {
      const modale = document.getElementById('modale-graines')
      const btnOuvrir = document.getElementById('btn-ouvrir-magasin')
      const btnFermer = document.getElementById('btn-fermer-graines')

      btnOuvrir.addEventListener('click', () => modale.classList.add('active'))
      btnFermer.addEventListener('click', () => modale.classList.remove('active'))
      modale.addEventListener('click', (e) => { if (e.target === modale) modale.classList.remove('active') })
    }
  </script>
</body>
</html>
