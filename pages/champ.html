<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Champ de bataille</title>
  <link rel="stylesheet" href="../style/style.css">
  
  <script>
  (function(){
    var t = localStorage.getItem('theme_couleurs');
    if (!t) return;
    try {
      var c = JSON.parse(t);
      var r = document.documentElement.style;
      r.setProperty('--couleur-fond', c.couleur_fond);
      r.setProperty('--couleur-conteneur', c.couleur_conteneur);
      r.setProperty('--couleur-bordure', c.couleur_bordure);
      r.setProperty('--couleur-bouton', c.couleur_bouton);
      var h = c.couleur_fond.replace('#','');
      var lum = (0.299*parseInt(h.substring(0,2),16) + 0.587*parseInt(h.substring(2,4),16) + 0.114*parseInt(h.substring(4,6),16)) / 255;
      r.setProperty('--couleur-texte', lum < 0.5 ? '#f1f1f1' : '#1a1a1a');
      r.setProperty('--couleur-texte-faible', lum < 0.5 ? '#9ca3af' : '#6b7280');
    } catch(e) {}
  })();
  </script>

  <style>body { visibility: hidden; }</style>
  
  <style>
    .jeu-champ-container {
      display: grid;
      grid-template-columns: 250px 1fr 250px;
      gap: 1.5rem;
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem 1rem 6rem;
    }

    /* Panneaux latéraux et centraux */
    .panneau-jeu {
      background: var(--couleur-conteneur);
      border: 1px solid var(--couleur-bordure);
      border-radius: 12px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panneau-jeu h2 {
      font-size: 1.1rem;
      font-weight: 700;
      border-bottom: 1px solid var(--couleur-bordure);
      padding-bottom: 0.5rem;
      margin-bottom: 0.5rem;
      color: var(--couleur-texte);
    }

    /* Grille du champ au centre (4x4) */
    .grille-champ {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      max-width: 400px;
      width: 100%;
      margin: 1.5rem auto;
      aspect-ratio: 1 / 1;
    }

    .case-terre {
      background: #8B5A2B; /* Couleur terre par défaut */
      border: 2px solid rgba(0,0,0,0.15);
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, filter 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
    }

    .case-terre:hover {
      filter: brightness(1.1);
      transform: scale(1.02);
    }

    /* Fenêtre modale pour le magasin de graines */
    .modale-graines {
      display: none; /* Cachée par défaut */
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }

    .modale-graines.active {
      display: flex;
    }

    .modale-graines-contenu {
      background: var(--couleur-conteneur);
      border: 1px solid var(--couleur-bordure);
      border-radius: 12px;
      padding: 2rem;
      max-width: 500px;
      width: 90%;
      position: relative;
    }

    .grille-graines {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .carte-graine {
      background: var(--couleur-fond);
      border: 1px solid var(--couleur-bordure);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .carte-graine:hover {
      border-color: var(--couleur-bouton);
    }

    .btn-fermer {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      font-size: 1.2rem;
      color: var(--couleur-texte-faible);
      cursor: pointer;
    }

    /* Responsive */
    @media (max-width: 900px) {
      .jeu-champ-container {
        grid-template-columns: 1fr;
      }
      #score {
        grid-row: 1; /* Met le score en haut sur mobile */
      }
    }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>

  <main>
    <div class="jeu-champ-container">
      
      <section class="panneau-jeu" id="achat">
        <h2>🛒 Achats</h2>
        <p style="font-size: 0.85rem; color: var(--couleur-texte-faible);">Choisissez vos outils ou graines :</p>
        <button class="btn btn-primary" id="btn-ouvrir-graines">🌱 Graines</button>
      </section>

      <section class="panneau-jeu" id="champ" style="text-align: center;">
        <h2>🌾 Mon Champ</h2>
        <div class="grille-champ" id="grille-terre"></div>
      </section>

      <section class="panneau-jeu" id="score">
        <h2>💰 Économie</h2>
        <div style="font-size: 1.1rem; font-weight: 600;">
          Argent : <span id="argent-joueur" style="color: var(--couleur-bouton);">0</span> $
        </div>
        <div style="font-size: 0.85rem; color: var(--couleur-texte-faible); margin-top: 0.5rem;">
          Joueur : <span id="nom-joueur">...</span>
        </div>
      </section>

    </div>
  </main>

  <div class="modale-graines" id="modale-graines">
    <div class="modale-graines-contenu">
      <button class="btn-fermer" id="btn-fermer-graines">✕</button>
      <h3>Sélectionner une Graine</h3>
      
      <div class="grille-graines">
        <div class="carte-graine">🌱 Graine 1</div>
        <div class="carte-graine">🌿 Graine 2</div>
        <div class="carte-graine">🥕 Graine 3</div>
        <div class="carte-graine">🌽 Graine 4</div>
        <div class="carte-graine">🌻 Graine 5</div>
        <div class="carte-graine">🍅 Graine 6</div>
      </div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
    import { chargerHeader, chargerFooter, appliquerTheme } from '../script/header.js'

    const db = createClient('https://uqjciekcfrxscfwztttt.supabase.co', 'sb_publishable_Ly-L4hecBE_r-k4qd5zTkQ_VmaKUASz')

    ;(async () => {
      // Sécurité : Redirection si non connecté
      if (!localStorage.getItem('username')) {
        window.location.href = 'connexion.html'
        return
      }

      document.body.style.setProperty('visibility', 'visible', 'important')
      appliquerTheme()
      
      await chargerHeader('../')
      await chargerFooter('../')

      // Remplissage infos de base
      const username = localStorage.getItem('username')
      document.getElementById('nom-joueur').textContent = username
      
      // Exemple : Initialise l'argent à 150 pour l'instant (à lier à ta BDD plus tard)
      document.getElementById('argent-joueur').textContent = '150'

      // Initialisation des éléments de jeu
      genererGrille()
      initEvenements()
    })()

    // Génère dynamiquement les 16 cases (4x4) de terre
    function genererGrille() {
      const grille = document.getElementById('grille-terre')
      grille.innerHTML = '' // On vide d'abord
      
      for (let i = 0; i < 16; i++) {
        const caseTerre = document.createElement('div')
        caseTerre.classList.add('case-terre')
        caseTerre.dataset.index = i
        // Petit effet visuel par défaut (optionnel)
        caseTerre.textContent = '🟫' 
        
        caseTerre.addEventListener('click', () => {
          console.log(`Case cliquée : ${i}`)
        })
        grille.appendChild(caseTerre)
      }
    }

    // Gère l'ouverture/fermeture de la fenêtre de graines
    function initEvenements() {
      const modale = document.getElementById('modale-graines')
      const btnOuvrir = document.getElementById('btn-ouvrir-graines')
      const btnFermer = document.getElementById('btn-fermer-graines')

      btnOuvrir.addEventListener('click', () => {
        modale.classList.add('active')
      })

      btnFermer.addEventListener('click', () => {
        modale.classList.remove('active')
      })

      // Ferme la fenêtre si on clique en dehors du carré blanc
      modale.addEventListener('click', (e) => {
        if (e.target === modale) {
          modale.classList.remove('active')
        }
      })
    }
  </script>
</body>
</html>
