      // Pioche automatique de cartes, dont le rythme accélère à 1m30.
      tempsDepuisPioche += dt
      const intervallePioche = intervallePiocheActuel()
      let mainAAfficher = false
      while (tempsDepuisPioche >= intervallePioche) {
        tempsDepuisPioche -= intervallePioche
        piocherCarteAutomatique()
        mainAAfficher = true
      }

      if (orAAffiche && !mainAAfficher) renderMain()

      // Mort subite (dès 4m30) : les deux châteaux perdent en continu un
      // pourcentage de leurs PV max par seconde, jusqu'à destruction de l'un.
      if (enMortSubite()) {
        const perte = (dt / 1000) * MORT_SUBITE_TAUX
        joueurChateauPV = Math.max(0, joueurChateauPV - joueurChateauPVMax * perte)
        ennemiChateauPV = Math.max(0, ennemiChateauPV - ennemiChateauPVMax * perte)
      }

      actualiserAffichageTimer()
      actualiserJaugePioche()

      if (ennemiChateauPV <= 0) {
        terminerPartie(true)
      } else if (joueurChateauPV <= 0) {
        terminerPartie(false)
      }
    }

    render()

    requestAnimationFrame(boucleDeJeu)
  }

  // La taille CSS affichée du canvas s'adapte déjà toute seule (voir
  // max-width/max-height:100% sur #game-canvas) : zoomer ou redimensionner
  // la fenêtre ne fait qu'étirer/rétrécir visuellement le même contenu,
  // sans qu'on ait besoin de toucher à sa résolution interne (R, HS, VS,
  // canvas.width/height). Recalculer cette résolution EN PLEIN COMBAT est
  // justement ce qui causait des unités "téléportées" ou redimensionnées de
  // façon incohérente au zoom : on ne le fait donc plus que hors combat
  // (avant de lancer la partie, ou une fois celle-ci terminée), moments où
  // le terrain ne contient aucune unité à perturber — ça reste utile pour
  // bien s'adapter à une vraie rotation d'écran avant de jouer. Pendant la
  // partie, la résolution interne reste fixe du début à la fin : le jeu
  // n'est alors plus du tout dépendant de l'état (zoom, taille) de la page.
  window.addEventListener('resize', () => {
    if (canvas && (!partieCommencee || partieTerminee)) initArena()
  })

  // ─── Glisser-déposer des cartes (souris + tactile via pointer events) ──
  let carteEnCours = null
  let ghostEl = null
  let messageTimeout = null

  function afficherMessage(texte) {
    const el = document.getElementById('battlogy-message')
    el.textContent = texte
    el.classList.add('visible')
    clearTimeout(messageTimeout)
    messageTimeout = setTimeout(() => el.classList.remove('visible'), 1600)
  }

  // Convertit des coordonnées écran (clientX/Y) en coordonnées du canvas,
  // ou null si le point est en dehors du canvas.
  function clientVersCanvas(clientX, clientY) {
    if (!canvas) return null
    const r = canvas.getBoundingClientRect()
    if (!r.width || !r.height) return null
    // Ne renvoie plus null pour un point légèrement à l'extérieur du
    // canvas : ça permet à trouverHexPourPose() de rattraper une pose
    // imprécise proche du bord de l'arène au lieu de la refuser d'office.
    return {
      x: (clientX - r.left) * (canvas.width / r.width),
      y: (clientY - r.top) * (canvas.height / r.height)
    }
  }

  // `uid` identifie l'exemplaire précis dans la main (indispensable dès
  // qu'on autorise les doublons : deux cartes "guerrier" en main ont
  // chacune leur propre uid).
  function tenterPoserCarte(uid, hex) {
    const item = main.find(m => m.uid === uid)
    if (!item) return
    const carte = CARTES[item.carteId]
    if (!carte) return
    if (!hex) { afficherMessage('Pose ta carte sur une case du terrain.'); return }
    if (!estPositionValidePourPose(item.carteId, hex)) {
      afficherMessage(
        carte.placementLibre
          ? 'Case invalide.'
          : "Tu ne peux pas poser cette unité ici pour l'instant."
      )
      return
    }
    if (or < carte.cout) { afficherMessage("Pas assez d'or."); return }
    or -= carte.cout
    main = main.filter(m => m.uid !== uid)
    renderMain()
    // La carte est posée exactement au centre de la case (pas à l'endroit
    // précis du curseur/doigt).
    if (carte.effetInstantane) {
      lancerSortZone(carte, hex.cx, hex.cy, 'joueur')
    } else {
      poserCarte(carte, hex.cx, hex.cy, 'joueur')
    }
  }

  // Détruire volontairement une carte (zone de destruction) : aucun impact
  // sur l'or ni sur les poids de tirage — juste un retrait de la main.
  function detruireCarteMain(uid) {
    if (!main.some(m => m.uid === uid)) return
    main = main.filter(m => m.uid !== uid)
    renderMain()
    afficherMessage('Carte détruite.')
  }

  // `carteEnCours` contient désormais l'uid de la carte en main en cours
  // de glisser (et non plus son carteId), pour distinguer les doublons.
  function initGlisserDeposer() {
    const cartes = document.querySelectorAll('.carte-main')
    cartes.forEach(el => {
      el.addEventListener('pointerdown', (e) => {
        if (!partieCommencee || partieTerminee) return
        if (carteEnCours) return // un glisser (souris ou clavier) est déjà en cours
        e.preventDefault()
        const uid = Number(el.dataset.uid)
        const item = main.find(m => m.uid === uid)
        if (!item) return
        carteEnCours = uid
        ghostEl = document.createElement('div')
        ghostEl.className = 'carte-ghost'
        ghostEl.textContent = CARTES[item.carteId]?.emoji || ''
        document.body.appendChild(ghostEl)
        deplacerGhost(e.clientX, e.clientY)
        document.addEventListener('pointermove', pendantGlisser)
        document.addEventListener('pointerup', finGlisser)
      })
    })
  }

  function deplacerGhost(cx, cy) {
    if (!ghostEl) return
    ghostEl.style.left = cx + 'px'
    ghostEl.style.top = cy + 'px'
  }

  // La zone de destruction n'apparaît que pendant un glisser, et se
  // surligne si le pointeur la survole (glisser-déposer pour défausser).
  function zoneDestructionSurvolee(cx, cy) {
    const zone = document.getElementById('zone-destruction')
    const r = zone.getBoundingClientRect()
    return cx >= r.left && cx <= r.right && cy >= r.top && cy <= r.bottom
  }

  function pendantGlisser(e) {
    enTrainDeGlisser = true
    deplacerGhost(e.clientX, e.clientY)

    const zone = document.getElementById('zone-destruction')
    zone.classList.add('visible')
    const survolee = zoneDestructionSurvolee(e.clientX, e.clientY)
    zone.classList.toggle('survolee', survolee)

    const pt = clientVersCanvas(e.clientX, e.clientY)
    const item = carteEnCours ? main.find(m => m.uid === carteEnCours) : null
    hexSurvole = (survolee || !item || !pt) ? null : trouverHexPourPose(item.carteId, pt.x, pt.y)
  }

  function finGlisser(e) {
    document.removeEventListener('pointermove', pendantGlisser)
    document.removeEventListener('pointerup', finGlisser)
    enTrainDeGlisser = false
    if (ghostEl) { ghostEl.remove(); ghostEl = null }

    // Important : on teste le survol de la zone de destruction AVANT de la
    // masquer (classe 'visible' retirée juste après) — sinon son
    // getBoundingClientRect() renvoie une zone nulle (display:none) et la
    // défausse échoue systématiquement, retombant à tort sur une tentative
    // de pose hors du terrain.
    const zone = document.getElementById('zone-destruction')
    const survoleeDestruction = carteEnCours ? zoneDestructionSurvolee(e.clientX, e.clientY) : false
    zone.classList.remove('visible', 'survolee')

    if (carteEnCours) {
      if (survoleeDestruction) {
        detruireCarteMain(carteEnCours)
      } else {
        const item = main.find(m => m.uid === carteEnCours)
        const pt = clientVersCanvas(e.clientX, e.clientY)
        const hex = (item && pt) ? trouverHexPourPose(item.carteId, pt.x, pt.y) : null
        tenterPoserCarte(carteEnCours, hex)
      }
    }
    hexSurvole = null
    carteEnCours = null
  }

  // ─── Raccourcis clavier : rangée A-Z-E-R-T ─────────────────────────────
  // On se base sur `event.code` (KeyQ, KeyW, KeyE, KeyR, KeyT…), qui
  // correspond à l'emplacement PHYSIQUE de la touche et pas au caractère
  // affiché — ces mêmes emplacements affichent A, Z, E, R, T sur un clavier
  // AZERTY (les 3 dernières touches, E/R/T, sont d'ailleurs déjà identiques
  // entre AZERTY et QWERTY). KeyQ prend la 1ère carte de la main, KeyW la
  // 2ème, etc. (main limitée à 5 cartes désormais). La carte se retrouve
  // directement « en main » (comme si on avait commencé à la glisser) tant
  // que la touche reste enfoncée ; la relâcher la pose, exactement comme un
  // glisser-déposer classique.
  const TOUCHES_CARTES = ['KeyQ', 'KeyW', 'KeyE', 'KeyR', 'KeyT']
  const TOUCHES_CARTES_LABEL = ['A', 'Z', 'E', 'R', 'T']
  let toucheCarteEnCours = null
  const dernierPointeur = { x: window.innerWidth / 2, y: window.innerHeight / 2 }

  // Suivi permanent (indépendant d'un glisser en cours) de la position du
  // curseur, nécessaire car les évènements clavier ne portent pas de
  // coordonnées : on doit connaître la dernière position connue de la
  // souris pour faire apparaître le fantôme de la carte au bon endroit.
  document.addEventListener('pointermove', (e) => {
    dernierPointeur.x = e.clientX
    dernierPointeur.y = e.clientY
    if (toucheCarteEnCours) pendantGlisser(e)
  })

  document.addEventListener('keydown', (e) => {
    if (e.repeat) return
    const index = TOUCHES_CARTES.indexOf(e.code)
    if (index === -1) return
    if (!partieCommencee || partieTerminee) return
    if (carteEnCours) return // un glisser (souris ou clavier) est déjà en cours
    const item = main[index]
    if (!item || !CARTES[item.carteId]) return

    e.preventDefault()
    toucheCarteEnCours = e.code
    carteEnCours = item.uid
    ghostEl = document.createElement('div')
    ghostEl.className = 'carte-ghost'
    ghostEl.textContent = CARTES[item.carteId]?.emoji || ''
    document.body.appendChild(ghostEl)
    pendantGlisser({ clientX: dernierPointeur.x, clientY: dernierPointeur.y })
  })

  document.addEventListener('keyup', (e) => {
    if (e.code !== toucheCarteEnCours) return
    toucheCarteEnCours = null
    finGlisser({ clientX: dernierPointeur.x, clientY: dernierPointeur.y })
  })

  document.getElementById('btn-pioche-urgence').addEventListener('click', piocherUrgence)

  // ─── Écran de démarrage / fin de partie ────────────────────────
  function actualiserCartesDisponibles(disponible) {
    renderMain()
  }

  function afficherEcran(titre, texte, texteBouton) {
    document.getElementById('overlay-titre').textContent = titre
    document.getElementById('overlay-texte').textContent = texte
    document.getElementById('btn-lancer').textContent = texteBouton
    document.getElementById('arena-overlay').classList.remove('cachee')
    actualiserCartesDisponibles(false)
  }

  function masquerEcran() {
    document.getElementById('arena-overlay').classList.add('cachee')
  }

  function demarrerPartie() {
    // Réinitialise entièrement la partie (utile aussi pour « Rejouer »).
    unitesJoueur = []
    unitesEnnemi = []
    joueurChateauPV = joueurChateauPVMax
    ennemiChateauPV = ennemiChateauPVMax
    tempsDepuisSpawnEnnemi = 0
    hexSurvole = null
    projectiles = []
    effetsMelee = []
    effetsSort = []
    partieTerminee = false
    partieCommencee = true

    // Deck/main/or : remis à zéro à chaque partie (les poids ne persistent
    // pas d'une partie à l'autre, seule la composition du deck est sauvée).
    or = 0
    orCapaciteMax = OR_CAPACITE_DEPART
    deckSlots = chargerCompositionDeck().map(carteId => ({ carteId, poids: POIDS_DEPART }))
    tempsDepuisGeneration = 0
    tempsDepuisPioche = 0
    tempsCombat = 0
    remplirMainInitiale()

    masquerEcran()
    actualiserCartesDisponibles(true)
    actualiserAffichageTimer()
  }

  function terminerPartie(victoire) {
    partieTerminee = true
    afficherEcran(
      victoire ? '🏆 Victoire !' : '💀 Défaite…',
      victoire ? 'Le château ennemi est détruit.' : 'Ton château a été détruit.',
      'Rejouer'
    )
  }

  document.getElementById('btn-lancer').addEventListener('click', demarrerPartie)

  renderMain()

  // ─── Modale d'édition du deck ───────────────────────────────────
  // État temporaire d'édition : { carteId: quantité }, initialisé depuis
  // la composition sauvegardée (ou celle par défaut) à chaque ouverture.
  let editionDeck = {}

  function compositionVersCompte(liste) {
    const compte = {}
    for (const id of liste) compte[id] = (compte[id] || 0) + 1
    return compte
  }

  function totalEditionDeck() {
    return Object.values(editionDeck).reduce((a, b) => a + b, 0)
  }

  function renderModaleDeck() {
    const total = totalEditionDeck()
    document.getElementById('deck-compteur').textContent = total
    document.getElementById('deck-liste').innerHTML = Object.values(CARTES).map(carte => {
      const verrouillee = !cartesDebloquees.has(carte.id)
      const qte = verrouillee ? 0 : (editionDeck[carte.id] || 0)
      const peutAjouter = !verrouillee && total < DECK_TAILLE
      return `
        <div class="deck-ligne${verrouillee ? ' deck-ligne-verrouillee' : ''}">
          <span class="deck-emoji">${carte.emoji}</span>
          <div class="deck-infos">
            <div class="deck-nom">${carte.nom}${verrouillee ? ' 🔒' : ''}</div>
            <div class="deck-cout">${verrouillee ? 'Non débloquée' : 'Coût ' + carte.cout + ' or'}</div>
          </div>
          <div class="deck-stepper">
            <button type="button" data-action="moins" data-carte="${carte.id}" ${qte <= 0 ? 'disabled' : ''}>−</button>
            <span>${qte}</span>
            <button type="button" data-action="plus" data-carte="${carte.id}" ${!peutAjouter ? 'disabled' : ''}>+</button>
          </div>
        </div>`
    }).join('')
  }

  function ouvrirModaleDeck() {
    editionDeck = compositionVersCompte(chargerCompositionDeck())
    renderModaleDeck()
    document.getElementById('modale-deck-fond').classList.add('ouverte')
  }

  window.fermerModaleDeck = function() {
    document.getElementById('modale-deck-fond').classList.remove('ouverte')
  }

  document.getElementById('btn-editer-deck').addEventListener('click', ouvrirModaleDeck)

  document.getElementById('deck-liste').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-action]')
    if (!btn) return
    const carteId = btn.dataset.carte
    const total = totalEditionDeck()
    if (btn.dataset.action === 'plus' && total < DECK_TAILLE) {
      editionDeck[carteId] = (editionDeck[carteId] || 0) + 1
    } else if (btn.dataset.action === 'moins' && (editionDeck[carteId] || 0) > 0) {
      editionDeck[carteId] = editionDeck[carteId] - 1
    }
    renderModaleDeck()
  })

  document.getElementById('btn-deck-reset').addEventListener('click', () => {
    editionDeck = compositionVersCompte(DECK_PAR_DEFAUT.filter(id => cartesDebloquees.has(id)))
    renderModaleDeck()
  })

  document.getElementById('btn-deck-sauver').addEventListener('click', () => {
    const liste = []
    for (const [carteId, qte] of Object.entries(editionDeck)) {
      for (let i = 0; i < qte; i++) liste.push(carteId)
    }
    sauvegarderCompositionDeck(liste)
    afficherMessage('Deck enregistré.')
    fermerModaleDeck()
  })

  /* ════════════════════════════════════════════════════════════════════
   *  BATTLOGY — RÉSUMÉ DES RÈGLES DU JEU
   *  (commentaire purement informatif : rien ici n'est exécuté, aucun
   *  impact sur le jeu — juste un pense-bête pour s'y retrouver dans le
   *  code plus tard.)
   * ════════════════════════════════════════════════════════════════════
   *
   *  BUT DU JEU
   *  ----------
   *  Détruire le château ennemi (en haut) avant que le sien (en bas, celui
   *  du joueur) ne soit détruit. Chaque château a 1000 PV.
   *
   *  LES CARTES
   *  ----------
   *  - Guerrier ⚔️  (coût 1) : mêlée, 100 PV, 10 dégâts, taille normale.
   *  - Archer   🏹  (coût 2) : distance (120px de portée), 55 PV, 12 dégâts.
   *  - Squelettes 💀 (coût 2) : mêlée, invoque 3 unités d'un coup, 30 PV et
   *    5 dégâts chacune, 2x plus petites que les autres (taille 0.5) —
   *    donc une hit box plus petite, plus dures à toucher pour l'adversaire.
   *  - Statue   🗿  (coût 3) : catégorisée comme un SORT, pas une troupe.
   *    Ne bouge jamais, n'attaque jamais : encaisse juste les dégâts
   *    (120 PV). Contourne toutes les règles de placement ci-dessous
   *    (posable n'importe où sur le terrain, y compris en zone ennemie).
   *    Reste comptée comme une alliée pour tout le reste (elle peut donc
   *    "ouvrir la route" à d'autres troupes si elle est posée loin devant).
   *
   *  RÈGLES DE PLACEMENT (identiques pour le joueur ET le bot ennemi,
   *  simplement inversées de camp)
   *  ------------------------------------------------------------------
   *  1. Aucune unité alliée sur le terrain → on ne peut poser que sur les
   *     2 rangées d'hexagones qui collent son propre château.
   *  2. Dès qu'une unité alliée est présente → on peut poser n'importe où
   *     entre le château et cette unité (la plus avancée, s'il y en a
   *     plusieurs) — le "front" avance avec l'armée.
   *  3. Si un ennemi s'est infiltré entre le château et l'unité alliée la
   *     plus avancée, la zone de pose se referme jusqu'à lui : on ne peut
   *     plus poser qu'entre cet ennemi et son propre château (impossible
   *     de renforcer au-delà d'un ennemi qui a percé les lignes).
   *  4. Dans tous les cas : jamais dans la moitié du terrain adverse — sauf
   *     capacité spéciale de type "placementLibre" (voir la Statue).
   *
   *  COMBAT
   *  ------
   *  - Chaque unité a une portée de détection calculée dynamiquement
   *    (porteeDetectionEffective) : toujours un peu plus loin que sa
   *    portée d'attaque, et au moins aussi large que le plateau, pour
   *    qu'aucun ennemi à son niveau ne reste invisible. Tant que rien
   *    n'est détecté, l'unité marche en ligne purement verticale vers le
   *    château adverse ; dès qu'un ennemi (ou le château adverse) entre
   *    dans cette zone, elle fonce droit dessus ; dès que quelqu'un entre
   *    dans sa portée d'attaque, elle l'attaque. Impossible de détecter
   *    quelqu'un strictement dans son dos (et réciproquement).
   *  - Les châteaux se comportent comme des murs infranchissables (comme
   *    les bords de l'arène) : aucune unité, alliée ou ennemie, ne peut
   *    être poussée à l'intérieur.
   *  - Une unité "immobile" (statue) ne fait jamais rien d'autre qu'exister
   *    et perdre des PV.
   *  - Attaque au CORPS À CORPS : dégâts appliqués immédiatement, avec un
   *    petit éclat visuel (effetsMelee) au point de contact.
   *  - Attaque à DISTANCE : une flèche (projectile) est tirée vers la
   *    cible ; les dégâts ne sont infligés qu'à l'IMPACT du projectile, pas
   *    au moment du tir. Si la cible meurt avant l'impact, la flèche finit
   *    sa course sans rien toucher.
   *
   *  RACCOURCIS CLAVIER
   *  -------------------
   *  Les touches A, Z, E, R, T (rangée juste sous les chiffres, en AZERTY)
   *  prennent la carte à la position correspondante dans la MAIN
   *  (5 emplacements max désormais) directement "en main", comme si on
   *  avait commencé à la glisser à la souris. Tant que la touche est
   *  maintenue, la carte suit le curseur ; la relâcher la pose à l'endroit
   *  visé (ou annule si l'endroit n'est pas valide, ou la détruit si la
   *  zone de destruction est survolée). Basé sur `event.code` (KeyQ,
   *  KeyW…, l'emplacement physique de la touche), donc le raccourci reste
   *  sur A/Z/E/R/T quelle que soit la disposition du clavier.
   *
   *  DECK (choisi par le joueur, jusqu'à 10 emplacements, doublons
   *  autorisés pour l'instant — limite finale visée : 2 exemplaires par
   *  carte, pas encore appliquée)
   *  ------------------------------------------------------------------
   *  - Édité via la modale "Éditer mon deck" (bouton à côté de "Lancer la
   *    partie"), sauvegardé en BDD (Supabase, table battlogy_decks, une
   *    ligne par joueur — voir script/battlogy.js). Un deck de base est
   *    fourni par défaut tant que rien n'a été enregistré. Seules les
   *    cartes débloquées par le joueur (table battlogy_cartes_utilisateurs)
   *    peuvent être ajoutées au deck ; les autres apparaissent verrouillées
   *    🔒 dans la modale.
   *  - C'est un "paquet infini" à tirage pondéré : chaque emplacement (même
   *    en cas de doublon) a son propre poids, indépendant des autres.
   *    Poids de départ 1, borné entre 0 (POIDS_MIN) et 2.5 (POIDS_MAX).
   *  - À chaque tirage : la carte tirée perd 0.9 de poids (plancher 0),
   *    toutes les AUTRES cartes du deck gagnent +0.1 (plafond 2.5).
   *  - Malus de tirage (appliqué uniquement au moment du tirage, n'altère
   *    pas le poids stocké) : ×0.7 pour toute carte dont le coût dépasse
   *    la capacité max d'or actuelle du joueur (orCapaciteMax).
   *
   *  MAIN
   *  ----
   *  - 5 cartes maximum. Jouer une carte (la poser sur le terrain) ou la
   *    détruire (zone de destruction) la retire de la main.
   *  - Pioche automatique : 1 carte/8s en phase 1, 1 carte/4s dès 1m30 de
   *    combat (voir PHASES ci-dessous). Chaque pioche automatique augmente
   *    orCapaciteMax de 1 (jusqu'à 12), que la carte tienne dans la main ou
   *    non — si la main est déjà pleine, la carte est piochée (les poids
   *    sont mis à jour normalement) puis aussitôt détruite.
   *  - Main de départ : 3 cartes tirées immédiatement au lancement de la
   *    partie, avec un bonus ×2 de poids pour les cartes coûtant ≤ 3 or
   *    (bonus qui ne s'applique qu'à ce tirage initial).
   *  - Pioche d'urgence : possible uniquement si la main est VIDE. Coûte 5
   *    or, tire 2 cartes instantanément. Met à jour les poids normalement,
   *    mais ne relance PAS le cooldown de pioche automatique et n'augmente
   *    PAS orCapaciteMax.
   *  - Destruction volontaire (glisser une carte sur la zone de
   *    destruction) : aucun impact sur l'or ni sur les poids de tirage.
   *
   *  OR
   *  --
   *  - Génération continue, plafonnée à orCapaciteMax : 1 or/1.5s en phase
   *    1, 1 or/1s dès 1m30, 1 or/0.5s dès 3min de combat.
   *  - orCapaciteMax démarre à 3, +1 par pioche automatique (jusqu'à un
   *    maximum absolu de 12 — atteint après 9 pioches automatiques).
   *  - Poser une unité consomme son coût en or ; impossible si le stock
   *    actuel (or, pas orCapaciteMax) est insuffisant.
   *
   *  PHASES & MORT SUBITE (temps de combat total, indépendant du temps
   *  réel si l'onglet est en arrière-plan — dt plafonné à 50ms/frame)
   *  ------------------------------------------------------------------
   *  - 0 → 1m30 (PHASE_2_T)     : phase 1 (or 1.5s, pioche 8s).
   *  - 1m30 → 3min (PHASE_3_T)  : phase 2 (or 1s, pioche 4s).
   *  - 3min → 4m30 (MORT_SUBITE_T) : phase 3 (or 0.5s, pioche 4s inchangée).
   *  - Dès 4m30 : mort subite — les DEUX châteaux perdent en continu 3.5 %
   *    de leurs PV MAX par seconde (indépendamment des combats), jusqu'à
   *    la destruction de l'un des deux. Les rythmes d'or/pioche de la
   *    phase 3 restent inchangés en parallèle.
   *  - Un compte à rebours vers la prochaine phase est affiché en haut de
   *    l'écran (élément #battlogy-timer) pendant toute la partie.
   *
   *  IA ENNEMIE
   *  ----------
   *  Inchangée : spawn d'un guerrier toutes les 10s (INTERVALLE_SPAWN_ENNEMI),
   *  totalement indépendante du deck/main/or du joueur.
   * ════════════════════════════════════════════════════════════════════ */
  </script>
</body>
</html>
