<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battlogy</title>
  <link rel="stylesheet" href="../style/style.css">
  <script>
  (function(){
    var t = localStorage.getItem('theme_couleurs');
    if (!t) return;
    try {
      var c = JSON.parse(t);
      var r = document.documentElement.style;
      r.setProperty('--couleur-fond', c.couleur_fond);
      r.setProperty('--couleur-conteneur', c.couleur_conteneur);
      r.setProperty('--couleur-bordure', c.couleur_bordure);
      r.setProperty('--couleur-bouton', c.couleur_bouton);
      var h = c.couleur_fond.replace('#','');
      var lum=(0.299*parseInt(h.substring(0,2),16)+0.587*parseInt(h.substring(2,4),16)+0.114*parseInt(h.substring(4,6),16))/255;
      r.setProperty('--couleur-texte', lum < 0.5 ? '#f1f1f1' : '#1a1a1a');
      r.setProperty('--couleur-texte-faible', lum < 0.5 ? '#9ca3af' : '#6b7280');
    } catch(e) {}
  })();
  </script>
  <style>body { visibility: hidden; }</style>
  <style>
    html, body { height: 100%; }
    body {
      height: 100vh;
      height: 100dvh; /* tient compte des barres d'adresse mobiles (iOS/Android) */
      overflow: hidden;
    }
    /* Cette page ne charge pas de footer : le header (en haut) et
       <main> (flex:1) se partagent donc toute la hauteur d'écran fixée
       ci-dessus, et l'arène (flex:1 dans .battlogy-wrap) récupère
       exactement ce qui reste après le titre et la barre de cartes. */
    main { flex: 1 1 auto; min-height: 0; display: flex; }
    .battlogy-wrap {
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
      height: 100%;
      box-sizing: border-box;
      padding: .75rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .6rem;
      overflow: hidden;
    }
    .battlogy-topbar {
      width: 100%;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .battlogy-topbar h1 { margin: 0; font-size: 1.4rem; }
    .battlogy-beta {
      font-size: .72rem;
      font-weight: 700;
      color: #f59e0b;
      background: #f59e0b22;
      border: 1px solid #f59e0b55;
      border-radius: 999px;
      padding: .2rem .65rem;
      letter-spacing: .05em;
    }
    .arena-outer {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--couleur-bordure);
      border-radius: 12px;
      overflow: hidden;
      background: #0b160b;
      position: relative;
    }
    #game-canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
    }
    .arena-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 1rem;
    }
    .arena-overlay.cachee { display: none; }
    .arena-overlay-carte {
      background: var(--couleur-conteneur);
      border-radius: 12px;
      padding: 1.75rem 2rem;
      text-align: center;
      max-width: 280px;
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
    }
    .arena-overlay-carte h2 { font-size: 1.3rem; margin-bottom: .5rem; }
    .arena-overlay-carte p {
      color: var(--couleur-texte-faible);
      font-size: .85rem;
      margin-bottom: 1.25rem;
    }
    .battlogy-bottombar {
      width: 100%;
      flex: 0 0 auto;
      min-height: 84px;
      border: 1px solid var(--couleur-bordure);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: .75rem;
      padding: .6rem .75rem;
      color: var(--couleur-texte-faible);
      font-size: .8rem;
      text-align: center;
      background: var(--couleur-conteneur);
    }
    .battlogy-or {
      font-size: .85rem;
      font-weight: 700;
      color: var(--couleur-texte);
      white-space: nowrap;
      padding: 0 .5rem;
      border-right: 1px solid var(--couleur-bordure);
      margin-right: .25rem;
    }

    /* ═══ Jauge d'or : barre de progression current/max, lisible d'un coup d'œil ═══ */
    .or-jauge {
      position: relative;
      flex: 0 0 auto;
      width: 108px;
      height: 30px;
      border-radius: 999px;
      background: var(--couleur-fond);
      border: 1px solid var(--couleur-bordure);
      overflow: hidden;
      margin-right: .4rem;
    }
    .or-jauge-remplissage {
      position: absolute;
      inset: 0;
      width: 0%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      transition: width .25s ease;
    }
    .or-jauge-texte {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-size: .78rem;
      font-weight: 700;
      color: #1a1a1a;
      text-shadow: 0 1px 0 rgba(255,255,255,.35);
      white-space: nowrap;
    }

    /* ═══ Jauge de pioche : camembert qui se remplit jusqu'à la prochaine carte ═══ */
    .pioche-jauge {
      position: relative;
      flex: 0 0 auto;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--couleur-bordure);
      margin-right: .5rem;
    }
    .pioche-camembert {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(var(--couleur-bouton) calc(var(--p, 0) * 1%), transparent 0);
      transition: background .1s linear;
    }
    .pioche-icone {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: .8rem;
      filter: drop-shadow(0 1px 2px rgba(0,0,0,.6));
    }
    .carte-main {
      width: 66px;
      height: 78px;
      flex: 0 0 auto;
      background: var(--couleur-fond);
      border: 2px solid var(--couleur-bouton);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .15rem;
      cursor: grab;
      user-select: none;
      touch-action: none;
      transition: filter .1s, transform .1s;
      position: relative;
    }
    .carte-main:active { cursor: grabbing; transform: scale(0.96); }
    .carte-main.indisponible { opacity: .4; cursor: not-allowed; }
    .carte-main .carte-emoji { font-size: 1.5rem; }
    .carte-main .carte-nom { font-size: .62rem; font-weight: 700; color: var(--couleur-texte); }
    .carte-main .carte-cout {
      font-size: .68rem;
      font-weight: 700;
      color: #92400e;
      background: #fef3c7;
      border-radius: 999px;
      padding: 0 .4rem;
    }
    /* Petit indice du raccourci clavier (touche du rang des chiffres) associé
       à cette carte — purement indicatif, n'a aucun effet sur le jeu. */
    .carte-main .carte-touche {
      position: absolute;
      top: -6px;
      left: -6px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--couleur-conteneur);
      border: 1px solid var(--couleur-bordure);
      color: var(--couleur-texte-faible);
      font-size: .62rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .carte-ghost {
      position: fixed;
      z-index: 2000;
      pointer-events: none;
      transform: translate(-50%, -50%);
      font-size: 1.8rem;
      opacity: .45;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.4));
    }
    .battlogy-message {
      position: fixed;
      left: 50%;
      bottom: 6.2rem;
      transform: translateX(-50%);
      background: #111827dd;
      color: #fff;
      font-size: .8rem;
      padding: .5rem 1rem;
      border-radius: 999px;
      z-index: 2001;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      white-space: nowrap;
    }
    .battlogy-message.visible { opacity: 1; }

    /* ═══ Animation de carte piochée (visualise la carte tirée du paquet,
       et si la main est pleine, la carte perdue) ═══ */
    .carte-pioche-anim {
      position: fixed;
      z-index: 2500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .2rem;
      pointer-events: none;
      animation: cartePiocheeGagnee 1.1s ease forwards;
    }
    .carte-pioche-anim .carte-pioche-emoji {
      font-size: 1.9rem;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.5));
    }
    .carte-pioche-anim .carte-pioche-label {
      font-size: .66rem;
      font-weight: 700;
      color: #bbf7d0;
      background: #111827dd;
      padding: .15rem .55rem;
      border-radius: 999px;
      white-space: nowrap;
    }
    .carte-pioche-anim.perdue {
      animation-name: cartePiocheePerdue;
      animation-duration: 1.3s;
    }
    .carte-pioche-anim.perdue .carte-pioche-label { color: #fecaca; background: #7f1d1dcc; }
    .carte-pioche-anim.perdue .carte-pioche-emoji { filter: grayscale(1) drop-shadow(0 2px 6px rgba(0,0,0,.5)); }

    @keyframes cartePiocheeGagnee {
      0%   { transform: translate(-50%, -50%) scale(.4); opacity: 0; }
      18%  { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
      35%  { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(-50%, -110%) scale(.7); opacity: 0; }
    }
    @keyframes cartePiocheePerdue {
      0%   { transform: translate(-50%, -50%) scale(.4) rotate(0deg); opacity: 0; }
      18%  { transform: translate(-50%, -50%) scale(1.2) rotate(-10deg); opacity: 1; }
      35%  { transform: translate(-50%, -50%) scale(1) rotate(8deg); opacity: 1; }
      55%  { transform: translate(-50%, -50%) scale(1) rotate(-6deg); opacity: 1; }
      100% { transform: translate(-50%, 20%) scale(.6) rotate(0deg); opacity: 0; }
    }

    /* ═══ Timer de phase ═══ */
    .battlogy-timer {
      font-size: .78rem;
      font-weight: 700;
      color: var(--couleur-texte-faible);
      background: var(--couleur-fond);
      border: 1px solid var(--couleur-bordure);
      border-radius: 999px;
      padding: .3rem .8rem;
      white-space: nowrap;
    }
    .battlogy-timer.mort-subite { color: #ef4444; border-color: #ef444455; background: #ef444418; }

    /* ═══ Bouton "éditer le deck" à côté de "Lancer la partie" ═══ */
    .arena-overlay-carte .btn-group { margin-top: 0; }

    /* ═══ Barre du bas : or, main dynamique, pioche d'urgence ═══ */
    #main-cartes { display: flex; align-items: center; gap: .5rem; flex: 1 1 auto; flex-wrap: wrap; }
    .carte-main.cout-eleve { filter: grayscale(.5); }
    .btn-pioche-urgence {
      flex: 0 0 auto;
      font-size: .72rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: .5rem .6rem;
      background: #f59e0b;
      color: #1a1a1a;
      cursor: pointer;
      white-space: nowrap;
      transition: filter .15s;
    }
    .btn-pioche-urgence:hover { filter: brightness(.92); }
    .btn-pioche-urgence:disabled { background: var(--couleur-bordure); color: var(--couleur-texte-faible); cursor: not-allowed; }

    /* ═══ Zone de destruction : à droite du paquet de cartes, dans la barre du bas ═══ */
    .battlogy-bottombar { position: relative; }
    .zone-destruction {
      position: absolute;
      right: .6rem;
      top: 50%;
      transform: translateY(-50%) scale(.8);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .15rem;
      width: 68px;
      height: 68px;
      background: #7f1d1dcc;
      color: #fecaca;
      border: 2px dashed #ef4444aa;
      border-radius: 16px;
      font-size: 1.3rem;
      font-weight: 700;
      z-index: 1999;
      pointer-events: none;
      opacity: 0;
      transition: opacity .15s, transform .15s;
    }
    .zone-destruction span { font-size: .58rem; letter-spacing: .01em; }
    .zone-destruction.visible { display: flex; opacity: 1; transform: translateY(-50%) scale(1); }
    .zone-destruction.survolee { background: #b91c1cee; color: #fff; transform: translateY(-50%) scale(1.1); }

    /* ═══ Modale d'édition du deck ═══ */
    .modale-fond {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      align-items: center;
      justify-content: center;
      z-index: 3000;
      padding: 1rem;
    }
    .modale-fond.ouverte { display: flex; }
    .modale-deck {
      background: var(--couleur-conteneur);
      border-radius: 14px;
      padding: 1.75rem;
      max-width: 480px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
    }
    .modale-deck h2 { font-size: 1.15rem; margin-bottom: .25rem; }
    .modale-deck-compteur { font-size: .85rem; color: var(--couleur-texte-faible); margin-bottom: 1.25rem; }
    .modale-fermer {
      position: absolute; top: .85rem; right: 1rem;
      background: none; border: none; font-size: 1.3rem;
      color: var(--couleur-texte-faible); cursor: pointer; line-height: 1;
    }
    .modale-fermer:hover { color: var(--couleur-texte); }
    .deck-liste { display: flex; flex-direction: column; gap: .6rem; }
    .deck-ligne {
      display: flex; align-items: center; gap: .75rem;
      background: var(--couleur-fond); border: 1px solid var(--couleur-bordure);
      border-radius: 10px; padding: .6rem .8rem;
    }
    .deck-ligne-verrouillee { opacity: .45; filter: grayscale(.6); }
    .deck-ligne .deck-emoji { font-size: 1.4rem; }
    .deck-ligne .deck-infos { flex: 1; }
    .deck-ligne .deck-nom { font-size: .88rem; font-weight: 700; }
    .deck-ligne .deck-cout { font-size: .72rem; color: var(--couleur-texte-faible); }
    .deck-stepper { display: flex; align-items: center; gap: .5rem; }
    .deck-stepper button {
      width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--couleur-bordure);
      background: var(--couleur-conteneur); color: var(--couleur-texte); font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; line-height: 1;
    }
    .deck-stepper button:disabled { opacity: .35; cursor: not-allowed; }
    .deck-stepper span { min-width: 1.2em; text-align: center; font-weight: 700; font-size: .9rem; }
    .modale-deck-actions { display: flex; gap: .6rem; margin-top: 1.5rem; }
    .modale-deck-actions .btn { flex: 1; }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <main>
    <div class="battlogy-wrap">
      <div class="battlogy-topbar">
        <h1>⚔️ Battlogy</h1>
        <span class="battlogy-timer" id="battlogy-timer" style="display:none"></span>
        <span class="battlogy-beta">BÊTA</span>
      </div>
      <div class="arena-outer" id="arena-outer">
        <canvas id="game-canvas"></canvas>
        <div class="arena-overlay" id="arena-overlay">
          <div class="arena-overlay-carte">
            <h2 id="overlay-titre">Battlogy</h2>
            <p id="overlay-texte">Pose tes unités pour détruire le château ennemi avant qu'il ne détruise le tien.</p>
            <div class="btn-group">
              <button class="btn btn-primary" id="btn-lancer">Lancer la partie</button>
              <button class="btn btn-secondary" id="btn-editer-deck">🃏 Éditer mon deck</button>
            </div>
          </div>
        </div>
      </div>
      <div class="battlogy-bottombar" id="battlogy-bottombar">
        <div class="pioche-jauge" id="pioche-jauge" title="Prochaine carte piochée">
          <div class="pioche-camembert" id="pioche-camembert"></div>
          <span class="pioche-icone">🃏</span>
        </div>
        <div class="or-jauge" id="or-jauge" title="Or / capacité max">
          <div class="or-jauge-remplissage" id="or-jauge-remplissage"></div>
          <span class="or-jauge-texte">🪙 <span id="or-affiche">0</span>/<span id="or-cap-affiche">3</span></span>
        </div>
        <div id="main-cartes"></div>
        <button class="btn-pioche-urgence" id="btn-pioche-urgence" style="display:none">⚡ Piocher (5)</button>
        <div class="zone-destruction" id="zone-destruction">🗑️<span>Défausser</span></div>
      </div>
    </div>
  </main>

  <div class="battlogy-message" id="battlogy-message"></div>

  <!-- ═══ Modale d'édition du deck ═══ -->
  <div class="modale-fond" id="modale-deck-fond" onclick="if(event.target===this) fermerModaleDeck()">
    <div class="modale-deck">
      <button class="modale-fermer" onclick="fermerModaleDeck()">✕</button>
      <h2>🃏 Éditer mon deck</h2>
      <div class="modale-deck-compteur"><span id="deck-compteur">0</span>/10 cartes</div>
      <div class="deck-liste" id="deck-liste"></div>
      <div class="modale-deck-actions">
        <button class="btn btn-secondary" id="btn-deck-reset">Réinitialiser</button>
        <button class="btn btn-primary" id="btn-deck-sauver">Enregistrer</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { chargerHeader, appliquerTheme } from '../script/header.js'
    import { db, garantirCartesDeDepart, chargerDeck, sauvegarderDeck } from '../script/battlogy.js'

    ;(async () => {
      if (!localStorage.getItem('username')) {
        window.location.href = 'connexion.html'
        return
      }
      document.body.style.setProperty('visibility', 'visible', 'important')
      appliquerTheme()
      await chargerHeader('../')

      const { data: session } = await db.auth.getUser()
      const userId = session?.user?.id ?? null

      // Rend la sauvegarde accessible au script de jeu (classique, pas
      // module) plus bas dans la page — voir sauvegarderCompositionDeck.
      window.BattlogyDB = { userId, sauvegarderDeck }

      if (userId) {
        const [cartes, deck] = await Promise.all([
          garantirCartesDeDepart(userId),
          chargerDeck(userId)
        ])
        window.appliquerDonneesBattlogy(cartes, deck)
      }

      await window.chargerImagesChateau()
      initArena()
    })()
  </script>

  <script>
  // ─── Constantes de jeu ───────────────────────────────────────
  const COLS        = 7
  const ROWS        = 20
  const CASTLE_PX   = 78    // hauteur en px de chaque zone château (barre de vie + image)
  const MARGE       = 8     // marge horizontale

  // Palette de couleurs de l'arène (indépendante du thème du site)
  const C = {
    bg:             '#0b160b',
    hexBase:        '#1f3d1f',
    hexBaseDark:    '#193319',
    hexBord:        '#142b14',
    hexEnemy:       '#3d1414',
    hexEnemyDark:   '#321010',
    hexPlayer:      '#14243d',
    hexPlayerDark:  '#101e32',
    zoneLine:       '#ffffff22',
    castleEStone:   '#7f1d1d',
    castleEStoneDk: '#6b1818',
    castlePStone:   '#1e3a8a',
    castlePStoneDk: '#172f70',
    castleMerlon:   '#9b2a2a',  // créneau ennemi
    castleMerlonP:  '#2563eb',  // créneau joueur
    stoneAccent:    '#4b5563',
    hp_bg:          '#374151',
    hp_enemy:       '#ef4444',
    hp_player:      '#22c55e',
    text:           '#f1f1f1',
    textSoft:       '#9ca3af',
    gateInner:      '#050d05',
  }

  let canvas, ctx
  let R   // hex circumradius
  let HS  // espacement horizontal entre colonnes (flat-top) = 1.5*R
  let VS  // espacement vertical entre rangées (flat-top) = sqrt(3)*R
  let gridOffsetY  // y où commence la grille
  let gridH        // hauteur réelle de la grille
  let zoneJoueurYMax  // limite basse (haut du château) de la grille jouable

  // ─── Cartes (données en dur, pour les tests) ──────────────────
  // porte en px, vitesseMarche en px/s, vitesseAttaque en attaques/seconde,
  // tempsActivation en ms, cout en or, nombre = nombre d'unités invoquées
  // par la carte (ex: 3 squelettes pour une seule carte). La portée de
  // détection n'est plus une valeur par carte : elle est calculée
  // dynamiquement (voir porteeDetectionEffective) à partir de la portée
  // d'attaque et de la largeur du plateau.
  // `taille` : multiplicateur appliqué au rayon de base d'une unité
  // (RAYON_UNITE_BASE, voir plus bas). Affecte à la fois le dessin (cercle,
  // police, barre de vie) ET la hit box utilisée pour le combat (la
  // portée d'attaque d'un adversaire est comparée à ce rayon). 1 = taille
  // normale ; les squelettes sont 2x plus petits (0.5).
  const CARTES = {
    guerrier: {
      id: 'guerrier', nom: 'Guerrier', emoji: '⚔️', cout: 1,
      pv: 100, degats: 10, porte: 34, vitesseAttaque: 1,
      vitesseMarche: 45, tempsActivation: 800, nombre: 1,
      taille: 1, typeAttaque: 'melee'
    },
    archer: {
      id: 'archer', nom: 'Archer', emoji: '🏹', cout: 2,
      pv: 55, degats: 12, porte: 120, vitesseAttaque: 0.9,
      vitesseMarche: 40, tempsActivation: 900, nombre: 1,
      taille: 1, typeAttaque: 'distance'
    },
    squelette: {
      id: 'squelette', nom: 'Squelettes', emoji: '💀', cout: 2,
      pv: 30, degats: 5, porte: 26, vitesseAttaque: 1.3,
      vitesseMarche: 55, tempsActivation: 500, nombre: 3,
      taille: 0.5, typeAttaque: 'melee'
    },
    magicien: {
      id: 'magicien', nom: 'Magicien', emoji: '🧙', cout: 5,
      pv: 50, degats: 30, porte: 110, vitesseAttaque: 0.8,
      vitesseMarche: 38, tempsActivation: 1000, nombre: 1,
      taille: 1, typeAttaque: 'distance',
      // Attaque à distance qui éclabousse : tout ennemi (et le château,
      // sans réduction — c'est une troupe, pas un sort) dans ce rayon
      // autour du point d'impact du projectile encaisse les dégâts, pas
      // seulement la cible visée (voir zoneAttaqueHex, converti en px à
      // la création de l'unité).
      zoneAttaque: true, zoneAttaqueHex: 1.3
    },
    golem: {
      id: 'golem', nom: 'Golem', emoji: '🪨', cout: 4,
      pv: 280, degats: 8, porte: 32, vitesseAttaque: 0.8,
      vitesseMarche: 22, tempsActivation: 1100, nombre: 1,
      taille: 1.3, typeAttaque: 'melee'
    },
    // Carte spéciale, catégorisée comme un "sort" (fait apparaître une
    // statue plutôt que de recruter une troupe classique). Contourne les
    // règles de placement (posable sur n'importe quel hexagone du terrain,
    // y compris en zone ennemie). Ne bouge jamais, n'attaque jamais : sa
    // seule fonction est d'encaisser les dégâts (voir `immobile` plus bas,
    // utilisé dans mettreAJourUnite). Reste considérée comme une unité
    // alliée pour tout le reste (ciblage ennemi, calcul de la zone de pose
    // des autres troupes, etc.).
    statue: {
      id: 'statue', nom: 'Statue', emoji: '🗿', cout: 3,
      categorie: 'sort', placementLibre: true, immobile: true,
      pv: 120, degats: 0, porte: 0, vitesseAttaque: 0,
      vitesseMarche: 0, tempsActivation: 0, nombre: 1,
      taille: 1
    },
    // ── Sorts à effet instantané ──────────────────────────────────
    // Contrairement à la Statue (aussi un "sort", mais qui fait apparaître
    // une unité), ceux-ci n'invoquent rien : `effetInstantane` déclenche
    // dans tenterPoserCarte un appel direct à lancerSortZone (dégâts +
    // éventuellement repoussée) au lieu de poserCarte. `placementLibre`
    // leur permet d'être lancés n'importe où sur le terrain, y compris en
    // zone ennemie. `degatsChateauMult` réduit les dégâts au château par
    // rapport aux dégâts infligés aux troupes (les sorts sont moins
    // efficaces contre un château qu'une troupe qui l'attaque directement).
    boule_de_feu: {
      id: 'boule_de_feu', nom: 'Boule de feu', emoji: '🔥', cout: 4,
      categorie: 'sort', placementLibre: true, effetInstantane: true,
      degats: 60, zoneHex: 2, degatsChateauMult: 0.4
    },
    bombe_a_eau: {
      id: 'bombe_a_eau', nom: 'Bombe à eau', emoji: '💧', cout: 2,
      categorie: 'sort', placementLibre: true, effetInstantane: true,
      degats: 15, zoneHex: 2, degatsChateauMult: 0.4,
      // Force (px) de la poussée appliquée aux unités touchées, dans l'axe
      // centre d'impact → unité (les repousse loin du point d'impact).
      repousse: 90
    }
  }

  // Rayon (en px) d'une unité de taille 1. Tous les rayons d'unité se
  // calculent en multipliant cette base par `taille`.
  const RAYON_UNITE_BASE = 14

  // ─── Deck / Main / Or : constantes de jeu ──────────────────────
  const DECK_TAILLE           = 10
  const MAIN_TAILLE_MAX       = 5
  const POIDS_DEPART          = 1
  const POIDS_MIN             = 0
  const POIDS_MAX             = 2.5
  const POIDS_BAISSE_TIRAGE   = 0.9   // appliqué à la carte tirée
  const POIDS_HAUSSE_AUTRES   = 0.1   // appliqué à toutes les autres cartes du deck
  const MULT_COUT_TROP_CHER   = 0.7   // malus de tirage si coût > capacité max d'or actuelle
  const MULT_INITIAL_PAS_CHER = 2     // bonus de tirage (main de départ uniquement) si coût <= 3
  const OR_CAPACITE_DEPART    = 3
  const OR_CAPACITE_MAX       = 12
  const PIOCHE_URGENCE_COUT   = 5
  const PIOCHE_URGENCE_NB     = 2

  const PIOCHE_INTERVALLE_PHASE1 = 8000  // ms, 1 carte / 8s
  const PIOCHE_INTERVALLE_PHASE2 = 4000  // ms, 1 carte / 4s (dès 1m30)
  const OR_INTERVALLE_PHASE1     = 1500  // ms, 1 or / 1.5s
  const OR_INTERVALLE_PHASE2     = 1000  // ms, 1 or / 1s (dès 1m30)
  const OR_INTERVALLE_PHASE3     = 500   // ms, 1 or / 0.5s (dès 3min)

  const PHASE_2_T          = 90000   // 1m30
  const PHASE_3_T          = 180000  // 3min
  const MORT_SUBITE_T      = 270000  // 4m30
  const MORT_SUBITE_TAUX   = 0.035   // % des PV max perdus / seconde, par château

  // Composition de base fournie par défaut tant que le joueur n'a pas
  // enregistré son propre deck en BDD (voir modale d'édition, et le
  // module script/battlogy.js pour le chargement/la sauvegarde).
  const DECK_PAR_DEFAUT = [
    'guerrier', 'guerrier',
    'archer', 'archer',
    'squelette',
    'magicien', 'golem',
    'statue',
    'boule_de_feu', 'bombe_a_eau'
  ]

  // ─── État de la partie ──────────────────────────────────────────
  let or = 0
  let orCapaciteMax = OR_CAPACITE_DEPART
  let deckSlots = []      // [{ carteId, poids }, ...] (10 emplacements, poids remis à 1 à chaque partie)
  let main = []           // [{ uid, carteId }, ...] jusqu'à 5 cartes
  let uidMainCompteur = 0
  let tempsDepuisGeneration = 0
  let tempsDepuisPioche = 0
  let tempsCombat = 0     // durée écoulée depuis le début du combat (indépendant de dernierTimestamp)
  let joueurChateauPV = 1000, joueurChateauPVMax = 1000
  let ennemiChateauPV = 1000, ennemiChateauPVMax = 1000
  let unitesJoueur = []
  let unitesEnnemi = []
  let uniteIdCompteur = 0
  let dernierTimestamp = null

  // Projectiles des attaquants à distance (flèches) : les dégâts ne sont
  // appliqués qu'à l'impact, pas au moment du tir. Effets de mêlée : simple
  // éclat visuel affiché brièvement au contact, sans délai (dégâts immédiats).
  let projectiles = []
  let effetsMelee = []
  // Éclat visuel des sorts à effet de zone (Boule de feu, Bombe à eau…) —
  // voir lancerSortZone / dessinerEffetsSort.
  let effetsSort = []
  const VITESSE_PROJECTILE = 340 // px/s

  // Apparition automatique d'un guerrier ennemi, pour les tests.
  const INTERVALLE_SPAWN_ENNEMI = 10000 // ms
  let tempsDepuisSpawnEnnemi = 0

  // Case survolée pendant le glisser d'une carte (mise en surbrillance).
  let hexSurvole = null

  // Cycle de vie de la partie : rien ne bouge tant que le joueur n'a pas
  // cliqué sur « Lancer la partie » ; tout s'arrête dès qu'un château tombe.
  let partieCommencee = false
  let partieTerminee = false

  // ─── Deck & cartes débloquées : chargement / sauvegarde (Supabase) ─────
  // Alimentés de façon asynchrone par le script module en haut de la page
  // (voir window.appliquerDonneesBattlogy) une fois la session utilisateur
  // et la BDD interrogées. En attendant que ça arrive (quelques centaines
  // de ms tout au plus), on part du principe que tout est débloqué — un
  // joueur ne peut de toute façon pas cliquer plus vite que ça.
  let cartesDebloquees = new Set(Object.keys(CARTES))
  let deckSauvegarde = null   // liste d'id sauvegardée en BDD, ou null si aucune (→ DECK_PAR_DEFAUT)

  window.appliquerDonneesBattlogy = function(cartes, deck) {
    if (cartes) cartesDebloquees = cartes
    deckSauvegarde = (Array.isArray(deck) && deck.length > 0) ? deck : null
  }

  function chargerCompositionDeck() {
    const source = deckSauvegarde ?? DECK_PAR_DEFAUT
    const filtree = source.filter(id => !!CARTES[id] && cartesDebloquees.has(id)).slice(0, DECK_TAILLE)
    return filtree.length > 0 ? filtree : DECK_PAR_DEFAUT.filter(id => cartesDebloquees.has(id)).slice(0, DECK_TAILLE)
  }

  function sauvegarderCompositionDeck(liste) {
    deckSauvegarde = liste
    if (window.BattlogyDB?.userId) {
      window.BattlogyDB.sauvegarderDeck(window.BattlogyDB.userId, liste)
    }
  }

  // ─── Tirage pondéré dans le deck ────────────────────────────────
  // `bonusPetitCout` : uniquement utilisé pour la main de départ (3
  // cartes), applique un bonus x2 aux cartes coûtant 3 or ou moins, en
  // plus (et indépendamment) du malus des cartes trop chères.
  function poidsEffectifDeck(bonusPetitCout) {
    return deckSlots.map(slot => {
      const carte = CARTES[slot.carteId]
      let p = Math.max(POIDS_MIN, slot.poids)
      if (carte.cout > orCapaciteMax) p *= MULT_COUT_TROP_CHER
      if (bonusPetitCout && carte.cout <= 3) p *= MULT_INITIAL_PAS_CHER
      return p
    })
  }

  function tirerCarteDuDeck(bonusPetitCout = false) {
    if (deckSlots.length === 0) return null
    const poids = poidsEffectifDeck(bonusPetitCout)
    const total = poids.reduce((a, b) => a + b, 0)
    let index
    if (total <= 0) {
      // Cas limite (tous les poids sont à 0) : tirage uniforme de secours.
      index = Math.floor(Math.random() * deckSlots.length)
    } else {
      let tirage = Math.random() * total
      index = deckSlots.length - 1
      for (let i = 0; i < deckSlots.length; i++) {
        tirage -= poids[i]
        if (tirage <= 0) { index = i; break }
      }
    }

    // Mise à jour des poids stockés : la carte tirée baisse, toutes les
    // autres remontent légèrement (bornées entre POIDS_MIN et POIDS_MAX).
    for (let i = 0; i < deckSlots.length; i++) {
      if (i === index) {
        deckSlots[i].poids = Math.max(POIDS_MIN, deckSlots[i].poids - POIDS_BAISSE_TIRAGE)
      } else {
        deckSlots[i].poids = Math.min(POIDS_MAX, deckSlots[i].poids + POIDS_HAUSSE_AUTRES)
      }
    }

    return deckSlots[index].carteId
  }

  // ─── Main : ajout / retrait ─────────────────────────────────────
  function ajouterCarteEnMain(carteId) {
    main.push({ uid: ++uidMainCompteur, carteId })
    renderMain()
  }

  // Pioche automatique (timer) : la capacité max d'or augmente à chaque
  // fois (que la carte tienne dans la main ou non), sauf si déjà au max.
  function piocherCarteAutomatique() {
    const carteId = tirerCarteDuDeck(false)
    if (!carteId) return
    if (main.length < MAIN_TAILLE_MAX) {
      ajouterCarteEnMain(carteId)
      animerCartePiochee(carteId, false)
    } else {
      afficherMessage('Main pleine — carte perdue.')
      animerCartePiochee(carteId, true)
    }
    orCapaciteMax = Math.min(OR_CAPACITE_MAX, orCapaciteMax + 1)
    renderMain()
  }

  function remplirMainInitiale() {
    main = []
    for (let i = 0; i < 3; i++) {
      const carteId = tirerCarteDuDeck(true)
      if (carteId) main.push({ uid: ++uidMainCompteur, carteId })
    }
  }

  // Pioche d'urgence : payante, ne touche ni au cooldown de pioche
  // normal ni à la capacité max d'or. Seulement possible main vide.
  function piocherUrgence() {
    if (main.length > 0) return
    if (or < PIOCHE_URGENCE_COUT) { afficherMessage("Pas assez d'or."); return }
    or -= PIOCHE_URGENCE_COUT
    for (let i = 0; i < PIOCHE_URGENCE_NB; i++) {
      const carteId = tirerCarteDuDeck(false)
      if (!carteId) continue
      if (main.length < MAIN_TAILLE_MAX) {
        ajouterCarteEnMain(carteId)
        animerCartePiochee(carteId, false)
      } else {
        animerCartePiochee(carteId, true)
      }
    }
    renderMain()
  }

  // ─── Phase de combat en cours (déduite du temps écoulé) ─────────
  function intervallePiocheActuel() {
    return tempsCombat < PHASE_2_T ? PIOCHE_INTERVALLE_PHASE1 : PIOCHE_INTERVALLE_PHASE2
  }
  function intervalleOrActuel() {
    if (tempsCombat < PHASE_2_T) return OR_INTERVALLE_PHASE1
    if (tempsCombat < PHASE_3_T) return OR_INTERVALLE_PHASE2
    return OR_INTERVALLE_PHASE3
  }
  function enMortSubite() {
    return tempsCombat >= MORT_SUBITE_T
  }

  function formaterCompteARebours(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000))
    const m = Math.floor(s / 60)
    const r = s % 60
    return m + ':' + String(r).padStart(2, '0')
  }

  function texteTimerPhase() {
    if (tempsCombat < PHASE_2_T)  return '⏱️ ' + formaterCompteARebours(PHASE_2_T - tempsCombat) + ' → Phase 2'
    if (tempsCombat < PHASE_3_T)  return '⏱️ ' + formaterCompteARebours(PHASE_3_T - tempsCombat) + ' → Phase 3'
    if (tempsCombat < MORT_SUBITE_T) return '⏱️ ' + formaterCompteARebours(MORT_SUBITE_T - tempsCombat) + ' → Mort subite'
    return '💀 Mort subite !'
  }

  function actualiserAffichageTimer() {
    const el = document.getElementById('battlogy-timer')
    if (!partieCommencee || partieTerminee) { el.style.display = 'none'; return }
    el.style.display = 'inline-block'
    el.textContent = texteTimerPhase()
    el.classList.toggle('mort-subite', enMortSubite())
  }

  // ─── Rendu de la barre du bas (or + main + pioche d'urgence) ────
  function renderMain() {
    document.getElementById('or-affiche').textContent = or
    document.getElementById('or-cap-affiche').textContent = orCapaciteMax
    document.getElementById('or-jauge-remplissage').style.width =
      Math.min(100, (or / orCapaciteMax) * 100) + '%'

    const conteneur = document.getElementById('main-cartes')
    conteneur.innerHTML = main.map((item, i) => {
      const carte = CARTES[item.carteId]
      const touche = TOUCHES_CARTES_LABEL[i] || ''
      const tropCher = or < carte.cout
      return `
        <div class="carte-main${(!partieCommencee || partieTerminee) ? ' indisponible' : ''}${tropCher ? ' cout-eleve' : ''}" data-uid="${item.uid}">
          <span class="carte-touche">${touche}</span>
          <span class="carte-emoji">${carte.emoji}</span>
          <span class="carte-nom">${carte.nom}</span>
          <span class="carte-cout">${carte.cout}</span>
        </div>`
    }).join('')
    initGlisserDeposer()

    const btnUrgence = document.getElementById('btn-pioche-urgence')
    if (partieCommencee && !partieTerminee && main.length === 0) {
      btnUrgence.style.display = 'inline-block'
      btnUrgence.disabled = or < PIOCHE_URGENCE_COUT
    } else {
      btnUrgence.style.display = 'none'
    }
  }

  // ─── Images des châteaux ───────────────────────────────────────
  const imgCastleEnemi  = new Image()
  const imgCastleJoueur = new Image()
  function chargerImagesChateau() {
    return Promise.all([
      new Promise(res => { imgCastleEnemi.onload = res; imgCastleEnemi.onerror = res; imgCastleEnemi.src  = '../pictures/castred.png' }),
      new Promise(res => { imgCastleJoueur.onload = res; imgCastleJoueur.onerror = res; imgCastleJoueur.src = '../pictures/castblue.png' })
    ])
  }
  window.chargerImagesChateau = chargerImagesChateau

  // ─── Initialisation ──────────────────────────────────────────
  // Les colonnes paires ont une rangée de plus (ROWS+1) que les colonnes
  // impaires (ROWS) : la grille commence ET finit par une ligne pleine,
  // symétrique en haut et en bas.
  function initArena() {
    canvas = document.getElementById('game-canvas')
    const outer = document.getElementById('arena-outer')

    const availW = outer.clientWidth  || 380
    const availH = outer.clientHeight || 480

    // Échelle précédente (avant recalcul) : sert plus bas à repositionner
    // les entités déjà sur le terrain, voir le commentaire après le calcul
    // de canvas.width/height.
    const ancienR = R

    // R limité par la largeur disponible
    const Rw = (availW - 2 * MARGE) / (1.5 * COLS + 0.5)
    // R limité par la hauteur disponible (2 châteaux + grille, colonnes
    // pleines = ROWS+1 rangées)
    const Rh = (availH - 2 * CASTLE_PX - 12) / ((ROWS + 1) * Math.sqrt(3))

    R  = Math.max(6, Math.min(Rw, Rh))
    HS = R * 1.5           // espacement horizontal entre centres de colonnes
    VS = R * Math.sqrt(3)  // espacement vertical entre centres de rangées

    gridOffsetY = CASTLE_PX + 6

    gridH        = (ROWS + 1) * VS                       // hauteur réelle de la grille
    const gridW  = (1.5 * COLS + 0.5) * R + 2 * MARGE     // largeur réelle de la grille

    canvas.width  = Math.round(gridW)
    canvas.height = Math.round(gridOffsetY + gridH + 6 + CASTLE_PX)

    // Limite basse de la grille jouable = juste avant le château joueur.
    // La zone de pose réelle est désormais calculée dynamiquement,
    // voir calculerZonePose().
    zoneJoueurYMax = canvas.height - CASTLE_PX

    ctx = canvas.getContext('2d')

    // ─── Anti-téléportation ────────────────────────────────────
    // initArena() est réexécutée à chaque 'resize' (fenêtre redimensionnée,
    // rotation d'écran… et aussi zoom du navigateur, qui déclenche lui
    // aussi un 'resize'). Comme R (et donc HS/VS, la taille des hexagones)
    // change, la grille entière change d'échelle — mais les entités déjà
    // sur le terrain (unités, projectiles, éclats visuels) gardaient
    // jusqu'ici leurs anciennes coordonnées en pixels, ce qui les faisait
    // apparaître "téléportées" ailleurs sur le terrain dès qu'on dézoomait.
    // La grille reste toujours ancrée au même point (MARGE, gridOffsetY) et
    // ne fait que changer d'échelle avec R : on repositionne donc chaque
    // entité proportionnellement à ce changement d'échelle pour qu'elle
    // reste exactement à la même place relative sur le terrain, quel que
    // soit l'état (zoom, taille de fenêtre) de la page.
    if (ancienR && ancienR !== R) {
      const echelle = R / ancienR
      const reechelonner = (obj) => {
        obj.x = MARGE + (obj.x - MARGE) * echelle
        obj.y = gridOffsetY + (obj.y - gridOffsetY) * echelle
      }
      for (const u of unitesJoueur) { reechelonner(u); if (u.zoneAttaque) u.zoneAttaquePx *= echelle }
      for (const u of unitesEnnemi) { reechelonner(u); if (u.zoneAttaque) u.zoneAttaquePx *= echelle }
      for (const p of projectiles) {
        reechelonner(p)
        p.cibleXFixe = MARGE + (p.cibleXFixe - MARGE) * echelle
        p.cibleYFixe = gridOffsetY + (p.cibleYFixe - gridOffsetY) * echelle
        if (p.zoneAttaque) p.zoneAttaquePx *= echelle
      }
      for (const e of effetsMelee) reechelonner(e)
      for (const e of effetsSort) { reechelonner(e); e.rayon *= echelle }
    }

    if (!dernierTimestamp) requestAnimationFrame(boucleDeJeu)
  }

  // ─── Conversion coordonnées hexa → pixels ────────────────────
  function hexCenter(row, col) {
    const x = MARGE + R + col * HS
    const y = gridOffsetY + VS / 2 + row * VS + (col % 2 === 1 ? VS / 2 : 0)
    return { x, y }
  }

  // ─── Trouve l'hexagone le plus proche d'un point (x,y) en pixels ──
  // Cherche dans une petite fenêtre de colonnes/rangées autour d'une
  // estimation, puis garde le centre d'hexagone le plus proche. Retourne
  // null si aucun hexagone n'est assez proche (curseur hors grille).
  // `seuilDistance` est paramétrable : par défaut R*1.15 (le point doit
  // tomber quasiment pile sur la case), mais trouverHexPourPose() passe un
  // seuil plus généreux pour "rattraper" une pose imprécise proche du bord
  // de la grille (voir plus bas).
  function trouverHexProche(x, y, seuilDistance = R * 1.15) {
    const colEstime = Math.round((x - MARGE - R) / HS)
    let meilleur = null, meilleureDist = Infinity
    for (let c = Math.max(0, colEstime - 2); c <= Math.min(COLS - 1, colEstime + 2); c++) {
      const maxRow = (c % 2 === 0) ? ROWS : ROWS - 1
      const decalage = (c % 2 === 1) ? VS / 2 : 0
      const rowEstime = Math.round((y - gridOffsetY - VS / 2 - decalage) / VS)
      for (let r = Math.max(0, rowEstime - 2); r <= Math.min(maxRow, rowEstime + 2); r++) {
        const { x: cx, y: cy } = hexCenter(r, c)
        const d = Math.hypot(cx - x, cy - y)
        if (d < meilleureDist) { meilleureDist = d; meilleur = { row: r, col: c, cx, cy } }
      }
    }
    if (!meilleur || meilleureDist > seuilDistance) return null
    return meilleur
  }

  // ─── Règles de placement dynamiques (les deux camps y sont soumis) ────
  // 1. Aucune unité alliée sur le terrain → on ne peut poser que sur les
  //    cases qui collent notre château (deux rangées de profondeur).
  // 2. Une unité alliée est présente → on peut poser sur toute case entre
  //    notre château et cette unité (la plus avancée, si plusieurs).
  // 3. Un ennemi s'est infiltré entre notre château et notre unité la plus
  //    avancée → la zone de pose se referme jusqu'à lui : on ne peut plus
  //    poser qu'entre cet ennemi et notre château.
  // 4. Dans tous les cas (même règle 2/3) : jamais dans la moitié ennemie
  //    du terrain — sauf capacité spéciale (carte.placementLibre, ex: la
  //    statue, qui contourne toutes ces règles).
  //
  // Tout est exprimé en coordonnées y (pixels) : y petit = proche du
  // château ennemi (haut), y grand = proche du château joueur (bas).
  // `team` = camp pour lequel on calcule la zone ('joueur' ou 'ennemi') :
  // le bot ennemi est soumis exactement aux mêmes règles, en miroir.
  function calculerZonePose(team = 'joueur') {
    const profondeurZoneDepart = 2 * VS   // zone de départ : 2 rangées (allongée d'une ligne)

    if (team === 'joueur') {
      const limiteMoitieEnnemie = gridOffsetY + 8 * VS   // jamais au-delà (règle 4)

      // Par défaut (aucun allié) : les 2 rangées qui collent le château.
      let yMin = zoneJoueurYMax - profondeurZoneDepart

      const alliesVivants = unitesJoueur.filter(u => u.pv > 0)
      if (alliesVivants.length > 0) {
        // L'allié le plus avancé (le plus petit y) repousse la limite.
        yMin = Math.min(...alliesVivants.map(u => u.y))
      }

      // Un ennemi ayant percé entre notre château et notre allié le plus
      // avancé referme la zone jusqu'à lui — mais pas exactement à son
      // niveau : la zone s'arrête 1.5 hexagone devant lui (vers notre
      // château), pour que nos unités posées le croisent naturellement en
      // marchant au lieu d'apparaître déjà à son contact.
      const ennemisEnPercee = unitesEnnemi.filter(u => u.pv > 0 && u.y > yMin && u.y < zoneJoueurYMax)
      if (ennemisEnPercee.length > 0) {
        yMin = Math.max(yMin, Math.max(...ennemisEnPercee.map(u => u.y)) + 1.5 * VS)
      }

      // La zone de base (les 2 rangées qui collent notre château) ne peut
      // jamais être réduite, même si un ennemi s'y trouve : on peut
      // toujours y poser des unités.
      yMin = Math.min(yMin, zoneJoueurYMax - profondeurZoneDepart)

      // Règle générale : jamais dans la moitié ennemie.
      yMin = Math.max(yMin, limiteMoitieEnnemie)

      return { yMin, yMax: zoneJoueurYMax }
    }

    // team === 'ennemi' : symétrique, le château ennemi est en haut (y petit).
    const limiteMoitieJoueur = zoneJoueurYMax - 8 * VS   // jamais au-delà (règle 4)
    const yContreChateauEnnemi = gridOffsetY

    // Par défaut (aucun allié) : les 2 rangées qui collent le château.
    let yMax = yContreChateauEnnemi + profondeurZoneDepart

    const alliesVivants = unitesEnnemi.filter(u => u.pv > 0)
    if (alliesVivants.length > 0) {
      // L'allié le plus avancé (le plus grand y, càd le plus proche de nous) repousse la limite.
      yMax = Math.max(...alliesVivants.map(u => u.y))
    }

    // Un joueur ayant percé entre le château ennemi et son allié le plus
    // avancé referme la zone jusqu'à lui — mais pas exactement à son
    // niveau : la zone s'arrête 1.5 hexagone devant lui (vers le château
    // ennemi), symétrique à la règle du camp joueur.
    const joueursEnPercee = unitesJoueur.filter(u => u.pv > 0 && u.y < yMax && u.y > yContreChateauEnnemi)
    if (joueursEnPercee.length > 0) {
      yMax = Math.min(yMax, Math.min(...joueursEnPercee.map(u => u.y)) - 1.5 * VS)
    }

    // La zone de base (les 2 rangées qui collent le château ennemi) ne
    // peut jamais être réduite, même si un joueur s'y trouve.
    yMax = Math.max(yMax, yContreChateauEnnemi + profondeurZoneDepart)

    // Règle générale : jamais dans la moitié joueur.
    yMax = Math.min(yMax, limiteMoitieJoueur)

    return { yMin: yContreChateauEnnemi, yMax }
  }

  // Fraction (0..1) de l'aire d'un hexagone flat-top (centré en cy, de
  // rayon r) comprise entre yMinZone et yMaxZone. Utilisé pour n'autoriser
  // la pose que sur des hexagones majoritairement inclus dans la zone
  // valide (voir SEUIL_HEX_DANS_ZONE) — un simple débordement du centre ne
  // suffit plus.
  function fractionHexDansZone(cy, r, yMinZone, yMaxZone) {
    const h = r * Math.sqrt(3) / 2   // demi-hauteur de l'hexagone (flat-top)
    const N = 40
    let aireTotale = 0, aireDansZone = 0
    for (let i = 0; i < N; i++) {
      const t = (i + 0.5) / N
      const yLocal = -h + t * (2 * h)
      const largeur = 2 * r - (r / h) * Math.abs(yLocal)
      const yAbs = cy + yLocal
      aireTotale += largeur
      if (yAbs >= yMinZone && yAbs <= yMaxZone) aireDansZone += largeur
    }
    return aireTotale > 0 ? aireDansZone / aireTotale : 0
  }

  // Un hexagone doit désormais être au moins 80% inclus dans la zone de
  // pose pour être considéré posable (plus de simple débordement partiel).
  const SEUIL_HEX_DANS_ZONE = 0.8

  // Un hexagone est-il posable pour cette carte et ce camp, compte tenu des
  // règles ci-dessus (ou de placementLibre pour les cartes qui les contournent) ?
  function estPositionValidePourPose(carteId, hex, team = 'joueur') {
    if (!hex) return false
    const carte = CARTES[carteId]
    if (!carte) return false
    if (carte.placementLibre) return true
    const { yMin, yMax } = calculerZonePose(team)
    return fractionHexDansZone(hex.cy, R, yMin, yMax) >= SEUIL_HEX_DANS_ZONE
  }

  // Toutes les positions (centres d'hexagones) actuellement valides pour la
  // pose d'une carte "normale" (non placementLibre) du camp donné. Utilisé
  // par le bot ennemi pour choisir où poser ses troupes.
  function positionsValidesPourEquipe(team) {
    const { yMin, yMax } = calculerZonePose(team)
    const positions = []
    for (let c = 0; c < COLS; c++) {
      const rowsCol = (c % 2 === 0) ? ROWS + 1 : ROWS
      for (let r = 0; r < rowsCol; r++) {
        const { x, y } = hexCenter(r, c)
        if (fractionHexDansZone(y, R, yMin, yMax) >= SEUIL_HEX_DANS_ZONE) positions.push({ x, y })
      }
    }
    return positions
  }

  // Distance maximale (en pixels canvas) au-delà de laquelle une pose hors
  // zone n'est plus "rattrapée" par la case valide la plus proche : au-delà,
  // l'utilisateur visait clairement autre chose et la pose est simplement
  // refusée comme avant.
  function distanceRattrapageMax() {
    return R * 3
  }

  // Détermine la case à utiliser pour poser `carteId` (camp `team`) à partir
  // d'un point (x, y) en pixels canvas — qui peut être légèrement hors de la
  // grille, ou tomber sur une case en dehors de la zone de pose autorisée.
  // Pour faciliter le placement (au doigt comme à la souris, sans devoir
  // viser une case exacte) :
  //  1. Si la case la plus proche du point est déjà valide, on la garde.
  //  2. Sinon, on rattrape la pose sur la case VALIDE la plus proche du
  //     point, à condition qu'elle reste raisonnablement proche.
  // Retourne null si rien d'assez proche n'est disponible.
  function trouverHexPourPose(carteId, x, y, team = 'joueur') {
    if (x === null || x === undefined || y === null || y === undefined) return null
    const carte = CARTES[carteId]
    if (!carte) return null

    const seuil = distanceRattrapageMax()

    // Carte à placement libre (statue…) : toute la grille est valide, on se
    // contente d'élargir un peu le seuil de recherche de la case la plus
    // proche.
    if (carte.placementLibre) return trouverHexProche(x, y, seuil)

    const direct = trouverHexProche(x, y, seuil)
    if (direct && estPositionValidePourPose(carteId, direct, team)) return direct

    let meilleur = null, meilleureDist = Infinity
    for (const p of positionsValidesPourEquipe(team)) {
      const d = Math.hypot(p.x - x, p.y - y)
      if (d < meilleureDist) { meilleureDist = d; meilleur = p }
    }
    if (!meilleur || meilleureDist > seuil) return null
    return { cx: meilleur.x, cy: meilleur.y }
  }

  // ─── Dessin d'un hexagone (flat-top, càd pointy-top tourné de 90°) ──
  function drawHex(cx, cy, r, fill, stroke, largeurTrait) {
    ctx.beginPath()
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 180 * (60 * i)
      const px = cx + r * Math.cos(a)
      const py = cy + r * Math.sin(a)
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py)
    }
    ctx.closePath()
    ctx.fillStyle = fill
    ctx.fill()
    if (stroke) {
      ctx.strokeStyle = stroke
      ctx.lineWidth = largeurTrait || 1
      ctx.stroke()
    }
  }

  // ─── Couleur d'un hex selon sa zone ──────────────────────────
  // maxRow : dernière rangée existante pour cette colonne (ROWS pour les
  // colonnes paires qui ont une rangée de plus, ROWS-1 pour les impaires).
  function couleurHex(row, col) {
    const dark = (row + col) % 2 === 0
    const maxRow = (col % 2 === 0) ? ROWS : ROWS - 1
    if (row <= 7)            return dark ? C.hexEnemyDark  : C.hexEnemy
    if (row >= maxRow - 7)   return dark ? C.hexPlayerDark : C.hexPlayer
    return dark ? C.hexBaseDark : C.hexBase
  }

  // ─── Grille hexagonale ────────────────────────────────────────
  // Colonnes paires : ROWS+1 rangées (0..ROWS) → ligne pleine en haut ET en bas.
  // Colonnes impaires : ROWS rangées (0..ROWS-1), décalées d'une demi-hauteur.
  function drawGrid() {
    for (let c = 0; c < COLS; c++) {
      const rowsCol = (c % 2 === 0) ? ROWS + 1 : ROWS
      for (let r = 0; r < rowsCol; r++) {
        const { x, y } = hexCenter(r, c)
        drawHex(x, y, R - 1.2, couleurHex(r, c), C.hexBord)
      }
    }

    // Lignes de zone en pointillés (en y, pour rester alignées malgré le
    // décalage entre colonnes paires/impaires)
    ctx.setLineDash([6, 4])
    ctx.lineWidth = 1.5

    drawZoneLine(gridOffsetY + 8 * VS,                     '#ef444455') // limite zone ennemi
    drawZoneLine(gridOffsetY + (ROWS + 1) * VS - 8 * VS,   '#3b82f655') // limite zone joueur
    ctx.setLineDash([])
  }

  function drawZoneLine(y, color) {
    ctx.strokeStyle = color
    ctx.beginPath()
    ctx.moveTo(MARGE, y)
    ctx.lineTo(canvas.width - MARGE, y)
    ctx.stroke()
  }

  // ─── Château ─────────────────────────────────────────────────
  function drawCastle(isPlayer) {
    const W = canvas.width - 2 * MARGE
    const x = MARGE
    const BAR_H = 6   // hauteur de la barre de vie
    const GAP   = 4   // petit espace entre la barre et l'image

    // ── Barre de PV : collée directement au bord de l'arène ──
    // (tout en haut pour l'ennemi, tout en bas pour le joueur)
    const hpBarY = isPlayer ? canvas.height - BAR_H : 0
    const pvFrac = isPlayer
      ? Math.max(0, joueurChateauPV / joueurChateauPVMax)
      : Math.max(0, ennemiChateauPV / ennemiChateauPVMax)
    ctx.fillStyle = C.hp_bg
    rect(0, hpBarY, canvas.width, BAR_H)
    ctx.fillStyle = isPlayer ? C.hp_player : C.hp_enemy
    rect(0, hpBarY, canvas.width * pvFrac, BAR_H)

    // ── Image du château : juste derrière la barre, occupe le reste de la
    // zone jusqu'à la grille (plus d'espace vide entre le bord et la barre).
    const imgH = CASTLE_PX - BAR_H - GAP
    const imgY = isPlayer ? canvas.height - CASTLE_PX : BAR_H + GAP
    const img  = isPlayer ? imgCastleJoueur : imgCastleEnemi
    if (img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, x, imgY, W, imgH)
    }
  }

  // ─── Point de cible du château (utilisé pour la marche et l'attaque) ──
  function pointCastle(team) {
    // team = camp qui VISE ce château (ex: 'joueur' vise le château ennemi)
    return team === 'joueur'
      ? { x: canvas.width / 2, y: CASTLE_PX * 0.5 }
      : { x: canvas.width / 2, y: canvas.height - CASTLE_PX * 0.5 }
  }

  // ─── Unités ─────────────────────────────────────────────────
  function poserCarte(carte, x, y, team) {
    const n = carte.nombre || 1
    for (let i = 0; i < n; i++) {
      const decalage = (i - (n - 1) / 2) * 20
      creerUnite(carte, x + decalage, y, team)
    }
  }

  // ─── Sorts à effet instantané (Boule de feu, Bombe à eau…) ────
  // Contrairement à poserCarte, n'invoque aucune unité : applique tout de
  // suite les dégâts (et l'éventuelle repoussée) sur la zone visée, puis
  // ajoute un éclat visuel (voir effetsSort / dessinerEffetsSort).
  function lancerSortZone(carte, x, y, team) {
    const rayonPx = carte.zoneHex * VS
    appliquerDegatsZone(x, y, rayonPx, team, carte.degats, {
      multChateau: carte.degatsChateauMult ?? 1,
      repousse: carte.repousse || 0
    })
    effetsSort.push({
      x, y, rayon: rayonPx,
      couleur: carte.repousse ? '#38bdf8' : '#f97316',
      dureeRestante: 260, dureeTotale: 260
    })
  }

  // Pool des troupes que le bot ennemi peut faire apparaître (les sorts à
  // effet instantané et la Statue en sont exclus : le bot ne "pose" que des
  // unités de terrain classiques). Le guerrier apparaît deux fois pour
  // rester la troupe la plus fréquente, comme avant l'ajout des autres.
  const POOL_SPAWN_ENNEMI = ['guerrier', 'guerrier', 'archer', 'squelette', 'golem', 'magicien']

  // Fait apparaître une troupe ennemie aléatoire (voir POOL_SPAWN_ENNEMI),
  // en respectant les mêmes règles de placement que le joueur (voir
  // calculerZonePose) : parmi les cases actuellement valides pour le camp
  // ennemi, on en choisit une au hasard. Si elle tombe sur une unité déjà
  // présente, la collision physique (voir resoudreCollisions) les écarte
  // automatiquement l'une de l'autre.
  function spawnEnnemiAleatoire() {
    const positions = positionsValidesPourEquipe('ennemi')
    if (positions.length === 0) return
    const pos = positions[Math.floor(Math.random() * positions.length)]
    const carteId = POOL_SPAWN_ENNEMI[Math.floor(Math.random() * POOL_SPAWN_ENNEMI.length)]
    poserCarte(CARTES[carteId], pos.x, pos.y, 'ennemi')
  }

  function creerUnite(carte, x, y, team) {
    const cible = pointCastle(team)
    const unite = {
      id: ++uniteIdCompteur,
      carteId: carte.id,
      emoji: carte.emoji,
      team,
      x, y,
      pv: carte.pv, pvMax: carte.pv,
      degats: carte.degats,
      porte: carte.porte,
      taille: carte.taille || 1,
      typeAttaque: carte.typeAttaque || 'melee',
      // Attaque à distance avec éclaboussure (ex: le Magicien) : tout
      // ennemi dans ce rayon (px, converti depuis zoneAttaqueHex — voir
      // CARTES) autour du point d'impact du projectile est touché, pas
      // seulement la cible visée (voir mettreAJourProjectiles).
      zoneAttaque: !!carte.zoneAttaque,
      zoneAttaquePx: carte.zoneAttaque ? carte.zoneAttaqueHex * VS : 0,
      vitesseMarche: carte.vitesseMarche,
      cooldownAttaqueBase: 1000 / (carte.vitesseAttaque || 1),
      cooldownAttaque: 0,
      activation: carte.tempsActivation,
      // Direction de marche "par défaut" (tant qu'aucune cible n'est
      // détectée) : purement verticale, vers le château adverse — jamais
      // en diagonale, même si l'unité est posée décalée par rapport au
      // centre du château (voir mettreAJourUnite).
      dirX: 0, dirY: cible.y >= y ? 1 : -1,
      // Une unité immobile (ex: la statue) ne passe jamais par l'état
      // d'activation/marche/attaque : elle reste plantée, encaisse les
      // dégâts, un point c'est tout (voir mettreAJourUnite).
      immobile: !!carte.immobile,
      etat: carte.immobile ? 'immobile' : 'activation'
    }
    ;(team === 'joueur' ? unitesJoueur : unitesEnnemi).push(unite)
  }

  // Rayon effectif (hit box) d'une unité, selon sa taille.
  function rayonUnite(unite) {
    return RAYON_UNITE_BASE * (unite.taille || 1)
  }

  // ─── Collisions entre unités ───────────────────────────────────────
  // Remplace l'ancien système qui empêchait purement et simplement la POSE
  // d'une unité trop proche d'une autre : on peut désormais toujours poser
  // où on veut, y compris pile sur une unité existante (alliée ou
  // ennemie). Les deux unités se comportent alors comme des cercles
  // physiques qui ne peuvent pas se chevaucher de plus de
  // CHEVAUCHEMENT_MAX (10 %) du plus grand des deux diamètres — au-delà,
  // elles se repoussent l'une l'autre à chaque frame jusqu'à respecter
  // cette limite.
  const CHEVAUCHEMENT_MAX = 0.10

  // Résistance (avant/arrière uniquement) d'une unité en plein combat : une
  // unité qui combat (état 'attaque') résiste fortement à être poussée
  // dans son propre axe de marche (ce qui l'empêcherait d'être avancée de
  // force dans le château, ou reculée hors de son combat) — mais PAS à
  // être poussée sur le côté. Le déplacement latéral, lui, passe à pleine
  // puissance, quel que soit l'état : c'est ce qui permet à d'autres
  // unités de facilement écarter une unité engagée (ex: deux archers côte
  // à côte) pour se faufiler entre elles, au lieu de rester bloquées.
  const RESISTANCE_AVANCEE_COMBAT = 5

  // Atténue uniquement la composante d'un déplacement (dx,dy) qui va dans
  // l'axe de marche de l'unité (unite.dirX/dirY) — la composante latérale
  // (perpendiculaire à cet axe) est renvoyée intacte.
  function attenuerAxeMarche(unite, dx, dy, resistance) {
    const long = dx * unite.dirX + dy * unite.dirY
    const latX = dx - long * unite.dirX
    const latY = dy - long * unite.dirY
    return {
      x: latX + (long * unite.dirX) / resistance,
      y: latY + (long * unite.dirY) / resistance
    }
  }

  // Écarte deux unités qui se chevauchent trop, le long de la droite qui
  // relie leurs centres. `bFixe` : b ne bouge jamais (obstacle immobile,
  // ex: la statue) — seule a est repoussée, de tout le chevauchement.
  function separerPaire(a, b, bFixe = false) {
    const ra = rayonUnite(a), rb = rayonUnite(b)
    const distMin = ra + rb - CHEVAUCHEMENT_MAX * 2 * Math.max(ra, rb)

    let dx = b.x - a.x, dy = b.y - a.y
    let d = Math.hypot(dx, dy)

    if (d === 0) {
      // Pile superposées (unité qui vient d'apparaître exactement sur une
      // autre) : direction arbitraire pour amorcer la séparation.
      const angle = Math.random() * Math.PI * 2
      dx = Math.cos(angle); dy = Math.sin(angle); d = 1
    }

    if (d >= distMin) return

    const chevauchement = distMin - d
    const ux = dx / d, uy = dy / d

    if (bFixe) {
      a.x -= ux * chevauchement
      a.y -= uy * chevauchement
    } else {
      // Partage 50/50 de base, comme avant — mais si l'une des deux
      // unités combat, sa part de déplacement est filtrée : seule sa
      // composante avant/arrière est freinée, la composante latérale
      // reste pleine (voir attenuerAxeMarche).
      let dA = { x: -ux * chevauchement / 2, y: -uy * chevauchement / 2 }
      let dB = { x:  ux * chevauchement / 2, y:  uy * chevauchement / 2 }

      if (a.etat === 'attaque') dA = attenuerAxeMarche(a, dA.x, dA.y, RESISTANCE_AVANCEE_COMBAT)
      if (b.etat === 'attaque') dB = attenuerAxeMarche(b, dB.x, dB.y, RESISTANCE_AVANCEE_COMBAT)

      a.x += dA.x; a.y += dA.y
      b.x += dB.x; b.y += dB.y
    }
  }


  // Résout toutes les collisions du terrain (tout camp confondu) pour la
  // frame courante. Les unités immobiles (statue) font obstacle mais ne
  // sont jamais elles-mêmes déplacées par une collision.
  function resoudreCollisions() {
    const toutesVivantes = unitesJoueur.concat(unitesEnnemi).filter(u => u.pv > 0)
    const mobiles    = toutesVivantes.filter(u => !u.immobile)
    const immobiles  = toutesVivantes.filter(u => u.immobile)

    for (let i = 0; i < mobiles.length; i++) {
      for (let j = i + 1; j < mobiles.length; j++) {
        separerPaire(mobiles[i], mobiles[j])
      }
    }
    for (const m of mobiles) {
      for (const fixe of immobiles) {
        separerPaire(m, fixe, true)
      }
    }

    // ─── Protection des bords de l'arène et des châteaux ───────────
    // Un château se comporte comme un vrai mur pour toute unité (qu'elle
    // soit en train de marcher, ou simplement poussée par une autre) : ni
    // le sien, ni celui de l'adversaire, ne peuvent être traversés — comme
    // pour les bords gauche/droite de l'arène. Position toujours replacée
    // juste à l'intérieur de la zone jouable si jamais elle en était sortie.
    for (const m of mobiles) {
      const r = rayonUnite(m)
      const limiteGauche = MARGE + r
      const limiteDroite = canvas.width - MARGE - r
      const limiteHaute  = CASTLE_PX + r                 // mur du château ennemi (haut)
      const limiteBasse  = canvas.height - CASTLE_PX - r // mur du château joueur (bas)
      if (m.x < limiteGauche) m.x = limiteGauche
      if (m.x > limiteDroite) m.x = limiteDroite
      if (m.y < limiteHaute) m.y = limiteHaute
      if (m.y > limiteBasse) m.y = limiteBasse
    }
  }

  // Facteur minimal appliqué à la portée d'attaque pour obtenir la portée
  // de détection : une unité doit toujours détecter légèrement plus loin
  // qu'elle n'attaque, jamais l'inverse (sinon elle attaquerait des cibles
  // qu'elle n'a jamais "vues" venir).
  const FACTEUR_DETECTION_MIN_PORTE = 1.15

  // Portée de détection effective d'une unité : au minimum un peu plus loin
  // que sa portée d'attaque (FACTEUR_DETECTION_MIN_PORTE), et au minimum
  // égale à la largeur du plateau — pour qu'un ennemi qui arrive à son
  // niveau, même à l'autre bout du terrain, ne puisse jamais rester
  // invisible. La statue (immobile) ne détecte jamais rien : elle ne
  // marche ni n'attaque.
  function porteeDetectionEffective(unite) {
    if (unite.immobile) return 0
    return Math.max(unite.porte * FACTEUR_DETECTION_MIN_PORTE, canvas.width)
  }

  // Une cible (unité ou point de château) est "détectée" si elle est à
  // l'intérieur du rayon de détection ET pas franchement derrière l'unité
  // (demi-cercle tourné vers l'avant, avec une petite tolérance pour
  // considérer une cible "à son niveau" comme détectée même si elle est
  // très légèrement en retrait). Impossible de détecter — ni d'être
  // détecté par — quelqu'un strictement dans son dos.
  function estDetectable(unite, cibleX, cibleY) {
    const dx = cibleX - unite.x, dy = cibleY - unite.y
    const projection = dx * unite.dirX + dy * unite.dirY   // devant = positif
    const margeNiveau = VS * 0.5
    if (projection < -margeNiveau) return false            // franchement derrière : ignoré
    return Math.hypot(dx, dy) <= porteeDetectionEffective(unite)
  }

  // Cherche, parmi le camp adverse, l'ennemi vivant le plus proche détecté
  // (voir estDetectable).
  function ennemiLePlusProche(unite) {
    const adversaires = unite.team === 'joueur' ? unitesEnnemi : unitesJoueur
    let meilleur = null, meilleureDist = Infinity
    for (const a of adversaires) {
      if (a.pv <= 0) continue
      if (!estDetectable(unite, a.x, a.y)) continue
      const d = Math.hypot(a.x - unite.x, a.y - unite.y)
      if (d < meilleureDist) { meilleur = a; meilleureDist = d }
    }
    return meilleur
  }

  // Le château adverse n'est une cible que s'il est lui-même détecté
  // (même règle que pour un ennemi : rayon de détection + pas derrière).
  function chateauEstDetecte(unite) {
    const c = pointCastle(unite.team)
    return estDetectable(unite, c.x, c.y)
  }

  function mettreAJourUnite(unite, dt) {
    if (unite.pv <= 0) return
    if (unite.immobile) return // encaisse les dégâts, rien d'autre
    if (unite.etat === 'activation') {
      unite.activation -= dt
      if (unite.activation <= 0) unite.etat = 'marche'
      return
    }

    // Priorité à un ennemi détecté ; sinon le château adverse, mais
    // seulement s'il est lui-même détecté ; sinon, rien n'est détecté du
    // tout et l'unité continue simplement sa marche verticale par défaut.
    const ennemiProche = ennemiLePlusProche(unite)
    let cibleX, cibleY, rayonCible, cibleDetectee = true

    if (ennemiProche) {
      cibleX = ennemiProche.x; cibleY = ennemiProche.y
      rayonCible = rayonUnite(ennemiProche)
    } else if (chateauEstDetecte(unite)) {
      const c = pointCastle(unite.team)
      cibleX = c.x; cibleY = c.y
      // La hitbox du château est resserrée vers son centre (26px de base),
      // mais on ajoute ~1.5 hexagone de portée effective pour que les
      // unités puissent l'attaquer d'un peu plus loin.
      rayonCible = 26 + 1.5 * VS
    } else {
      cibleDetectee = false
    }

    const distCible = cibleDetectee ? Math.hypot(cibleX - unite.x, cibleY - unite.y) : Infinity

    if (cibleDetectee && distCible - rayonCible <= unite.porte) {
      unite.etat = 'attaque'
      unite.cooldownAttaque -= dt
      if (unite.cooldownAttaque <= 0) {
        unite.cooldownAttaque = unite.cooldownAttaqueBase
        declencherAttaque(unite, ennemiProche, cibleX, cibleY)
      }
      return
    }

    unite.etat = 'marche'
    const vitesse = unite.vitesseMarche * dt / 1000

    if (cibleDetectee) {
      // Une cible a été détectée (ennemi ou château) mais reste hors de
      // portée d'attaque : l'unité fonce droit dessus, quitte à quitter
      // sa ligne verticale d'origine.
      const dx = cibleX - unite.x, dy = cibleY - unite.y
      const d = Math.hypot(dx, dy) || 1
      unite.x += (dx / d) * vitesse
      unite.y += (dy / d) * vitesse
    } else {
      // Rien détecté : marche purement verticale vers le château adverse
      // (le contournement d'un allié bloqué en combat n'est pas un
      // comportement à part : c'est un simple effet de la collision
      // normale, voir separerPaire, qui résiste surtout sur l'axe de
      // marche d'une unité en plein combat et cède librement sur le côté).
      unite.x += unite.dirX * vitesse
      unite.y += unite.dirY * vitesse
    }
  }

  function mettreAJourUnites(dt) {
    for (const u of unitesJoueur) mettreAJourUnite(u, dt)
    for (const u of unitesEnnemi) mettreAJourUnite(u, dt)
    unitesJoueur = unitesJoueur.filter(u => u.pv > 0)
    unitesEnnemi = unitesEnnemi.filter(u => u.pv > 0)
    resoudreCollisions()
  }

  // ─── Attaques : effet visuel immédiat en mêlée, projectile en distance ──
  // En mêlée, les dégâts sont appliqués tout de suite (l'unité est déjà au
  // contact), on ajoute juste un éclat visuel léger. À distance, on lance
  // une flèche : les dégâts ne sont infligés qu'à l'impact du projectile,
  // pas au moment du tir.
  function declencherAttaque(unite, ennemiProche, cibleX, cibleY) {
    if (unite.typeAttaque === 'distance') {
      const dx = cibleX - unite.x, dy = cibleY - unite.y
      const dist = Math.hypot(dx, dy) || 1
      projectiles.push({
        x: unite.x, y: unite.y,
        angle: Math.atan2(dy, dx),
        team: unite.team,
        degats: unite.degats,
        cibleUnite: ennemiProche || null,
        // Point visé au moment du tir : sert de repli si la cible (unité)
        // meurt avant l'impact, et de cible fixe s'il s'agit d'un château.
        cibleXFixe: cibleX, cibleYFixe: cibleY,
        // Attaque à éclaboussure (Magicien) : à l'impact, tout ennemi dans
        // ce rayon est touché — voir mettreAJourProjectiles.
        zoneAttaque: unite.zoneAttaque,
        zoneAttaquePx: unite.zoneAttaquePx
      })
    } else {
      appliquerDegatsSurCible(unite, ennemiProche)
      effetsMelee.push({
        x: (unite.x + cibleX) / 2, y: (unite.y + cibleY) / 2,
        angle: Math.atan2(cibleY - unite.y, cibleX - unite.x),
        team: unite.team,
        dureeRestante: 160, dureeTotale: 160
      })
    }
  }

  function appliquerDegatsSurCible(unite, ennemiProche) {
    if (ennemiProche) {
      ennemiProche.pv = Math.max(0, ennemiProche.pv - unite.degats)
    } else if (unite.team === 'joueur') {
      ennemiChateauPV = Math.max(0, ennemiChateauPV - unite.degats)
    } else {
      joueurChateauPV = Math.max(0, joueurChateauPV - unite.degats)
    }
  }

  // Inflige des dégâts de zone à toutes les unités ADVERSES du camp `team`
  // situées dans un rayon (px) autour d'un point d'impact (x, y), et,
  // sauf si `multChateau` vaut 0, une part de ces dégâts au château visé
  // par ce camp s'il est dans le rayon d'effet. Utilisée à la fois par
  // l'attaque à éclaboussure du Magicien (voir mettreAJourProjectiles,
  // multChateau: 1 — c'est une troupe, pas de réduction) et par les sorts
  // à effet de zone (voir lancerSortZone, multChateau réduit).
  // `repousse` (optionnel, px) : en plus des dégâts, pousse les unités
  // touchées loin du point d'impact (voir la Bombe à eau) — le château,
  // lui, ne bouge évidemment jamais.
  function appliquerDegatsZone(x, y, rayon, team, degats, { multChateau = 1, repousse = 0 } = {}) {
    const adversaires = team === 'joueur' ? unitesEnnemi : unitesJoueur
    for (const u of adversaires) {
      if (u.pv <= 0) continue
      const dx = u.x - x, dy = u.y - y
      const d = Math.hypot(dx, dy)
      if (d > rayon + rayonUnite(u)) continue
      u.pv = Math.max(0, u.pv - degats)
      if (repousse > 0 && u.pv > 0 && !u.immobile) {
        const n = d > 0.001 ? d : 1
        u.x += (dx / n) * repousse
        u.y += (dy / n) * repousse
      }
    }
    if (multChateau > 0) {
      const c = pointCastle(team)
      if (Math.hypot(c.x - x, c.y - y) <= rayon + 26) {
        const degatsChateau = Math.round(degats * multChateau)
        if (team === 'joueur') ennemiChateauPV = Math.max(0, ennemiChateauPV - degatsChateau)
        else joueurChateauPV = Math.max(0, joueurChateauPV - degatsChateau)
      }
    }
  }

  function mettreAJourProjectiles(dt) {
    for (const p of projectiles) {
      // Cible actuelle : suit l'unité visée tant qu'elle est vivante,
      // sinon se rabat sur le dernier point connu (château, ou position
      // de mort de la cible — la flèche finit sa course dans le vide).
      let tx = p.cibleXFixe, ty = p.cibleYFixe
      const cibleVivante = p.cibleUnite && p.cibleUnite.pv > 0
      if (cibleVivante) { tx = p.cibleUnite.x; ty = p.cibleUnite.y }

      const dx = tx - p.x, dy = ty - p.y
      const dist = Math.hypot(dx, dy)
      const pas = VITESSE_PROJECTILE * dt / 1000

      if (dist <= Math.max(pas, 5)) {
        // Impact : les dégâts n'arrivent que maintenant, à l'atteinte de
        // la cible — jamais au moment du tir.
        if (p.zoneAttaque) {
          appliquerDegatsZone(p.x, p.y, p.zoneAttaquePx, p.team, p.degats, { multChateau: 1 })
        } else if (p.cibleUnite) {
          if (cibleVivante) p.cibleUnite.pv = Math.max(0, p.cibleUnite.pv - p.degats)
        } else if (p.team === 'joueur') {
          ennemiChateauPV = Math.max(0, ennemiChateauPV - p.degats)
        } else {
          joueurChateauPV = Math.max(0, joueurChateauPV - p.degats)
        }
        p.termine = true
      } else {
        p.x += dx / dist * pas
        p.y += dy / dist * pas
        p.angle = Math.atan2(dy, dx)
      }
    }
    projectiles = projectiles.filter(p => !p.termine)
  }

  function mettreAJourEffetsMelee(dt) {
    for (const e of effetsMelee) e.dureeRestante -= dt
    effetsMelee = effetsMelee.filter(e => e.dureeRestante > 0)
  }

  function mettreAJourEffetsSort(dt) {
    for (const e of effetsSort) e.dureeRestante -= dt
    effetsSort = effetsSort.filter(e => e.dureeRestante > 0)
  }

  // Petite flèche orientée vers sa direction de vol.
  function dessinerProjectile(p) {
    const couleur = p.team === 'joueur' ? '#93c5fd' : '#fca5a5'
    ctx.save()
    ctx.translate(p.x, p.y)
    ctx.rotate(p.angle || 0)
    ctx.strokeStyle = couleur
    ctx.fillStyle = couleur
    ctx.lineWidth = 2
    ctx.beginPath()
    ctx.moveTo(-7, 0)
    ctx.lineTo(5, 0)
    ctx.stroke()
    ctx.beginPath()
    ctx.moveTo(7, 0)
    ctx.lineTo(2, -3)
    ctx.lineTo(2, 3)
    ctx.closePath()
    ctx.fill()
    ctx.restore()
  }

  function dessinerProjectiles() {
    for (const p of projectiles) dessinerProjectile(p)
  }

  // Petit éclat en arc de cercle, orienté vers la cible, qui s'estompe
  // rapidement — le "coup" visuel d'une attaque au corps à corps.
  function dessinerEffetMelee(e) {
    const frac = Math.max(0, e.dureeRestante / e.dureeTotale)
    const couleur = e.team === 'joueur' ? '#93c5fd' : '#fca5a5'
    ctx.save()
    ctx.globalAlpha = frac
    ctx.translate(e.x, e.y)
    ctx.rotate(e.angle || 0)
    ctx.strokeStyle = couleur
    ctx.lineWidth = 2
    const rayon = 8 + (1 - frac) * 6
    ctx.beginPath()
    ctx.arc(0, 0, rayon, -0.7, 0.7)
    ctx.stroke()
    ctx.restore()
  }

  function dessinerEffetsMelee() {
    for (const e of effetsMelee) dessinerEffetMelee(e)
  }

  // Cercle qui grandit et s'estompe sur la zone d'effet d'un sort
  // (Boule de feu, Bombe à eau…) — simple retour visuel sur l'endroit et
  // l'étendue touchés.
  function dessinerEffetSort(e) {
    const frac = Math.max(0, e.dureeRestante / e.dureeTotale)
    ctx.save()
    ctx.globalAlpha = frac * 0.7
    ctx.strokeStyle = e.couleur
    ctx.fillStyle = e.couleur
    ctx.lineWidth = 3
    ctx.beginPath()
    ctx.arc(e.x, e.y, e.rayon * (1 - frac * 0.35), 0, Math.PI * 2)
    ctx.globalAlpha = frac * 0.15
    ctx.fill()
    ctx.globalAlpha = frac * 0.7
    ctx.stroke()
    ctx.restore()
  }

  function dessinerEffetsSort() {
    for (const e of effetsSort) dessinerEffetSort(e)
  }

  function dessinerUnite(u) {
    const r = rayonUnite(u)
    const couleur = u.team === 'joueur' ? '#2563eb' : '#dc2626'
    ctx.beginPath()
    ctx.arc(u.x, u.y, r, 0, Math.PI * 2)
    ctx.fillStyle = couleur
    ctx.fill()
    ctx.strokeStyle = '#00000088'
    ctx.lineWidth = 2
    ctx.stroke()

    ctx.font = Math.round(13 * (u.taille || 1)) + 'px sans-serif'
    ctx.textAlign = 'center'
    ctx.textBaseline = 'middle'
    ctx.fillText(u.emoji, u.x, u.y + 1)

    // Barre de vie et icône d'activation : positionnées juste au-dessus
    // du cercle de l'unité, quelle que soit sa taille.
    const w = 28, h = 4
    const yBarre = u.y - r - 10
    const frac = Math.max(0, u.pv / u.pvMax)
    ctx.fillStyle = '#000000aa'
    ctx.fillRect(u.x - w / 2, yBarre, w, h)
    ctx.fillStyle = frac > 0.5 ? '#22c55e' : (frac > 0.25 ? '#f59e0b' : '#ef4444')
    ctx.fillRect(u.x - w / 2, yBarre, w * frac, h)

    if (u.etat === 'activation') {
      ctx.font = '11px sans-serif'
      ctx.fillStyle = '#ffffffcc'
      ctx.fillText('⏳', u.x, yBarre - 6)
    }
  }

  function dessinerUnites() {
    for (const u of unitesJoueur) dessinerUnite(u)
    for (const u of unitesEnnemi) dessinerUnite(u)
  }

  // ─── Zone de pose (surlignée pendant un glisser) ───────────────
  let enTrainDeGlisser = false
  function dessinerZoneDepot() {
    if (!enTrainDeGlisser) return
    const carte = CARTES[carteEnCours]

    // Taille de la case en surbrillance : volontairement plus grande que la
    // case réelle (qui fait R - 1.2) pour que l'aide au placement reste
    // bien visible, avec un contour plus épais.
    const RAYON_AIDE_PLACEMENT = R * 1.3
    const EPAISSEUR_AIDE_PLACEMENT = 4

    // Carte à placement libre (sort, ex: statue) : toute la grille est
    // utilisable, on se contente de surligner la case survolée.
    if (carte && carte.placementLibre) {
      ctx.fillStyle = '#a855f715'
      ctx.fillRect(MARGE, gridOffsetY, canvas.width - 2 * MARGE, gridH)
      if (hexSurvole) {
        drawHex(hexSurvole.cx, hexSurvole.cy, RAYON_AIDE_PLACEMENT, '#a855f788', '#d8b4fe', EPAISSEUR_AIDE_PLACEMENT)
      }
      return
    }

    const { yMin, yMax } = calculerZonePose()
    ctx.fillStyle = '#2563eb18'
    ctx.fillRect(MARGE, yMin, canvas.width - 2 * MARGE, yMax - yMin)
    ctx.strokeStyle = '#2563eb55'
    ctx.setLineDash([5, 4])
    ctx.strokeRect(MARGE, yMin, canvas.width - 2 * MARGE, yMax - yMin)
    ctx.setLineDash([])

    // Hexagone précisément survolé par le curseur/doigt : s'illumine en
    // bleu s'il est posable (notre zone), en rouge sinon.
    if (hexSurvole) {
      const valide = hexSurvole.cy >= yMin - 1 && hexSurvole.cy <= yMax + 1
      drawHex(
        hexSurvole.cx, hexSurvole.cy, RAYON_AIDE_PLACEMENT,
        valide ? '#3b82f688' : '#ef444466',
        valide ? '#93c5fd' : '#fca5a5',
        EPAISSEUR_AIDE_PLACEMENT
      )
    }
  }

  // ─── Fond de l'arène ─────────────────────────────────────────
  function drawBg() {
    ctx.fillStyle = C.bg
    ctx.fillRect(0, 0, canvas.width, canvas.height)

    // Séparateurs visuels château / grille
    ctx.fillStyle = '#ffffff08'
    ctx.fillRect(0, CASTLE_PX, canvas.width, 4)
    ctx.fillRect(0, canvas.height - CASTLE_PX - 4, canvas.width, 4)
  }

  // ─── Helpers ─────────────────────────────────────────────────
  function rect(x, y, w, h) {
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h))
  }

  // ─── Rendu principal ─────────────────────────────────────────
  function render() {
    drawBg()
    drawGrid()
    dessinerZoneDepot()
    drawCastle(false) // ennemi (haut)
    drawCastle(true)  // joueur (bas)
    dessinerUnites()
    dessinerProjectiles()
    dessinerEffetsMelee()
    dessinerEffetsSort()
  }

  // ─── Jauge de pioche (camembert) ────────────────────────────────
  // Se remplit progressivement entre deux pioches automatiques, pour
  // visualiser le temps restant avant la prochaine carte.
  function actualiserJaugePioche() {
    const el = document.getElementById('pioche-jauge')
    if (!el) return
    if (!partieCommencee || partieTerminee) {
      el.style.setProperty('--p', 0)
      return
    }
    const intervalle = intervallePiocheActuel()
    const pourcentage = intervalle > 0 ? Math.min(100, (tempsDepuisPioche / intervalle) * 100) : 0
    el.style.setProperty('--p', pourcentage)
  }

  // ─── Animation de carte piochée (gagnée ou perdue si main pleine) ──
  function animerCartePiochee(carteId, perdue) {
    const carte = CARTES[carteId]
    if (!carte) return
    const origine = document.getElementById('pioche-jauge')
    if (!origine) return
    const r = origine.getBoundingClientRect()
    const el = document.createElement('div')
    el.className = 'carte-pioche-anim' + (perdue ? ' perdue' : '')
    el.style.left = (r.left + r.width / 2) + 'px'
    el.style.top = (r.top + r.height / 2) + 'px'
    el.innerHTML = `
      <span class="carte-pioche-emoji">${carte.emoji}</span>
      <span class="carte-pioche-label">${perdue ? '❌ ' + carte.nom + ' perdue' : '+ ' + carte.nom}</span>`
    document.body.appendChild(el)
    el.addEventListener('animationend', () => el.remove())
  }

  // ─── Boucle de jeu ──────────────────────────────────────────
  function boucleDeJeu(timestamp) {
    if (!dernierTimestamp) dernierTimestamp = timestamp
    const dt = Math.min(50, timestamp - dernierTimestamp) // dt plafonné (onglet en arrière-plan)
    dernierTimestamp = timestamp

    if (partieCommencee && !partieTerminee) {
      mettreAJourUnites(dt)
      mettreAJourProjectiles(dt)
      mettreAJourEffetsMelee(dt)
      mettreAJourEffetsSort(dt)

      tempsDepuisSpawnEnnemi += dt
      if (tempsDepuisSpawnEnnemi >= INTERVALLE_SPAWN_ENNEMI) {
        tempsDepuisSpawnEnnemi -= INTERVALLE_SPAWN_ENNEMI
        spawnEnnemiAleatoire()
      }

      tempsCombat += dt

      // Génération d'or continue, plafonnée à orCapaciteMax, dont le rythme
      // accélère par palier (voir intervalleOrActuel).
      tempsDepuisGeneration += dt
      const intervalleOr = intervalleOrActuel()
      let orAAffiche = false
      while (tempsDepuisGeneration >= intervalleOr) {
        tempsDepuisGeneration -= intervalleOr
        if (or < orCapaciteMax) { or += 1; orAAffiche = true }
      }
