<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Battlogy</title>
  <link rel="stylesheet" href="../style/style.css">
  <script>
  (function(){
    var t = localStorage.getItem('theme_couleurs');
    if (!t) return;
    try {
      var c = JSON.parse(t);
      var r = document.documentElement.style;
      r.setProperty('--couleur-fond', c.couleur_fond);
      r.setProperty('--couleur-conteneur', c.couleur_conteneur);
      r.setProperty('--couleur-bordure', c.couleur_bordure);
      r.setProperty('--couleur-bouton', c.couleur_bouton);
      var h = c.couleur_fond.replace('#','');
      var lum=(0.299*parseInt(h.substring(0,2),16)+0.587*parseInt(h.substring(2,4),16)+0.114*parseInt(h.substring(4,6),16))/255;
      r.setProperty('--couleur-texte', lum < 0.5 ? '#f1f1f1' : '#1a1a1a');
      r.setProperty('--couleur-texte-faible', lum < 0.5 ? '#9ca3af' : '#6b7280');
    } catch(e) {}
  })();
  </script>
  <style>body { visibility: hidden; }</style>
  <style>
    html, body { height: 100%; }
    body {
      height: 100vh;
      height: 100dvh; /* tient compte des barres d'adresse mobiles (iOS/Android) */
      overflow: hidden;
    }
    /* Cette page ne charge pas de footer : le header (en haut) et
       <main> (flex:1) se partagent donc toute la hauteur d'écran fixée
       ci-dessus, et l'arène (flex:1 dans .battlogy-wrap) récupère
       exactement ce qui reste après le titre et la barre de cartes. */
    main { flex: 1 1 auto; min-height: 0; display: flex; }
    .battlogy-wrap {
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
      height: 100%;
      box-sizing: border-box;
      padding: .75rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .6rem;
      overflow: hidden;
    }
    .battlogy-topbar {
      width: 100%;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .battlogy-topbar h1 { margin: 0; font-size: 1.4rem; }
    .battlogy-beta {
      font-size: .72rem;
      font-weight: 700;
      color: #f59e0b;
      background: #f59e0b22;
      border: 1px solid #f59e0b55;
      border-radius: 999px;
      padding: .2rem .65rem;
      letter-spacing: .05em;
    }
    .arena-outer {
      width: 100%;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--couleur-bordure);
      border-radius: 12px;
      overflow: hidden;
      background: #0b160b;
      position: relative;
    }
    #game-canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      image-rendering: pixelated;
    }
    .arena-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
      padding: 1rem;
    }
    .arena-overlay.cachee { display: none; }
    .arena-overlay-carte {
      background: var(--couleur-conteneur);
      border-radius: 12px;
      padding: 1.75rem 2rem;
      text-align: center;
      max-width: 280px;
      box-shadow: 0 8px 30px rgba(0,0,0,.35);
    }
    .arena-overlay-carte h2 { font-size: 1.3rem; margin-bottom: .5rem; }
    .arena-overlay-carte p {
      color: var(--couleur-texte-faible);
      font-size: .85rem;
      margin-bottom: 1.25rem;
    }
    .battlogy-bottombar {
      width: 100%;
      flex: 0 0 auto;
      min-height: 84px;
      border: 1px solid var(--couleur-bordure);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: .75rem;
      padding: .6rem .75rem;
      color: var(--couleur-texte-faible);
      font-size: .8rem;
      text-align: center;
      background: var(--couleur-conteneur);
    }
    .battlogy-or {
      font-size: .85rem;
      font-weight: 700;
      color: var(--couleur-texte);
      white-space: nowrap;
      padding: 0 .5rem;
      border-right: 1px solid var(--couleur-bordure);
      margin-right: .25rem;
    }
    .carte-main {
      width: 66px;
      height: 78px;
      flex: 0 0 auto;
      background: var(--couleur-fond);
      border: 2px solid var(--couleur-bouton);
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: .15rem;
      cursor: grab;
      user-select: none;
      touch-action: none;
      transition: filter .1s, transform .1s;
    }
    .carte-main:active { cursor: grabbing; transform: scale(0.96); }
    .carte-main.indisponible { opacity: .4; cursor: not-allowed; }
    .carte-main .carte-emoji { font-size: 1.5rem; }
    .carte-main .carte-nom { font-size: .62rem; font-weight: 700; color: var(--couleur-texte); }
    .carte-main .carte-cout {
      font-size: .68rem;
      font-weight: 700;
      color: #92400e;
      background: #fef3c7;
      border-radius: 999px;
      padding: 0 .4rem;
    }
    .carte-ghost {
      position: fixed;
      z-index: 2000;
      pointer-events: none;
      transform: translate(-50%, -50%);
      font-size: 1.8rem;
      opacity: .45;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,.4));
    }
    .battlogy-message {
      position: fixed;
      left: 50%;
      bottom: 6.2rem;
      transform: translateX(-50%);
      background: #111827dd;
      color: #fff;
      font-size: .8rem;
      padding: .5rem 1rem;
      border-radius: 999px;
      z-index: 2001;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s;
      white-space: nowrap;
    }
    .battlogy-message.visible { opacity: 1; }
  </style>
</head>
<body>
  <div id="header-placeholder"></div>
  <main>
    <div class="battlogy-wrap">
      <div class="battlogy-topbar">
        <h1>⚔️ Battlogy</h1>
        <span class="battlogy-beta">BÊTA</span>
      </div>
      <div class="arena-outer" id="arena-outer">
        <canvas id="game-canvas"></canvas>
        <div class="arena-overlay" id="arena-overlay">
          <div class="arena-overlay-carte">
            <h2 id="overlay-titre">Battlogy</h2>
            <p id="overlay-texte">Pose tes unités pour détruire le château ennemi avant qu'il ne détruise le tien.</p>
            <button class="btn btn-primary" id="btn-lancer">Lancer la partie</button>
          </div>
        </div>
      </div>
      <div class="battlogy-bottombar" id="battlogy-bottombar">
        <div class="battlogy-or">🪙 Or : <span id="or-affiche">∞</span></div>
        <div class="carte-main indisponible" data-carte="guerrier">
          <span class="carte-emoji">⚔️</span>

        <div class="carte-main indisponible" data-carte="squelette">
          <span class="carte-emoji">💀</span>
          <span class="carte-nom">Squelettes</span>
          <span class="carte-cout">2</span>
        </div>
        <div class="carte-main indisponible" data-carte="statue">
          <span class="carte-emoji">🗿</span>
          <span class="carte-nom">Statue</span>
          <span class="carte-cout">3</span>
        </div>
      </div>
    </div>
  </main>

  <div class="battlogy-message" id="battlogy-message"></div>

  <script type="module">
    import { chargerHeader, appliquerTheme } from '../script/header.js'
    ;(async () => {
      document.body.style.setProperty('visibility', 'visible', 'important')
      appliquerTheme()
      await chargerHeader('../')
      await window.chargerImagesChateau()
      initArena()
    })()
  </script>

  <script>
  // ─── Constantes de jeu ───────────────────────────────────────
  const COLS        = 7
  const ROWS        = 20
  const CASTLE_PX   = 78    // hauteur en px de chaque zone château (barre de vie + image)
  const MARGE       = 8     // marge horizontale

  // Palette de couleurs de l'arène (indépendante du thème du site)
  const C = {
    bg:             '#0b160b',
    hexBase:        '#1f3d1f',
    hexBaseDark:    '#193319',
    hexBord:        '#142b14',
    hexEnemy:       '#3d1414',
    hexEnemyDark:   '#321010',
    hexPlayer:      '#14243d',
    hexPlayerDark:  '#101e32',
    zoneLine:       '#ffffff22',
    castleEStone:   '#7f1d1d',
    castleEStoneDk: '#6b1818',
    castlePStone:   '#1e3a8a',
    castlePStoneDk: '#172f70',
    castleMerlon:   '#9b2a2a',  // créneau ennemi
    castleMerlonP:  '#2563eb',  // créneau joueur
    stoneAccent:    '#4b5563',
    hp_bg:          '#374151',
    hp_enemy:       '#ef4444',
    hp_player:      '#22c55e',
    text:           '#f1f1f1',
    textSoft:       '#9ca3af',
    gateInner:      '#050d05',
  }

  let canvas, ctx
  let R   // hex circumradius
  let HS  // espacement horizontal entre colonnes (flat-top) = 1.5*R
  let VS  // espacement vertical entre rangées (flat-top) = sqrt(3)*R
  let gridOffsetY  // y où commence la grille
  let gridH        // hauteur réelle de la grille
  let zoneJoueurYMax  // limite basse (haut du château) de la grille jouable

  // ─── Cartes (données en dur, pour les tests) ──────────────────
  // porte / zoneDetection en px, vitesseMarche en px/s, vitesseAttaque en
  // attaques/seconde, tempsActivation en ms, cout en or, nombre = nombre
  // d'unités invoquées par la carte (ex: 3 squelettes pour une seule carte).
  // `taille` : multiplicateur appliqué au rayon de base d'une unité
  // (RAYON_UNITE_BASE, voir plus bas). Affecte à la fois le dessin (cercle,
  // police, barre de vie) ET la hit box utilisée pour le combat (la
  // portée d'attaque d'un adversaire est comparée à ce rayon). 1 = taille
  // normale ; les squelettes sont 2x plus petits (0.5).
  const CARTES = {
    guerrier: {
      id: 'guerrier', nom: 'Guerrier', emoji: '⚔️', cout: 1,
      pv: 100, degats: 10, porte: 34, vitesseAttaque: 1,
      vitesseMarche: 45, zoneDetection: 90, tempsActivation: 800, nombre: 1,
      taille: 1
    },
    archer: {
      id: 'archer', nom: 'Archer', emoji: '🏹', cout: 2,
      pv: 55, degats: 12, porte: 120, vitesseAttaque: 0.9,
      vitesseMarche: 40, zoneDetection: 140, tempsActivation: 900, nombre: 1,
      taille: 1
    },
    squelette: {
      id: 'squelette', nom: 'Squelettes', emoji: '💀', cout: 2,
      pv: 30, degats: 5, porte: 26, vitesseAttaque: 1.3,
      vitesseMarche: 55, zoneDetection: 80, tempsActivation: 500, nombre: 3,
      taille: 0.5
    },
    // Carte spéciale, catégorisée comme un "sort" (fait apparaître une
    // statue plutôt que de recruter une troupe classique). Contourne les
    // règles de placement (posable sur n'importe quel hexagone du terrain,
    // y compris en zone ennemie). Ne bouge jamais, n'attaque jamais : sa
    // seule fonction est d'encaisser les dégâts (voir `immobile` plus bas,
    // utilisé dans mettreAJourUnite). Reste considérée comme une unité
    // alliée pour tout le reste (ciblage ennemi, calcul de la zone de pose
    // des autres troupes, etc.).
    statue: {
      id: 'statue', nom: 'Statue', emoji: '🗿', cout: 3,
      categorie: 'sort', placementLibre: true, immobile: true,
      pv: 120, degats: 0, porte: 0, vitesseAttaque: 0,
      vitesseMarche: 0, zoneDetection: 0, tempsActivation: 0, nombre: 1,
      taille: 1
    }
  }

  // Rayon (en px) d'une unité de taille 1. Tous les rayons d'unité se
  // calculent en multipliant cette base par `taille`.
  const RAYON_UNITE_BASE = 14

  // ─── État de la partie (test : or infini) ─────────────────────
  let or = Infinity
  let joueurChateauPV = 1000, joueurChateauPVMax = 1000
  let ennemiChateauPV = 1000, ennemiChateauPVMax = 1000
  let unitesJoueur = []
  let unitesEnnemi = []
  let uniteIdCompteur = 0
  let dernierTimestamp = null

  // Apparition automatique d'un guerrier ennemi, pour les tests.
  const INTERVALLE_SPAWN_ENNEMI = 10000 // ms
  let tempsDepuisSpawnEnnemi = 0

  // Case survolée pendant le glisser d'une carte (mise en surbrillance).
  let hexSurvole = null

  // Cycle de vie de la partie : rien ne bouge tant que le joueur n'a pas
  // cliqué sur « Lancer la partie » ; tout s'arrête dès qu'un château tombe.
  let partieCommencee = false
  let partieTerminee = false

  // ─── Images des châteaux ───────────────────────────────────────
  const imgCastleEnemi  = new Image()
  const imgCastleJoueur = new Image()
  function chargerImagesChateau() {
    return Promise.all([
      new Promise(res => { imgCastleEnemi.onload = res; imgCastleEnemi.onerror = res; imgCastleEnemi.src  = '../pictures/castred.png' }),
      new Promise(res => { imgCastleJoueur.onload = res; imgCastleJoueur.onerror = res; imgCastleJoueur.src = '../pictures/castblue.png' })
    ])
  }
  window.chargerImagesChateau = chargerImagesChateau

  // ─── Initialisation ──────────────────────────────────────────
  // Les colonnes paires ont une rangée de plus (ROWS+1) que les colonnes
  // impaires (ROWS) : la grille commence ET finit par une ligne pleine,
  // symétrique en haut et en bas.
  function initArena() {
    canvas = document.getElementById('game-canvas')
    const outer = document.getElementById('arena-outer')

    const availW = outer.clientWidth  || 380
    const availH = outer.clientHeight || 480

    // R limité par la largeur disponible
    const Rw = (availW - 2 * MARGE) / (1.5 * COLS + 0.5)
    // R limité par la hauteur disponible (2 châteaux + grille, colonnes
    // pleines = ROWS+1 rangées)
    const Rh = (availH - 2 * CASTLE_PX - 12) / ((ROWS + 1) * Math.sqrt(3))

    R  = Math.max(6, Math.min(Rw, Rh))
    HS = R * 1.5           // espacement horizontal entre centres de colonnes
    VS = R * Math.sqrt(3)  // espacement vertical entre centres de rangées

    gridOffsetY = CASTLE_PX + 6

    gridH        = (ROWS + 1) * VS                       // hauteur réelle de la grille
    const gridW  = (1.5 * COLS + 0.5) * R + 2 * MARGE     // largeur réelle de la grille

    canvas.width  = Math.round(gridW)
    canvas.height = Math.round(gridOffsetY + gridH + 6 + CASTLE_PX)

    // Limite basse de la grille jouable = juste avant le château joueur.
    // La zone de pose réelle est désormais calculée dynamiquement,
    // voir calculerZonePose().
    zoneJoueurYMax = canvas.height - CASTLE_PX

    ctx = canvas.getContext('2d')
    if (!dernierTimestamp) requestAnimationFrame(boucleDeJeu)
  }

  // ─── Conversion coordonnées hexa → pixels ────────────────────
  function hexCenter(row, col) {
    const x = MARGE + R + col * HS
    const y = gridOffsetY + VS / 2 + row * VS + (col % 2 === 1 ? VS / 2 : 0)
    return { x, y }
  }

  // ─── Trouve l'hexagone le plus proche d'un point (x,y) en pixels ──
  // Cherche dans une petite fenêtre de colonnes/rangées autour d'une
  // estimation, puis garde le centre d'hexagone le plus proche. Retourne
  // null si aucun hexagone n'est assez proche (curseur hors grille).
  function trouverHexProche(x, y) {
    const colEstime = Math.round((x - MARGE - R) / HS)
    let meilleur = null, meilleureDist = Infinity
    for (let c = Math.max(0, colEstime - 1); c <= Math.min(COLS - 1, colEstime + 1); c++) {
      const maxRow = (c % 2 === 0) ? ROWS : ROWS - 1
      const decalage = (c % 2 === 1) ? VS / 2 : 0
      const rowEstime = Math.round((y - gridOffsetY - VS / 2 - decalage) / VS)
      for (let r = Math.max(0, rowEstime - 1); r <= Math.min(maxRow, rowEstime + 1); r++) {
        const { x: cx, y: cy } = hexCenter(r, c)
        const d = Math.hypot(cx - x, cy - y)
        if (d < meilleureDist) { meilleureDist = d; meilleur = { row: r, col: c, cx, cy } }
      }
    }
    if (!meilleur || meilleureDist > R * 1.15) return null
    return meilleur
  }

  // ─── Règles de placement dynamiques ────────────────────────────
  // 1. Aucune unité alliée sur le terrain → on ne peut poser que sur les
  //    cases qui collent notre château (une seule rangée de profondeur).
  // 2. Une unité alliée est présente → on peut poser sur toute case entre
  //    notre château et cette unité (la plus avancée, si plusieurs).
  // 3. Un ennemi s'est infiltré entre notre château et notre unité la plus
  //    avancée → la zone de pose se referme jusqu'à lui : on ne peut plus
  //    poser qu'entre cet ennemi et notre château.
  // 4. Dans tous les cas (même règle 2/3) : jamais dans la moitié ennemie
  //    du terrain — sauf capacité spéciale (carte.placementLibre, ex: la
  //    statue, qui contourne toutes ces règles).
  //
  // Tout est exprimé en coordonnées y (pixels) : y petit = proche du
  // château ennemi (haut), y grand = proche de notre château (bas).
  function calculerZonePose() {
    const limiteMoitieEnnemie = gridOffsetY + 8 * VS   // jamais au-delà (règle 4)
    const profondeurColleChateau = VS                   // largeur d'une rangée

    // Par défaut (aucun allié) : uniquement la rangée qui colle le château.
    let yMin = zoneJoueurYMax - profondeurColleChateau

    const alliesVivants = unitesJoueur.filter(u => u.pv > 0)
    if (alliesVivants.length > 0) {
      // L'allié le plus avancé (le plus petit y) repousse la limite.
      yMin = Math.min(...alliesVivants.map(u => u.y))
    }

    // Un ennemi ayant percé entre notre château et notre allié le plus
    // avancé referme la zone jusqu'à lui.
    const ennemisEnPercee = unitesEnnemi.filter(u => u.pv > 0 && u.y > yMin && u.y < zoneJoueurYMax)
    if (ennemisEnPercee.length > 0) {
      yMin = Math.max(yMin, Math.max(...ennemisEnPercee.map(u => u.y)))
    }

    // Règle générale : jamais dans la moitié ennemie.
    yMin = Math.max(yMin, limiteMoitieEnnemie)

    return { yMin, yMax: zoneJoueurYMax }
  }

  // Un hexagone est-il posable pour cette carte, compte tenu des règles
  // ci-dessus (ou de placementLibre pour les cartes qui les contournent) ?
  function estPositionValidePourPose(carteId, hex) {
    if (!hex) return false
    const carte = CARTES[carteId]
    if (!carte) return false
    if (carte.placementLibre) return true
    const { yMin, yMax } = calculerZonePose()
    return hex.cy >= yMin - 1 && hex.cy <= yMax + 1
  }

  // ─── Dessin d'un hexagone (flat-top, càd pointy-top tourné de 90°) ──
  function drawHex(cx, cy, r, fill, stroke, largeurTrait) {
    ctx.beginPath()
    for (let i = 0; i < 6; i++) {
      const a = Math.PI / 180 * (60 * i)
      const px = cx + r * Math.cos(a)
      const py = cy + r * Math.sin(a)
      i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py)
    }
    ctx.closePath()
    ctx.fillStyle = fill
    ctx.fill()
    if (stroke) {
      ctx.strokeStyle = stroke
      ctx.lineWidth = largeurTrait || 1
      ctx.stroke()
    }
  }

  // ─── Couleur d'un hex selon sa zone ──────────────────────────
  // maxRow : dernière rangée existante pour cette colonne (ROWS pour les
  // colonnes paires qui ont une rangée de plus, ROWS-1 pour les impaires).
  function couleurHex(row, col) {
    const dark = (row + col) % 2 === 0
    const maxRow = (col % 2 === 0) ? ROWS : ROWS - 1
    if (row <= 7)            return dark ? C.hexEnemyDark  : C.hexEnemy
    if (row >= maxRow - 7)   return dark ? C.hexPlayerDark : C.hexPlayer
    return dark ? C.hexBaseDark : C.hexBase
  }

  // ─── Grille hexagonale ────────────────────────────────────────
  // Colonnes paires : ROWS+1 rangées (0..ROWS) → ligne pleine en haut ET en bas.
  // Colonnes impaires : ROWS rangées (0..ROWS-1), décalées d'une demi-hauteur.
  function drawGrid() {
    for (let c = 0; c < COLS; c++) {
      const rowsCol = (c % 2 === 0) ? ROWS + 1 : ROWS
      for (let r = 0; r < rowsCol; r++) {
        const { x, y } = hexCenter(r, c)
        drawHex(x, y, R - 1.2, couleurHex(r, c), C.hexBord)
      }
    }

    // Lignes de zone en pointillés (en y, pour rester alignées malgré le
    // décalage entre colonnes paires/impaires)
    ctx.setLineDash([6, 4])
    ctx.lineWidth = 1.5

    drawZoneLine(gridOffsetY + 8 * VS,                     '#ef444455') // limite zone ennemi
    drawZoneLine(gridOffsetY + (ROWS + 1) * VS - 8 * VS,   '#3b82f655') // limite zone joueur
    ctx.setLineDash([])
  }

  function drawZoneLine(y, color) {
    ctx.strokeStyle = color
    ctx.beginPath()
    ctx.moveTo(MARGE, y)
    ctx.lineTo(canvas.width - MARGE, y)
    ctx.stroke()
  }

  // ─── Château ─────────────────────────────────────────────────
  function drawCastle(isPlayer) {
    const W = canvas.width - 2 * MARGE
    const x = MARGE
    const BAR_H = 6   // hauteur de la barre de vie
    const GAP   = 4   // petit espace entre la barre et l'image

    // ── Barre de PV : collée directement au bord de l'arène ──
    // (tout en haut pour l'ennemi, tout en bas pour le joueur)
    const hpBarY = isPlayer ? canvas.height - BAR_H : 0
    const pvFrac = isPlayer
      ? Math.max(0, joueurChateauPV / joueurChateauPVMax)
      : Math.max(0, ennemiChateauPV / ennemiChateauPVMax)
    ctx.fillStyle = C.hp_bg
    rect(0, hpBarY, canvas.width, BAR_H)
    ctx.fillStyle = isPlayer ? C.hp_player : C.hp_enemy
    rect(0, hpBarY, canvas.width * pvFrac, BAR_H)

    // ── Image du château : juste derrière la barre, occupe le reste de la
    // zone jusqu'à la grille (plus d'espace vide entre le bord et la barre).
    const imgH = CASTLE_PX - BAR_H - GAP
    const imgY = isPlayer ? canvas.height - CASTLE_PX : BAR_H + GAP
    const img  = isPlayer ? imgCastleJoueur : imgCastleEnemi
    if (img.complete && img.naturalWidth > 0) {
      ctx.drawImage(img, x, imgY, W, imgH)
    }
  }

  // ─── Point de cible du château (utilisé pour la marche et l'attaque) ──
  function pointCastle(team) {
    // team = camp qui VISE ce château (ex: 'joueur' vise le château ennemi)
    return team === 'joueur'
      ? { x: canvas.width / 2, y: CASTLE_PX * 0.5 }
      : { x: canvas.width / 2, y: canvas.height - CASTLE_PX * 0.5 }
  }

  // ─── Unités ─────────────────────────────────────────────────
  function poserCarte(carte, x, y, team) {
    const n = carte.nombre || 1
    for (let i = 0; i < n; i++) {
      const decalage = (i - (n - 1) / 2) * 20
      creerUnite(carte, x + decalage, y, team)
    }
  }

  // Fait apparaître un guerrier ennemi sur une case aléatoire de la zone
  // ennemie (les 8 premières rangées), pour tester le système de combat.
  function spawnEnnemiAleatoire() {
    const col = Math.floor(Math.random() * COLS)
    const maxRow = (col % 2 === 0) ? ROWS : ROWS - 1
    const row = Math.floor(Math.random() * Math.min(8, maxRow + 1))
    const { x, y } = hexCenter(row, col)
    poserCarte(CARTES.guerrier, x, y, 'ennemi')
  }

  function creerUnite(carte, x, y, team) {
    const cible = pointCastle(team)
    const dx = cible.x - x, dy = cible.y - y
    const dist = Math.hypot(dx, dy) || 1
    const unite = {
      id: ++uniteIdCompteur,
      carteId: carte.id,
      emoji: carte.emoji,
      team,
      x, y,
      pv: carte.pv, pvMax: carte.pv,
      degats: carte.degats,
      porte: carte.porte,
      taille: carte.taille || 1,
      zoneDetection: carte.zoneDetection,
      vitesseMarche: carte.vitesseMarche,
      cooldownAttaqueBase: 1000 / (carte.vitesseAttaque || 1),
      cooldownAttaque: 0,
      activation: carte.tempsActivation,
      dirX: dx / dist, dirY: dy / dist,
      // Une unité immobile (ex: la statue) ne passe jamais par l'état
      // d'activation/marche/attaque : elle reste plantée, encaisse les
      // dégâts, un point c'est tout (voir mettreAJourUnite).
      immobile: !!carte.immobile,
      etat: carte.immobile ? 'immobile' : 'activation'
    }
    ;(team === 'joueur' ? unitesJoueur : unitesEnnemi).push(unite)
  }

  // Rayon effectif (hit box) d'une unité, selon sa taille.
  function rayonUnite(unite) {
    return RAYON_UNITE_BASE * (unite.taille || 1)
  }

  // Cherche, parmi le camp adverse, l'ennemi vivant le plus proche présent
  // dans la zone de détection de l'unité (préparé pour de futures cartes
  // ennemies — pour l'instant unitesEnnemi est toujours vide).
  function ennemiLePlusProche(unite) {
    const adversaires = unite.team === 'joueur' ? unitesEnnemi : unitesJoueur
    let meilleur = null, meilleureDist = Infinity
    for (const a of adversaires) {
      const d = Math.hypot(a.x - unite.x, a.y - unite.y)
      if (d <= unite.zoneDetection && d < meilleureDist) { meilleur = a; meilleureDist = d }
    }
    return meilleur
  }

  function mettreAJourUnite(unite, dt) {
    if (unite.pv <= 0) return
    if (unite.immobile) return // encaisse les dégâts, rien d'autre
    if (unite.etat === 'activation') {
      unite.activation -= dt
      if (unite.activation <= 0) unite.etat = 'marche'
      return
    }

    // Priorité à une unité ennemie détectée à portée, sinon le château adverse.
    const ennemiProche = ennemiLePlusProche(unite)
    let cibleX, cibleY, distCible, rayonCible

    if (ennemiProche) {
      cibleX = ennemiProche.x; cibleY = ennemiProche.y
      distCible = Math.hypot(cibleX - unite.x, cibleY - unite.y)
      rayonCible = rayonUnite(ennemiProche)
    } else {
      const c = pointCastle(unite.team)
      cibleX = c.x; cibleY = c.y
      distCible = Math.hypot(cibleX - unite.x, cibleY - unite.y)
      rayonCible = 26
    }

    if (distCible - rayonCible <= unite.porte) {
      unite.etat = 'attaque'
      unite.cooldownAttaque -= dt
      if (unite.cooldownAttaque <= 0) {
        unite.cooldownAttaque = unite.cooldownAttaqueBase
        if (ennemiProche) {
          ennemiProche.pv = Math.max(0, ennemiProche.pv - unite.degats)
        } else if (unite.team === 'joueur') {
          ennemiChateauPV = Math.max(0, ennemiChateauPV - unite.degats)
        } else {
          joueurChateauPV = Math.max(0, joueurChateauPV - unite.degats)
        }
      }
    } else {
      unite.etat = 'marche'
      // Déplacement en ligne droite fixée au moment de la pose, libre
      // (non contraint par la grille hexagonale).
      unite.x += unite.dirX * unite.vitesseMarche * dt / 1000
      unite.y += unite.dirY * unite.vitesseMarche * dt / 1000
    }
  }

  function mettreAJourUnites(dt) {
    for (const u of unitesJoueur) mettreAJourUnite(u, dt)
    for (const u of unitesEnnemi) mettreAJourUnite(u, dt)
    unitesJoueur = unitesJoueur.filter(u => u.pv > 0)
    unitesEnnemi = unitesEnnemi.filter(u => u.pv > 0)
  }

  function dessinerUnite(u) {
    const r = rayonUnite(u)
    const couleur = u.team === 'joueur' ? '#2563eb' : '#dc2626'
    ctx.beginPath()
    ctx.arc(u.x, u.y, r, 0, Math.PI * 2)
    ctx.fillStyle = couleur
    ctx.fill()
    ctx.strokeStyle = '#00000088'
    ctx.lineWidth = 2
    ctx.stroke()

    ctx.font = Math.round(13 * (u.taille || 1)) + 'px sans-serif'
    ctx.textAlign = 'center'
    ctx.textBaseline = 'middle'
    ctx.fillText(u.emoji, u.x, u.y + 1)

    // Barre de vie et icône d'activation : positionnées juste au-dessus
    // du cercle de l'unité, quelle que soit sa taille.
    const w = 28, h = 4
    const yBarre = u.y - r - 10
    const frac = Math.max(0, u.pv / u.pvMax)
    ctx.fillStyle = '#000000aa'
    ctx.fillRect(u.x - w / 2, yBarre, w, h)
    ctx.fillStyle = frac > 0.5 ? '#22c55e' : (frac > 0.25 ? '#f59e0b' : '#ef4444')
    ctx.fillRect(u.x - w / 2, yBarre, w * frac, h)

    if (u.etat === 'activation') {
      ctx.font = '11px sans-serif'
      ctx.fillStyle = '#ffffffcc'
      ctx.fillText('⏳', u.x, yBarre - 6)
    }
  }

  function dessinerUnites() {
    for (const u of unitesJoueur) dessinerUnite(u)
    for (const u of unitesEnnemi) dessinerUnite(u)
  }

  // ─── Zone de pose (surlignée pendant un glisser) ───────────────
  let enTrainDeGlisser = false
  function dessinerZoneDepot() {
    if (!enTrainDeGlisser) return
    const carte = CARTES[carteEnCours]

    // Carte à placement libre (sort, ex: statue) : toute la grille est
    // utilisable, on se contente de surligner la case survolée.
    if (carte && carte.placementLibre) {
      ctx.fillStyle = '#a855f715'
      ctx.fillRect(MARGE, gridOffsetY, canvas.width - 2 * MARGE, gridH)
      if (hexSurvole) {
        drawHex(hexSurvole.cx, hexSurvole.cy, R - 1.2, '#a855f788', '#d8b4fe', 2.5)
      }
      return
    }

    const { yMin, yMax } = calculerZonePose()
    ctx.fillStyle = '#2563eb18'
    ctx.fillRect(MARGE, yMin, canvas.width - 2 * MARGE, yMax - yMin)
    ctx.strokeStyle = '#2563eb55'
    ctx.setLineDash([5, 4])
    ctx.strokeRect(MARGE, yMin, canvas.width - 2 * MARGE, yMax - yMin)
    ctx.setLineDash([])

    // Hexagone précisément survolé par le curseur/doigt : s'illumine en
    // bleu s'il est posable (notre zone), en rouge sinon.
    if (hexSurvole) {
      const valide = hexSurvole.cy >= yMin - 1 && hexSurvole.cy <= yMax + 1
      drawHex(
        hexSurvole.cx, hexSurvole.cy, R - 1.2,
        valide ? '#3b82f688' : '#ef444466',
        valide ? '#93c5fd' : '#fca5a5',
        2.5
      )
    }
  }

  // ─── Fond de l'arène ─────────────────────────────────────────
  function drawBg() {
    ctx.fillStyle = C.bg
    ctx.fillRect(0, 0, canvas.width, canvas.height)

    // Séparateurs visuels château / grille
    ctx.fillStyle = '#ffffff08'
    ctx.fillRect(0, CASTLE_PX, canvas.width, 4)
    ctx.fillRect(0, canvas.height - CASTLE_PX - 4, canvas.width, 4)
  }

  // ─── Helpers ─────────────────────────────────────────────────
  function rect(x, y, w, h) {
    ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h))
  }

  // ─── Rendu principal ─────────────────────────────────────────
  function render() {
    drawBg()
    drawGrid()
    dessinerZoneDepot()
    drawCastle(false) // ennemi (haut)
    drawCastle(true)  // joueur (bas)
    dessinerUnites()
  }

  // ─── Boucle de jeu ──────────────────────────────────────────
  function boucleDeJeu(timestamp) {
    if (!dernierTimestamp) dernierTimestamp = timestamp
    const dt = Math.min(50, timestamp - dernierTimestamp) // dt plafonné (onglet en arrière-plan)
    dernierTimestamp = timestamp

    if (partieCommencee && !partieTerminee) {
      mettreAJourUnites(dt)

      tempsDepuisSpawnEnnemi += dt
      if (tempsDepuisSpawnEnnemi >= INTERVALLE_SPAWN_ENNEMI) {
        tempsDepuisSpawnEnnemi -= INTERVALLE_SPAWN_ENNEMI
        spawnEnnemiAleatoire()
      }

      if (ennemiChateauPV <= 0) {
        terminerPartie(true)
      } else if (joueurChateauPV <= 0) {
        terminerPartie(false)
      }
    }

    render()

    requestAnimationFrame(boucleDeJeu)
  }

  window.addEventListener('resize', () => {
    if (canvas) initArena()
  })

  // ─── Glisser-déposer des cartes (souris + tactile via pointer events) ──
  let carteEnCours = null
  let ghostEl = null
  let messageTimeout = null

  function afficherMessage(texte) {
    const el = document.getElementById('battlogy-message')
    el.textContent = texte
    el.classList.add('visible')
    clearTimeout(messageTimeout)
    messageTimeout = setTimeout(() => el.classList.remove('visible'), 1600)
  }

  // Convertit des coordonnées écran (clientX/Y) en coordonnées du canvas,
  // ou null si le point est en dehors du canvas.
  function clientVersCanvas(clientX, clientY) {
    if (!canvas) return null
    const r = canvas.getBoundingClientRect()
    if (clientX < r.left || clientX > r.right || clientY < r.top || clientY > r.bottom) return null
    return {
      x: (clientX - r.left) * (canvas.width / r.width),
      y: (clientY - r.top) * (canvas.height / r.height)
    }
  }

  function tenterPoserCarte(carteId, hex) {
    const carte = CARTES[carteId]
    if (!carte) return
    if (!hex) { afficherMessage('Pose ta carte sur une case du terrain.'); return }
    if (!estPositionValidePourPose(carteId, hex)) {
      afficherMessage(
        carte.placementLibre
          ? 'Case invalide.'
          : "Tu ne peux pas poser cette unité ici pour l'instant."
      )
      return
    }
    if (or < carte.cout) { afficherMessage("Pas assez d'or."); return }
    if (or !== Infinity) or -= carte.cout
    document.getElementById('or-affiche').textContent = or === Infinity ? '∞' : or
    // La carte est posée exactement au centre de la case (pas à l'endroit
    // précis du curseur/doigt).
    poserCarte(carte, hex.cx, hex.cy, 'joueur')
  }

  function initGlisserDeposer() {
    const cartes = document.querySelectorAll('.carte-main')
    cartes.forEach(el => {
      el.addEventListener('pointerdown', (e) => {
        if (!partieCommencee || partieTerminee) return
        e.preventDefault()
        carteEnCours = el.dataset.carte
        ghostEl = document.createElement('div')
        ghostEl.className = 'carte-ghost'
        ghostEl.textContent = CARTES[carteEnCours]?.emoji || ''
        document.body.appendChild(ghostEl)
        deplacerGhost(e.clientX, e.clientY)
        document.addEventListener('pointermove', pendantGlisser)
        document.addEventListener('pointerup', finGlisser)
      })
    })
  }

  function deplacerGhost(cx, cy) {
    if (!ghostEl) return
    ghostEl.style.left = cx + 'px'
    ghostEl.style.top = cy + 'px'
  }

  function pendantGlisser(e) {
    enTrainDeGlisser = true
    deplacerGhost(e.clientX, e.clientY)

    const pt = clientVersCanvas(e.clientX, e.clientY)
    hexSurvole = pt ? trouverHexProche(pt.x, pt.y) : null
  }

  function finGlisser(e) {
    document.removeEventListener('pointermove', pendantGlisser)
    document.removeEventListener('pointerup', finGlisser)
    enTrainDeGlisser = false
    if (ghostEl) { ghostEl.remove(); ghostEl = null }

    if (carteEnCours) {
      const pt = clientVersCanvas(e.clientX, e.clientY)
      const hex = pt ? trouverHexProche(pt.x, pt.y) : null
      tenterPoserCarte(carteEnCours, hex)
    }
    hexSurvole = null
    carteEnCours = null
  }

  // ─── Écran de démarrage / fin de partie ────────────────────────
  function actualiserCartesDisponibles(disponible) {
    document.querySelectorAll('.carte-main').forEach(el => el.classList.toggle('indisponible', !disponible))
  }

  function afficherEcran(titre, texte, texteBouton) {
    document.getElementById('overlay-titre').textContent = titre
    document.getElementById('overlay-texte').textContent = texte
    document.getElementById('btn-lancer').textContent = texteBouton
    document.getElementById('arena-overlay').classList.remove('cachee')
    actualiserCartesDisponibles(false)
  }

  function masquerEcran() {
    document.getElementById('arena-overlay').classList.add('cachee')
  }

  function demarrerPartie() {
    // Réinitialise entièrement la partie (utile aussi pour « Rejouer »).
    unitesJoueur = []
    unitesEnnemi = []
    joueurChateauPV = joueurChateauPVMax
    ennemiChateauPV = ennemiChateauPVMax
    tempsDepuisSpawnEnnemi = 0
    hexSurvole = null
    partieTerminee = false
    partieCommencee = true
    masquerEcran()
    actualiserCartesDisponibles(true)
  }

  function terminerPartie(victoire) {
    partieTerminee = true
    afficherEcran(
      victoire ? '🏆 Victoire !' : '💀 Défaite…',
      victoire ? 'Le château ennemi est détruit.' : 'Ton château a été détruit.',
      'Rejouer'
    )
  }

  document.getElementById('btn-lancer').addEventListener('click', demarrerPartie)

  document.getElementById('or-affiche').textContent = or === Infinity ? '∞' : or
  initGlisserDeposer()
  </script>
</body>
</html>
